  const need = {PG:1,SG:1,SF:1,PF:1,C:1};
  for(const p of rs){
    if(need[p.pos]>0 && starters.length<5){ need[p.pos]--; starters.push(p.id); }
  }
  for(const p of rs){
    if(starters.length>=5) break;
    if(starters.indexOf(p.id)<0) starters.push(p.id);
  }
  const minutes = {};
  const rest = rs.filter(p=>starters.indexOf(p.id)<0).slice(0, 7);
  const startMin = [34,33,32,30,28];
  starters.forEach((id,i)=>{ minutes[id] = startMin[i]; });
  const benchSlots = [22,18,14,10,8,6,4];
  rest.forEach((p,i)=>{ minutes[p.id] = benchSlots[i]||3; });
  return {starters:starters, minutes:minutes};
}
function minutesOf(L,t,pid){
  if(!t.lineup) t.lineup = autoLineup(L,t);
  const m = t.lineup.minutes[pid];
  return m===undefined? 0 : m;
}
function activePlayers(L, t){
  // 出场轮换：按分钟>0 且未伤
  if(!t.lineup) t.lineup = autoLineup(L,t);
  const out = [];
  for(const pid in t.lineup.minutes){
    const p = L.byId[pid];
    if(!p || p.tid!==t.id) continue;
    if(p.injured) continue;
    if(t.lineup.minutes[pid]<=0) continue;
    out.push(p);
  }
  if(out.length<5){
    const rs = rosterOf(L,t).filter(p=>!p.injured).sort((a,b)=>b.ovr-a.ovr);
    for(const p of rs){ if(out.length>=5) break; if(out.indexOf(p)<0) out.push(p); }
  }
  return out;
}
function addNewsBase(L, txt, tag){
  L.news.unshift({d:L.day, y:L.year, t:txt, tag:tag||""});
  if(L.news.length>200) L.news.pop();
}

/* ============================================================
   模块: 02 比赛模拟引擎
   ============================================================ */

const TUNE = {
  POSS: 99.5, TO: 0.126, ORB: 0.228,
  FT2: 0.145, FT3: 0.0295, AND1: 0.052,
  S2: 0.18, K2: 0.0215,
  S3: -0.60, K3: 0.0225,
  SFT: 1.29, KFT: 0.0195,
  AST: 0.618, BLK: 0.078, STL: 0.545, HCA: 2.4
};
function sig(x){ return 1/(1+Math.exp(-x)); }

function usageW(p){
  const r=p.r;
  const u = 0.34*r.ins + 0.24*r.mid + 0.24*r.tp + 0.18*r.han;
  return Math.pow(Math.max(4,u), 2.3) * (p._fire||1);
}
function tpTend(p){
  const posB = {PG:0.055, SG:0.085, SF:0.035, PF:-0.02, C:-0.065}[p.pos]||0;
  return clamp(0.205 + (p.r.tp-55)*0.0072 + posB, 0.03, 0.62);
}
function def2Of(unit){
  let s=0; for(const p of unit) s += 0.5*p.r.diq + 0.3*p.r.blk + 0.2*p.r.str; return s/unit.length;
}
function def3Of(unit){
  let s=0; for(const p of unit) s += 0.7*p.r.diq + 0.3*p.r.spd; return s/unit.length;
}
function wpick(list, weightFn, exclude){
  let tot=0; const ws=[];
  for(const it of list){ if(it===exclude){ws.push(0);continue;} const w=weightFn(it); ws.push(w); tot+=w; }
  if(tot<=0) return list[0];
  let x = Math.random()*tot;
  for(let i=0;i<list.length;i++){ x-=ws[i]; if(x<=0) return list[i]; }
  return list[list.length-1];
}

/* 轮换计划：24 段，每段 2 分钟 */
function buildRotation(L, t){
  let act = activePlayers(L, t);
  if(act.length<5){
    const rest = rosterOf(L,t).sort((a,b)=>b.ovr-a.ovr);
    for(const p of rest){ if(act.length>=5) break; if(act.indexOf(p)<0) act.push(p); }
  }
  const target = {}; let tot=0;
  for(const p of act){ let m = t.lineup.minutes[p.id]; if(m===undefined||m===null) m = 0;
    if(m<=0) m = 6; target[p.id]=m*60; tot += m; }
  const scale = tot>240 ? 240/tot : 1;
  const played = {};
  const plan = [];
  for(let s=0;s<24;s++){
    const cand = act.map(p=>{
      const fat = (s>0 && plan[s-1].some(x=>x.id===p.id)) ? 26 : 0;
      const need = (target[p.id]||0)*scale - (played[p.id]||0) + fat;
      return {p:p, need:need};
    }).sort((x,y)=> y.need - x.need);
    const five = cand.slice(0,5).map(c=>c.p);
    five.forEach(p=>{ played[p.id] = (played[p.id]||0)+120; });
    plan.push(five);
  }
  return {plan:plan, played:played};
}

function newLine(){
  return {sec:0,pts:0,reb:0,orb:0,drb:0,ast:0,stl:0,blk:0,to:0,pf:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0};
}

function simGame(L, hTid, aTid, opts){
  opts = opts||{};
  const H = L.teams[hTid], A = L.teams[aTid];
  const rbH = buildRotation(L,H), rbA = buildRotation(L,A);
  const rotH = rbH.plan, rotA = rbA.plan;
  const box = {};
  const get = (pid)=>{ if(!box[pid]) box[pid]=Object.assign({pid:pid}, newLine()); return box[pid]; };
  const qs = [[0,0],[0,0],[0,0],[0,0]];
  const qW = [0.243,0.250,0.250,0.257];
  let paceP = TUNE.POSS
    + (H.strat.tempo-1)*3.4 + (A.strat.tempo-1)*3.4
    + (A.strat.tempo - H.strat.tempo)*0.6 + gauss(0,3.0);
  paceP = clamp(paceP, 86, 114);
  const possH = Math.round(paceP*(1+gauss(0,0.012)));
  const possA = Math.round(paceP*(1+gauss(0,0.012)));

  // 球队每节命中数缓存(用于和局)
  const homeHca = TUNE.HCA, awayHca = -0.6;

  for(let q=0;q<4;q++){
    const ph = Math.round(possH*qW[q]);
    const pa = Math.round(possA*qW[q]);
    const last = (q===3);
    runHalf(H, A, ph, q, true, homeHca, last);
    runHalf(A, H, pa, q, false, awayHca, last);
  }
  function segIdx(q, i, n){
    const s = Math.floor(i/Math.max(1,Math.round(n/6)));
    return q*6 + clamp(s,0,5);
  }

  function runHalf(off, def, poss, q, isHome, hca, last){
    const rotOff = isHome? rotH : rotA;
    const rotDef = isHome? rotA : rotH;
    const toRate = clamp(TUNE.TO * (1 + (avgOf(off,'han')-avgOf(def,'stl'))*0.0042), 0.075, 0.20);
    for(let i=0;i<poss;i++){
      const sIdx = segIdx(q, i, poss);
      const o5 = rotOff[sIdx], d5 = rotDef[sIdx];
      const d2 = def2Of(d5), d3 = def3Of(d5);
      // 失误
      if(Math.random() < toRate){
        const tk = wpick(o5, p=>Math.pow(p.r.han*0.6+p.r.pas*0.4,1.6));
        get(tk.id).to++;
        if(Math.random() < TUNE.STL){
          const th = wpick(d5, p=>Math.pow(p.r.stl,2.2));
          get(th.id).stl++;
        }
        continue;
      }
      let ext = 0;
      let live = true;
      let first = true;
      while(live && ext<4){
        live = false; ext++;
        let scorer = wpick(o5, usageW);
        if(last && Math.abs(qs[0][isHome?0:1]+qs[1][isHome?0:1]+qs[2][isHome?0:1]+qs[3][isHome?0:1]
            - (qs[0][isHome?1:0]+qs[1][isHome?1:0]+qs[2][isHome?1:0]+qs[3][isHome?1:0]))<9)
          scorer = wpick(o5, p=> usageW(p)*(p.ovr>82?1.5:0.85));
        const is3 = Math.random() < tpTend(scorer);
        const ln = get(scorer.id);
        // 犯规
        const fpr = is3? TUNE.FT3 : TUNE.FT2;
        if(Math.random() < fpr){
          const dfd = wpick(d5, p=>Math.pow(Math.max(6,100-p.r.diq)*0.5+p.r.blk*0.5, 1.8));
          get(dfd.id).pf++;
          const n = is3?3:2;
          ln.fta += n;
          for(let k=0;k<n;k++){ if(Math.random() < ftp(scorer)){ ln.ftm++; ln.pts++; qs[q][isHome?0:1]++; } }
          if(!is3 && Math.random()<0.02){ ln.fga++; } // 技术性忽略
          live = false; continue;
        }
        if(is3){
          ln.tpa++; ln.fga++;
          if(Math.random() < p3s(scorer, d3, hca)){
            ln.tpm++; ln.fgm++; ln.pts+=3; qs[q][isHome?0:1]+=3;
            if(Math.random()<TUNE.AST){
              const as = wpick(o5.filter(p=>p.id!==scorer.id), p=>Math.pow(p.r.pas,2.4));
              if(as) get(as.id).ast++;
            }
            if(Math.random()<TUNE.AND1){ ln.fta++; if(Math.random()<ftp(scorer)){ ln.ftm++;ln.pts++;qs[q][isHome?0:1]++; } }
          }else{
            if(Math.random()<TUNE.BLK*0.18){
              const bl = wpick(d5, p=>Math.pow(p.r.blk,2.6)); get(bl.id).blk++;
              get(wpick(d5,p=>Math.pow(p.r.drb,2.0)).id).drb++;
            }else live = reb(o5,d5,get,true);
          }
        }else{
          ln.fga++;
          if(Math.random() < p2s(scorer, d2, hca)){
            ln.fgm++; ln.pts+=2; qs[q][isHome?0:1]+=2;
            if(Math.random()<TUNE.AST){
              const as = wpick(o5.filter(p=>p.id!==scorer.id), p=>Math.pow(p.r.pas,2.4));
              if(as) get(as.id).ast++;
            }
            if(Math.random()<TUNE.AND1){ ln.fta++; if(Math.random()<ftp(scorer)){ ln.ftm++;ln.pts++;qs[q][isHome?0:1]++; } }
          }else{
            if(Math.random()<TUNE.BLK){
              const bl = wpick(d5, p=>Math.pow(p.r.blk,2.6)); get(bl.id).blk++;
              get(wpick(d5,p=>Math.pow(p.r.drb,2.0)).id).drb++;
            }else live = reb(o5,d5,get,is3);
          }
        }
      }
    }
  }
  function reb(o5,d5,get,is3){
    const orbAdj = TUNE.ORB * (is3?1.06:0.96);
    if(Math.random() < orbAdj){
      const o = wpick(o5, p=>Math.pow(p.r.orb,2.4));
      const l=get(o.id); l.reb++; l.orb++;
      return true;
    }
    const d = wpick(d5, p=>Math.pow(p.r.drb,2.2));
    const l=get(d.id); l.reb++; l.drb++;
    return false;
  }
  function avgOf(t,k){
    const act = activePlayers(L,t); let s=0;
    for(const p of act) s += p.r[k];
    return act.length? s/act.length : 50;
  }
  function ftp(p){ return clamp(sig(TUNE.SFT + TUNE.KFT*(p.r.ft-75)), 0.36, 0.96); }
  function p2s(p, d2, hca){
    const o2 = 0.55*p.r.ins + 0.45*p.r.mid;
    return clamp(sig(TUNE.S2 + TUNE.K2*(o2 + hca - d2)), 0.26, 0.76);
  }
  function p3s(p, d3, hca){
    const o3 = 0.78*p.r.tp + 0.22*p.r.mid;
    return clamp(sig(TUNE.S3 + TUNE.K3*(o3 + hca - d3)), 0.14, 0.58);
  }
  const hs = qs.reduce((a,q)=>a+q[0],0), as = qs.reduce((a,q)=>a+q[1],0);
  const minsec = {};
  for(const k in rbH.played) minsec[k] = rbH.played[k];
  for(const k in rbA.played) minsec[k] = (minsec[k]||0) + rbA.played[k];
  return {hs:hs, as:as, qs:qs, box:box, minsec:minsec, hTid:hTid, aTid:aTid};
}

/* 把比赛结果写入统计 */
function applyGame(L, res){
  const H = L.teams[res.hTid], A = L.teams[res.aTid];
  H.ptsF += res.hs; H.ptsA += res.as; H.gp++;
  A.ptsF += res.as; A.ptsA += res.hs; A.gp++;
  for(const pid in res.box){
    const s = res.box[pid];
    const p = L.byId[pid]; if(!p) continue;
    if(!p.st) p.st = newLine();
    p.st.sec += Math.round((res.minsec && res.minsec[pid]) || 0);
    for(const k in s){ if(k==='pid'||k==='sec') continue; p.st[k] = (p.st[k]||0) + s[k]; }
    p.st.g = (p.st.g||0)+1;
    // 先发
    if(H.lineup && H.lineup.starters.indexOf(+pid)>=0 && p.tid===H.id) p.st.gs=(p.st.gs||0)+1;
    else if(A.lineup && A.lineup.starters.indexOf(+pid)>=0 && p.tid===A.id) p.st.gs=(p.st.gs||0)+1;
    // 伤病（分级判定：轻伤 / 中度伤 / 重伤 / 毁灭性伤病）
    if(!p.injured && Math.random() < 0.00085*(s.sec/1500+0.6)*injProbFactor(L,p)){
      const sev = injSeverityRoll(L,p);
      const days = injDaysFor(L,p,sev);
      p.injured = {d:days, t: injTextOf(sev), s:sev};
      injRecord(L,p,sev,days);
      addNews(L, "【伤病】"+p.name+"（"+L.teams[p.tid].abbr+"）"+p.injured.t+"（"+injTierName(sev)+"），预计缺阵 "+days+" 天。"+
        (sev>=3? "队医评估：伤势严重，长期缺阵，生涯存在隐患。":""), "inj");
    }
  }
  if(res.hs>res.as){
    H.w++; A.l++;
    H.streak = H.streak>=0? H.streak+1 : 1;
    A.streak = A.streak<=0? A.streak-1 : -1;
    if(H.conf===A.conf){ H.cw++; A.cl++; }
    if(H.div===A.div){ H.dw++; A.dl++; }
  }else{
    A.w++; H.l++;
    A.streak = A.streak>=0? A.streak+1 : 1;
    H.streak = H.streak<=0? H.streak-1 : -1;
    if(H.conf===A.conf){ A.cw++; H.cl++; }
    if(H.div===A.div){ A.dw++; H.dl++; }
  }
  H.last10.push(res.hs>res.as?1:0); if(H.last10.length>10) H.last10.shift();
  A.last10.push(res.as>res.hs?1:0); if(A.last10.length>10) A.last10.shift();
}
/* ================= 伤病分级系统 =================
   1 轻伤（数天~两周） / 2 中度伤（2~5 周） / 3 重伤（1 个月以上，生涯隐患） / 4 毁灭性伤病（赛季报销，可能提前退役）
   受伤概率受医疗中心等级、球员耐久、年龄与伤病史影响 */
const INJ_TIER = [null,
  {n:"轻伤",     txt:["脚踝扭伤","膝盖挫伤","背部痉挛","手腕扭伤","脚部酸痛","生病","手指挫伤"]},
  {n:"中度伤",   txt:["腿筋拉伤","小腿拉伤","肩部不适","腹股沟拉伤","脚踝扭伤（二级）","手指骨折"]},
  {n:"重伤",     txt:["膝盖韧带扭伤","脚部应力性骨折","肩关节撕裂","椎间盘损伤","手腕骨折","脑震荡保护"]},
  {n:"毁灭性伤病", txt:["跟腱断裂","前十字韧带撕裂","膝盖软骨重伤","腿部复合骨折","髌骨骨折"]}];
const INJ = INJ_TIER[1].txt.concat(INJ_TIER[2].txt);
function injTierName(s){ return (INJ_TIER[s]||INJ_TIER[1]).n; }
function injTextOf(s){ return pick((INJ_TIER[s]||INJ_TIER[1]).txt); }
function injText(){ return injTextOf(1); }
/* 医疗中心(f2)与球员耐久影响受伤概率 */
function injProbFactor(L,p){
  let f = 1;
  const med = (typeof facilityLv==="function")? facilityLv(L,"f2") : 0;
  f *= Math.max(0.45, 1 - med*0.08);
  if(p.age>=34) f *= 1.28; else if(p.age>=31) f *= 1.12; else if(p.age>=28) f *= 1.05;
  const dur = (p.r && p.r.dur)? p.r.dur : 60;
  f *= clamp(1.18 - (dur-55)*0.008, 0.70, 1.35);
  f *= 1 + Math.min(0.45, (p.injSev||0)*0.010);
  return f;
}
/* 严重度抽样：轻中伤为主，重伤与毁灭性伤病罕见；年龄与伤病史推高风险 */
function injSeverityRoll(L,p){
  const r = Math.random();
  const ageB = p.age>=34? 0.06 : p.age>=31? 0.035 : p.age>=28? 0.015 : 0;
  const hist = Math.min(0.07, (p.injSev||0)*0.005) + Math.min(0.06, (p.bigInj||0)*0.02);
  if(r < 0.040 + ageB*0.5 + hist*0.45) return 4;
  if(r < 0.185 + ageB + hist) return 3;
  if(r < 0.520 + ageB*0.6) return 2;
  return 1;
}
/* 伤停天数：医疗中心等级缩短康复周期 */
function injDaysFor(L,p,sev){
  let d;
  if(sev<=1) d = 3 + ri(9);
  else if(sev===2) d = 12 + ri(24);
  else if(sev===3) d = 38 + ri(52);
  else d = 95 + ri(120);
  const med = (typeof facilityLv==="function")? facilityLv(L,"f2") : 0;
  d = Math.max(2, Math.round(d*(1 - med*0.06)));
  return d;
}
/* 记录伤病：生涯负荷 / 大伤次数 / 大伤对能力与潜力的侵蚀 */
function injRecord(L,p,sev,days){
  if(!p.injHist) p.injHist = [];
  p.injHist.push({y:L.year, s:sev, d:days, t:p.injured.t});
  if(p.injHist.length>26) p.injHist.shift();
  p.injSev = (p.injSev||0) + sev;
  p.injLoad = Math.round(((p.injLoad||0) + sev + days/70)*100)/100;
  if(sev>=3){
    p.bigInj = (p.bigInj||0) + 1;
    if(sev>=4) p.sev4 = (p.sev4||0) + 1;
    // 大伤侵蚀：属性与潜力一次性受损，毁灭性伤病冲击更大
    const keys = ATTR_KEYS.slice(); shuffle(keys);
    const n = Math.min(keys.length, 5 + ri(4));
    for(let i=0;i<n;i++) p.r[keys[i]] = clamp(p.r[keys[i]] - (1+ri(2)), 18, 99);
    p.pot = clamp(p.pot - (sev>=4? (3+ri(4)) : (1+ri(2))), 20, 99);
    for(const k of ATTR_KEYS) p.r[k] = Math.round(p.r[k]);
    p.ovr = calcOvr(p);
    p.pot = Math.max(p.pot, p.ovr);
  }
}

function teamRating(L,t){
  const rs = rosterOf(L,t); if(!rs.length) return 40;
  const st = startersOf(L,t);
  let s=0, wsum=0;
  const mins = t.lineup.minutes;
  for(const p of rs){
    if(p.injured) continue;
    const m = mins[p.id]!==undefined? mins[p.id] : 4;
    const w = m/40;
    s += p.ovr*w; wsum += w;
  }
  return wsum>0? s/wsum : 40;
}

/* ============================================================
   模块: 03 赛季推进 / 排名 / 季后赛 / 颁奖 / 选秀 / 自由市场 / 交易 / 成长
   ============================================================ */

function confTeams(L, conf){ return L.teams.filter(t=>t.conf===conf); }
function winPct(t){ const g=t.w+t.l; return g? t.w/g : 0; }
function standings(L, conf){
  const arr = conf? confTeams(L,conf) : L.teams.slice();
  return arr.sort((a,b)=> winPct(b)-winPct(a) || (b.w-a.w));
}
function divStandings(L, div){
  return L.teams.filter(t=>t.div===div).sort((a,b)=> winPct(b)-winPct(a) || b.w-a.w);
}
function leagueRank(L, tid){
  const st = standings(L, null);
  const i = st.findIndex(t=>t.id===tid);
  return i+1;
}
function seedConf(L, conf){
  return standings(L,conf).slice(0,10);
}

function playDay(L){
  const day = L.sched[L.day];
  if(!day) return {games:0, results:[], userGame:null};
  const results = []; let userGame = null;
  for(const g of day){
    if(g.done) continue;
    const res = simGame(L, g.h, g.a, {});
    g.hs = res.hs; g.as = res.as; g.done = true; g.qs = res.qs; g.box = res.box;
    applyGame(L, res);
    results.push(g);
    if(g.h===L.myTid || g.a===L.myTid) userGame = g;
  }
  L.day++;
  doInjuriesTick(L);
  if(L.day>=96 && !L.allStarDone && L.phase==="regular") runAllStar(L);
  return {games:results.length, results:results, userGame:userGame};
}
function doInjuriesTick(L){
  for(const p of L.players){
    if(p.injured){ p.injured.d--; if(p.injured.d<=0) p.injured=null; }
  }
}
function isLastDay(L){ return L.day >= L.sched.length; }
function nextUserGame(L){
  for(let d=L.day; d<L.sched.length; d++){
    for(const g of L.sched[d]) if(!g.done && (g.h===L.myTid||g.a===L.myTid)) return {g:g, d:d};
  }
  return null;
}
function simToNextUser(L, maxDays){
  let n=0; const my = nextUserGame(L);
  const lim = my? my.d : L.sched.length;
  while(L.day < lim && n < (maxDays||400)){ playDay(L); n++; }
  return n;
}
function simRestOfSeason(L){
  let n=0;
  while(L.day < L.sched.length && n<400){ playDay(L); n++; }
  return n;
}

/* ---------- 赛季结算 ---------- */
function seasonOver(L){
  L.phase = "playoffs";
  if(!L.awards && typeof computeAwards === "function") computeAwards(L);
  buildPlayoffs(L);
  return L.po;
}
function buildPlayoffs(L){
  const po = {east:{}, west:{}, round:0, games:[], log:[], done:false, champ:null, fmvp:null};
  L.teams.forEach(t=>{ t.playoff = false; });
  ["E","W"].forEach(c=>{
    const key = c==="E"?"east":"west";
    const t10 = seedConf(L, c);
    po[key].seeds = t10;
    po[key].series = null;
  });
  L.po = po;
  runPlayIn(L);
}
function runPlayIn(L){
  const out = {};
  ["E","W"].forEach(c=>{
    const key = c==="E"?"east":"west";
    const s = L.po[key].seeds;
    const r1 = simSeries(L, s[6].id, s[7].id, 1, true);
    const r2 = simSeries(L, s[8].id, s[9].id, 1, true);
    const r3 = simSeries(L, r1.w, r2.w, 1, true);
    const seeds = s.slice(0,7).concat([L.teams[r3.w]]);
    seeds.forEach(t=>{ t.playoff = true; });
    L.po[key].seeds = seeds;
    L.po.log.push({t:"附加赛 "+(c==="E"?"东部":"西部"), t1:r1.w, t2:r1.lose, w:r1.w, l:r1.lose, r:"单场", sc:""});
  });
  L.po.round = 1;
  L.po.bracket = {};
  ["E","W"].forEach(c=>{
    const key = c==="E"?"east":"west";
    const s = L.po[key].seeds;
    L.po.bracket[key] = [[s[0].id,s[7].id],[s[3].id,s[4].id],[s[1].id,s[6].id],[s[2].id,s[5].id]];
  });
}
function simSeries(L, t1, t2, round, single){
  const need = single?1:4;
  const better = (L.teams[t1].w >= L.teams[t2].w)? t1 : t2;
  const worse = better===t1? t2 : t1;
  const homeSeq = single? [better] : [better,better,worse,worse,better,worse,better];
  let w1=0, w2=0, g=0;
  while(w1<need && w2<need){
    const h = homeSeq[g % homeSeq.length];
    const a = h===better? worse : better;
    const res = simGame(L, h, a, {po:true});
    if(res.hs>res.as){ if(h===t1) w1++; else w2++; }
    else { if(a===t1) w1++; else w2++; }
    g++;
    if(g>9) break;
  }
  return {t1:t1, t2:t2, w1:w1, w2:w2, w:w1>w2?t1:t2, lose:w1>w2?t2:t1, games:g};
}
function simPlayoffRound(L){
  const po = L.po;
  const round = po.round;
  const res = {};
  ["E","W"].forEach(c=>{
    const key = c==="E"?"east":"west";
    const br = po.bracket[key];
    const out = [];
    const winners = [];
    for(let i=0;i<br.length;i++){
      const s = simSeries(L, br[i][0], br[i][1], round, false);
      out.push(s); winners.push(s.w);
    }
    const nb = [];
    for(let i=0;i<winners.length;i+=2) nb.push([winners[i], winners[i+1]]);
    po.bracket[key] = nb;
    res[key] = out;
  });
  po.round++;
  return res;
}
function simPlayoffsAll(L, interactive){
  const log = [];
  for(let r=0;r<3;r++){
    const res = simPlayoffRound(L);
    ["E","W"].forEach(c=>{
      const key = c==="E"?"east":"west";
      (res[key]||[]).forEach(s=>{
        log.push({r:L.po.round-1, t1:s.t1, t2:s.t2, w:s.w, l:s.lose, sc:s.w1+"-"+s.w2});
      });
    });
  }
  const fin = simSeries(L, L.po.bracket.east[0][0], L.po.bracket.west[0][0], 4, false);
  log.push({r:4, t1:fin.t1, t2:fin.t2, w:fin.w, l:fin.lose, sc:fin.w1+"-"+fin.w2});
  L.po.champ = fin.w;
  const ct = L.teams[fin.w];
  ct.titles++; ct.fin++;
  L.teams[fin.lose].fin++;
  L.champ = fin.w;
  // FMVP：冠军阵中综合贡献最高者
  const cands = rosterOf(L, ct).slice().sort((a,b)=> impact(L,b)-impact(L,a));
  const fmvp = cands[0] || null;
  if(fmvp){ fmvp.awards.push({y:L.year, t:"fmvp"}); L.po.fmvp = fmvp.id; }
  L.po.mvp = fmvp? fmvp.id : null;
  L.po.log = log;
  L.po.done = true;
  L.phase = "draft";
  if(!L.draftClass) L.draftClass = genDraftClass(L, 60);
  addNews(L, "【总冠军】"+ct.name+"击败 "+L.teams[fin.lose].name+"（"+fin.w1+"-"+fin.w2+"），夺得 "+L.year+"-"+((L.year+1)%100)+" 赛季总冠军！", "champ");
  if(fmvp) addNews(L, "【FMVP】总决赛最有价值球员："+fmvp.name+"（"+ct.abbr+"）。", "award");
  return log;
}

/* ---------- 奖项 ---------- */
function pg(p,k){ return p.st&&p.st.g? (p.st[k]||0)/p.st.g : 0; }
function impact(L, p){
  if(!p.st || p.st.g < Math.max(12, Math.round(82*0.55))) return -1;
  const g = p.st.g;
  const ts = (p.st.fga>0)? (p.st.pts/(2*(p.st.fga+0.44*p.st.fta))) : 0;
  let v = pg(p,'pts')*1.00 + pg(p,'reb')*1.05 + pg(p,'ast')*1.45 + pg(p,'stl')*2.30 + pg(p,'blk')*2.10
        - pg(p,'to')*1.50 + (ts-0.55)*22 + (p.st.pts/g-18)*0.22;
  const t = L.teams[p.tid];
  v *= 0.52 + 0.48*(t? winPct(t) : .5);
  return Math.round(v*10)/10;
}
function defImpact(L, p){
  if(!p.st || p.st.g < 30) return -1;
  const t = L.teams[p.tid];
  return Math.round((pg(p,'reb')*1.1 + pg(p,'stl')*2.6 + pg(p,'blk')*2.6 + (t? winPct(t)*7:3))*10)/10;
}
function qualifiers(L, extra){
  const arr = L.players.filter(p=>{ if(p.st && p.st.g>=Math.max(12, Math.round(82*0.55))) return true; return false; });
  return arr;
}
function computeAwards(L){
  const q = qualifiers(L);
  const mvp = q.slice().sort((a,b)=> impact(L,b)-impact(L,a)).slice(0,1)[0];
  const dpoy = q.slice().sort((a,b)=> defImpact(L,b)-defImpact(L,a)).slice(0,1)[0];
  const rookies = q.filter(p=> p.exp<=1 && p.age<=22);
  const roy = rookies.sort((a,b)=> impact(L,b)-impact(L,a))[0] || null;
  const mipCand = q.filter(p=> p._prevOvr && p.ovr - p._prevOvr > 2);
  const mip = (mipCand.length? mipCand.sort((a,b)=> (b.ovr-b._prevOvr)-(a.ovr-a._prevOvr))[0] : null);
  const sm = q.filter(p=> minutesOf(L,L.teams[p.tid],p.id) < 30 && p.ovr<79);
  const sixth = sm.sort((a,b)=> impact(L,b)-impact(L,a))[0]||null;
  const allnba = [[],[],[]];
  const sorted = q.slice().sort((a,b)=> impact(L,b)-impact(L,a));
  let cnt={PG:0,SG:0,SF:0,PF:0,C:0};
  const first=[],second=[],third=[];
  for(const p of sorted){
    if(first.length<5 && (cnt[p.pos]||0)<2){ first.push(p); cnt[p.pos]=(cnt[p.pos]||0)+1; }
  }
  for(const p of sorted){ if(first.length>=5)break; if(first.indexOf(p)<0) first.push(p); }
  const c2={PG:0,SG:0,SF:0,PF:0,C:0};
  for(const p of sorted){
    if(first.indexOf(p)>=0) continue;
    if(second.length<5 && (c2[p.pos]||0)<2){ second.push(p); c2[p.pos]=(c2[p.pos]||0)+1; }
  }
  for(const p of sorted){ if(second.length>=5)break; if(first.indexOf(p)<0&&second.indexOf(p)<0) second.push(p); }
  const c3={PG:0,SG:0,SF:0,PF:0,C:0};
  for(const p of sorted){
    if(first.indexOf(p)>=0||second.indexOf(p)>=0) continue;
    if(third.length<5 && (c3[p.pos]||0)<2){ third.push(p); c3[p.pos]=(c3[p.pos]||0)+1; }
  }
  const allstar = sorted.slice(0, 24);
  const aw = {mvp:mvp, dpoy:dpoy, roy:roy, mip:mip, sixth:sixth, allnba:[first,second,third], allstar:allstar, fmvp:null};
  L.awards = aw;
  [["mvp",mvp],["dpoy",dpoy],["roy",roy],["mip",mip],["sixth",sixth]].forEach(x=>{
    if(x[1]) x[1].awards.push({y:L.year, t:x[0]});
  });
  if(mvp) addNews(L,"【MVP】"+L.year+"-"+((L.year+1)%100)+" 常规赛 MVP："+mvp.name+"（"+L.teams[mvp.tid].abbr+"）场均 "+pg(mvp,'pts').toFixed(1)+" 分 "+pg(mvp,'reb').toFixed(1)+" 篮板 "+pg(mvp,'ast').toFixed(1)+" 助攻。","award");
  return aw;
}

/* ---------- 全明星 ---------- */
function runAllStar(L){
  const q = L.players.filter(p=> p.st && p.st.g>=20);
  q.sort((a,b)=> impact(L,b)-impact(L,a));
  const east = q.filter(p=> L.teams[p.tid].conf==="E").slice(0,12);
  const west = q.filter(p=> L.teams[p.tid].conf==="W").slice(0,12);
  east.concat(west).forEach(p=>{ p.allStar++; p.awards.push({y:L.year,t:"allstar"}); });
  L.asGame = {east:east.map(p=>p.id), west:west.map(p=>p.id), done:true};
  addNews(L,"【全明星】"+L.year+"-"+((L.year+1)%100)+" 全明星赛名单公布，东西部各 12 人入选。","award");
  L.allStarDone = true;
}

/* ---------- 选秀 ---------- */
function lotteryOrder(L){
  const noPo = L.teams.filter(t=> !t.playoff).map(t=>({t:t}));
  const poT = L.teams.filter(t=> t.playoff);
  const odds = [140,140,140,125,105,90,75,60,45,30,20,15,10,5];
  const picks = [];
  const pool = noPo.slice();
  // 只对战绩最差的14队乐透
  pool.sort((a,b)=> winPct(a.t)-winPct(b.t));
  const lot = pool.slice(0,14);
  const rest = pool.slice(14);
  const remaining = lot.map((x,i)=>({x:x, w:odds[i]||5}));
  let order = [];
  // 抽前4
  let pool2 = remaining.slice();
  for(let k=0;k<4;k++){
    let tot = pool2.reduce((a,b)=>a+b.w,0);
    let x = Math.random()*tot, sel=0;
    for(let i=0;i<pool2.length;i++){ x-=pool2[i].w; if(x<=0){ sel=i; break; } }
    order.push(pool2[sel].x.t);
    pool2.splice(sel,1);
  }
  // 其余乐透按战绩倒序
  pool2.sort((a,b)=> winPct(a.x.t)-winPct(b.x.t)).forEach(o=>order.push(o.x.t));
  rest.sort((a,b)=> winPct(a.t)-winPct(b.t)).forEach(o=>order.push(o.t));
  // 季后赛球队按战绩倒序
  poT.sort((a,b)=> winPct(a)-winPct(b)).forEach(t=>order.push(t));
  return order;
}
function genDraftClass(L, n){
  const used = {};
  L.players.forEach(p=> used[p.name]=1);
  const out = [];
  for(let i=0;i<n;i++){
    const pos = pick(POS_LIST);
    const tier = i<5? rp(74,86) : i<14? rp(68,80) : i<30? rp(60,74) : i<45? rp(52,66) : rp(42,58);
    const age = 19 + (Math.random()<0.75?0:(Math.random()<0.6?1:2));
    const p = mkPlayer(-1, Math.round(tier), pos, age, used);
    p.name = genName(used);
    p.id = L.nextPid++;
    // 2026-27 赛季结束后的选秀即 2027 届（现实中尚未产生）→ 名单、能力、潜力均为随机生成
    p.draft = {yr:L.year+1, rd: i<30?1:2, pk: (i%30)+1, prospect:true};
    p.exp = 0;
    mkContract(p);
    p.salary = rookieSalOf(i+1);            // 与真实新秀同规则：按总顺位标准档推算新秀合同
    p.yrs = 4;
    p.pot = clamp(p.pot + (i<5? ri(9):(i<14? ri(7): ri(5))), p.ovr, 99);
    out.push(p);
  }
  return out;
}
function runDraft(L){
  const order = lotteryOrder(L);
  const klass = genDraftClass(L, 60);
  const res = [];
  let pi = 0;
  for(let rd=0; rd<2; rd++){
    for(let i=0;i<30;i++){
      const t = order[i];
      const p = klass[pi++];
      if(!p) break;
      // AI 选择：优先位置需求
      p.tid = t.id; p.draft = {yr:L.year+1, rd:rd+1, pk:i+1, prospect:true};
      t.roster.push(p.id);
      L.players.push(p); L.byId[p.id]=p;
      res.push({t:t, p:p});
    }
    order.reverse();
  }
  L.draftRes = res;
  L.draftDone = true;
  return res;
}

/* ---------- 薪资 / 工资帽 ---------- */
function capOf(L){ setCapScaleFrom(L); return CAP * (1 + (L.year-2026)*0.06); }
function taxOf(L){ return TAX * (1 + (L.year-2026)*0.06); }
function apronOf(L){ return APRON1 * (1 + (L.year-2026)*0.06); }
function teamPayroll(L,t){ return payrollOf(L,t); }
function capSpace(L,t){ return Math.round((capOf(L)-payrollOf(L,t))*10)/10; }
/* 穷鬼线：2K/NBA 规则要求球队薪资不得低于工资帽的 90% */
function floorOf(L){ return Math.round(capOf(L)*0.90*10)/10; }
/* 不含穷鬼线调整的"球员实际薪资" */
function basePayroll(L,t){ return Math.round((payrollOf(L,t) - (t.floorAdj||0))*10)/10; }
/* AI 球队薪资低于穷鬼线时，优先用剩余空间签下市场上最合适的球员补足（阵容未满时） */
function enforceFloor(L){
  let fixed = 0;
  for(const t of L.teams){
    if(t.id===L.myTid) continue;                                   // 玩家球队自行管理薪资
    let guard = 0;
    while(basePayroll(L,t) < floorOf(L) && t.roster.length < ROSTER_MAX && guard++ < 6){
      const room = capSpace(L,t);
      if(room < MIN_SAL + 0.05) break;
      const pool = L.players.filter(x=> x.tid<0 && !x.retired && demandOf(L,x) <= room + 0.01)
                            .sort((a,b)=> playerValue(L,b,t.id) - playerValue(L,a,t.id));
      const c = pool[0];
      if(!c) break;
      c.tid = t.id; c.yrs = 2+ri(2); c.tenure = 1; c.faSeasons = 0;
      c.salary = Math.round(clamp(Math.min(demandOf(L,c), room), minSalFor(c), maxSalFor(c))*10)/10;
      c.bonus = mkIncentive(c, c.salary); c.rolePromise = "rotation";
      t.roster.push(c.id); fixed++;
    }
  }
  if(fixed) L.faPool = L.players.filter(x=> x.tid<0 && !x.retired);
  L._floorFixes = fixed;
  return fixed;
}
/* 穷鬼线差额：阵容已满仍不达标的球队，按劳资协议把差额均分给阵中球员（计入球队薪资） */
function floorPenalty(L){
  const fl = floorOf(L), pen = [];
  L.teams.forEach(t=>{
    const base = basePayroll(L,t);
    if(base < fl - 0.01){ t.floorAdj = Math.round((fl-base)*10)/10; pen.push([t.abbr, base, t.floorAdj, t.roster.length]); }
    else t.floorAdj = 0;
  });
  L._floorPen = pen;
  if(pen.length) addNews(L, "【穷鬼线】"+pen.length+" 支球队薪资未达下限（"+fmtM(fl)+"），差额按劳资协议均分给阵中球员并计入薪资。","news");
  return pen;
}
/* 中产特例：超帽球队仍可签下一名外部自由球员，每季一次 */
function mleOf(L,t){
  if(L.mleUsed && L.mleUsed[t.id]) return 0;
  return capMoney(payrollOf(L,t) <= apronOf(L) ? MLE_FULL : MLE_MINI);
}
function enforceCap(L){
  L.players.forEach(p=>{
    if(p.tid<0 || p.retired || !p.salary) return;   // 自由球员保留其真实合同额，签约时再按球龄钳制
    const lo = minSalFor(p), hi = maxSalFor(p);
    if(p.salary < lo - 0.01 || p.salary > hi + 0.01) p.salary = Math.round(clamp(p.salary, lo, hi)*10)/10;
  });
  L.teams.forEach(t=>{
    t.payroll = payrollOf(L,t);
    t.over = t.payroll > taxOf(L);
  });
}

/* ---------- 自由市场 · 2K 机制市场层 ---------- */
function marketValueOf(L, p){ return mvFromOvr(p.ovr, p.age, p.pot); }
/* 市场冷热：待业球员越多，议价越软（久未签约的球员会降价，对齐 2K 自由市场） */
function faDesperation(L){
  const n = L.players.filter(x=> x.tid<0 && !x.retired).length;
  return clamp(1.22 - n/150, 0.80, 1.22);
}
/* 球员要价：市场价值 × 薪资诉求权重 × 市场冷热，受球龄顶薪上限约束 */
function demandOf(L, p){
  if(p.prevTid===undefined) p.prevTid = -1;
  const amb = ambitionOf(p);
  let v = marketValueOf(L, p) * (0.90 + amb.money*0.55) * faDesperation(L);
  if((p.tenure||0)>=3 && p.prevTid>=0) v *= 1.04;      // 完整鸟权球员续约略溢价
  if(p.injured) v *= 0.90;
  return Math.round(clamp(v, minSalFor(p), maxSalFor(p))*10)/10;
}
/* 球队能为该球员开出的最高年薪（鸟权超帽 / 中产 / 双年 / 底薪） */
function maxOfferFor(L, t, p){
  const room = capSpace(L,t), maxSal = maxSalFor(p);
  if(p.prevTid===t.id){
    const bd = birdLevelOf(p.tenure||0);
    if(bd>=2) return Math.round(Math.min(maxSal, Math.max(room, (p.salary||0)*1.20, capOf(L)*0.25))*10)/10;
    if(bd===1) return Math.round(Math.min(maxSal, Math.max(room, (p.salary||0)*1.75, capOf(L)*0.20))*10)/10;
    if(bd===0) return Math.round(Math.min(maxSal, Math.max(room, (p.salary||0)*1.20, MIN_SAL))*10)/10;
  }
  const mle = mleOf(L,t), bae = baeOf(L,t);
  return Math.round(Math.max(MIN_SAL, Math.min(maxSal, Math.max(room, mle, bae)))*10)/10;
}
function makeFA(L){
  const fa = [];
  for(const t of L.teams){
    const keep = [];
    const next = [];
    const rs = sortedRoster(L,t);
    for(const p of rs){
      p.yrs = (p.yrs||1) - 1;
      if(p.yrs<=0 || (p.age>=33 && p.ovr<68)){
        if(p.yrs<=0 && Math.random()<0.72 && t.roster.length>ROSTER_MIN){ next.push(p.id); continue; }
        if(p.yrs<=0){ keep.push(p.id); }
        else { /* 合同到期 */ next.push(p.id); }
      } else keep.push(p.id);
    }
    // 保留名单裁剪到 15
    while(keep.length>ROSTER_MAX){ next.push(keep.pop()); }
    t.roster = keep;
    // 2K 鸟权机制：留队球员连续效力 +1（满 3 年获完整鸟权，可超帽续约）
    keep.forEach(id=>{ const p=L.byId[id]; if(p){ p.tenure = Math.min(9, (p.tenure||0)+1); if(p.prevTid===undefined) p.prevTid = t.id; } });
    next.forEach(id=>{ const p=L.byId[id]; p.prevTid=t.id; p.tid=-1; p.yrs=0; fa.push(p); });
  }
  // 其他已有FA
  L.players.forEach(p=>{
    if(p.tid<0 && fa.indexOf(p)<0) fa.push(p);
    if(p.tid<0){ p.yrs=0; if(p.prevTid===undefined) p.prevTid=-1; }
  });
  // 补齐球队人数改由 aiFreeAgency 末尾的 fillRosters 统一处理（2K 顺序：先鸟权续约，再开放市场，最后补足最低人数）
  purgeStaleFA(L);                     // 2K 式市场清理：久未签约者离开联盟
  // 仍未签约者累计"待业年数"（下个休赛期据此判断去留）
  L.players.forEach(p=>{ if(p.tid<0 && !p.retired) p.faSeasons = (p.faSeasons||0)+1; });
  L.faPool = L.players.filter(p=> p.tid<0 && !p.retired);
  return L.faPool;
}
/* 2K 式自由市场清理：连续多个休赛期无人问津的老将 / 边缘人退出联盟（退役或转战海外） */
function staleFACheck(L, p){
  const fs = p.faSeasons||0, ov = p.ovr||0, ag = p.age||0;
  const vet = vetScoreOf(p), cap = retireCapAge(L, p);
  // 伤病提前退出：反复大伤 + 负荷过高者，市场无人问津
  if((p.bigInj||0)>=2 && ag>=28 && (p.injLoad||0)>=5) return "退役";
  // 高价值老将仍有市场：不按普通年龄线清理，交给生涯上限判定
  if(vet>=82 && ag<38) { /* 保留在池中 */ }
  else if(ag>=cap && vet<84) return "退役";
  else if(ag>=38) return "退役";
  else if(ag>=35 && ov<70) return "退役";
  if(ag>=33 && ov<72) return "退役";
  if(fs>=3) return "海外";
  if(fs>=2 && ov<74) return "海外";
  if(fs>=1 && ag>=28 && ov<66) return "海外";
  if(fs>=1 && ov<62) return "退役";
  return null;
}
function purgeStaleFA(L){
  const gone = [];
  L.players.forEach(p=>{ if(p.tid<0 && !p.retired){ const r = staleFACheck(L,p); if(r) gone.push([p,r]); } });
  if(!gone.length) return 0;
  gone.forEach(g=>{
    const p = g[0];
    p.retired = true; p.retireYear = L.year; p.leaveReason = g[1];
    const pt = (p.prevTid>=0)? L.teams[p.prevTid] : null;
    if(pt && pt.roster){ const i = pt.roster.indexOf(p.id); if(i>=0) pt.roster.splice(i,1); }
  });
  L.players = L.players.filter(p=> !p.retired);
  L.byId = {}; L.players.forEach(p=> L.byId[p.id]=p);
  const retireN = gone.filter(g=> g[1]==="退役").length;
  addNews(L, "【休赛期】"+gone.length+" 名自由球员未获合同离队（退役 "+retireN+" 人、转战海外 "+(gone.length-retireN)+" 人）。", "fa");
  return gone.length;
}

/* ---------- 位置需求 / 球队吸引力（2K 兴趣度模型） ---------- */
const POS_QUOTA = {PG:2.4, SG:3.0, SF:3.0, PF:3.0, C:2.8};   // 14 人轮换的合理位置配置
function needAt(L, t, pos){
  const c = posCount(L, t);
  const want = POS_QUOTA[pos] || 3.0;
  return Math.max(0, Math.round((want-(c[pos]||0))*10)/10);
}
function posNeedOf(L, t, pos){ return clamp(needAt(L,t,pos)/1.5, 0, 1); }
/* 同位置竞争深度：0 = 无同级别竞争者（战术地位高） */
function roleDepth(L, t, p){
  let n = 0;
  rosterOf(L,t).forEach(x=>{ if(x.id!==p.id && x.pos===p.pos && x.ovr >= p.ovr-2) n++; });
  return n;
}
function teamWinScore(L, t){
  const win = (t.g>0)? (t.w/Math.max(1,t.g)) : 0.5;
  return clamp((t.prestige||50)*0.75 + win*45, 0, 100);
}
function teamMarketScore(L, t){
  const mk = (t.budget && t.budget.market)? t.budget.market : 1;
  return clamp((mk-1)*90 + 40, 15, 100);
}
/* 加盟兴趣度（0~130）：金额 / 争冠 / 角色 / 市场 / 教练 / 忠诚 / 招募话术 / 角色承诺 */
function interestOf(L, t, p, salary, pitchKey, rolePromise){
  const amb = ambitionOf(p);
  const ask = demandOf(L, p);
  const ratio = ask>0 ? (salary/ask) : 1.2;
  let money = ratio>=1.15?40 : ratio>=1.00?33 : ratio>=0.90?22 : ratio>=0.80?12 : 4;
  if(salary > maxSalFor(p)+0.01) money -= 12;                       // 报价越界
  const win   = teamWinScore(L,t)/100*18*(0.55 + amb.win*1.5);
  const need  = posNeedOf(L,t,p.pos), depth = roleDepth(L,t,p);
  const role  = clamp((need*8 + (depth===0?6:(depth===1?3:0)))*(0.6 + amb.role*1.8), 0, 16);
  const mkt   = teamMarketScore(L,t)/100*14*(0.55 + amb.market*1.8);
  const coach = clamp(((t.coach && t.coach.rating) || 60)/100*9, 0, 9);
  const loyal = (p.prevTid===t.id)? clamp(3 + (p.tenure||0)*2.2, 0, 9) : 0;
  let pitch = 0;
  if(pitchKey){
    const top = topAmbitionKey(p);
    pitch = (pitchKey===top)? 11 : (amb[pitchKey]>=0.22? 6 : 2);    // 命中核心诉求给满额，次级诉求减半
  }
  let promise = 0;
  if(rolePromise){
    const want = roleRankOf(rolePromise), exp = expectRoleOf(p).rank;
    promise = want>exp? 8 : (want===exp? 6 : -7);                   // 承诺角色低于预期会明显扣分
  }
  return Math.round(clamp(money+win+role+mkt+coach+loyal+pitch+promise, 0, 130));
}
function interestTier(sc){
  if(sc>=78) return "极有可能";
  if(sc>=64) return "很可能";
  if(sc>=50) return "有可能";
  if(sc>=36) return "不太可能";
  return "基本无望";
}
/* 竞争球队：有空间、底蕴接近、且真的出手（2K 中生代球员常遭多队哄抢） */
function rivalsFor(L, t, p, salary){
  const out = [];
  L.teams.forEach(x=>{
    if(x.id===t.id) return;
    if((x.roster||[]).length >= ROSTER_MAX) return;
    if(capSpace(L,x) < salary*0.95) return;
    if((x.prestige||50) < (t.prestige||50)-12) return;
    if(hash01(p.id*13.7 + x.id*3.1) < 0.35) return;
    out.push(x);
  });
  return out;
}
function signProbOf(L, t, p, salary, pitchKey, rolePromise){
  const sc = interestOf(L,t,p,salary,pitchKey,rolePromise);
  let pr = clamp((sc-26)/88, 0.03, 0.95);
  const rivals = rivalsFor(L,t,p,salary);
  if(rivals.length) pr *= Math.max(0.25, 1-0.16*rivals.length);
  if(p.tid===t.id) pr = clamp(pr+0.10, 0.03, 0.96);
  return {sc:sc, tier:interestTier(sc), prob:clamp(pr,0.03,0.96), rivals:rivals};
}
/* AI 球队默认给出的角色承诺：与球队需求匹配 */
function rolePromiseFor(L, t, p){
  const exp = expectRoleOf(p).k;
  const depth = roleDepth(L,t,p);
  if(depth===0 && exp!=="star") return "starter";
  if(depth>=2 && roleRankOf(exp)>=4) return "sixth";
  return exp;
}
/* 薪金未达 12 人的球队补人（2K 式：超帽队只能用特例/底薪填坑，不得用不存在的空间抢人） */
/* 2K 式补足最低人数：用底薪/特例签下市场上最便宜的可签球员，不抢明星 */
function fillRosters(L){
  L.teams.forEach(t=>{
    while((t.roster||[]).length < ROSTER_MIN){
      const room = capSpace(L,t);
      const budget = Math.max(MIN_SAL, room, mleOf(L,t), baeOf(L,t));
      /* 只挑"要价最低"的合格球员填坑（2K：第 12-15 人多为底薪/新秀/双向） */
      const pool = L.players.filter(x=> x.tid<0 && !x.retired && ((x.ovr||0) < 80 || (capSpace(L,t) >= demandOf(L,x))))
                             .sort((a,b)=> (demandOf(L,a)-demandOf(L,b)));
      let c = null;
      for(const x of pool){ if(demandOf(L,x) <= budget + 0.01){ c = x; break; } }
      if(!c) c = pool[0];                                   // 无人可负担时取最便宜者
      if(!c) break;
      c.tid = t.id; c.yrs = 1+ri(2); c.tenure = 1; c.faSeasons = 0;
      if(c.prevTid===undefined) c.prevTid = -1;
      c.salary = Math.round(clamp(Math.min(demandOf(L,c), budget), minSalFor(c), maxSalFor(c))*10)/10;
      c.bonus = mkIncentive(c, c.salary);
      t.roster.push(c.id);
      if(demandOf(L,c) >= 22) (L._signLog=L._signLog||[]).push(["补人",t.abbr,c.name,c.ovr,Math.round(demandOf(L,c)*10)/10,Math.round(room*10)/10,"fill",c.salary]);
    }
  });
  L.faPool = L.players.filter(x=> x.tid<0 && !x.retired);
}
/* AI 续约阶段（对齐 2K 休赛期先续约后开放市场）：球队优先用鸟权留住自有球员 */
function aiResign(L){
  const pool = L.faPool.filter(p=> p.tid<0 && !p.retired && p.prevTid>=0);
  pool.sort((a,b)=> b.ovr-a.ovr);
  let kept = 0;
  for(const p of pool){
    if(p.tid>=0) continue;
    const t = L.teams[p.prevTid];
    if(!t || t.id===L.myTid) continue;               // 玩家球队的续约由玩家决定
    if(t.roster.length >= ROSTER_MAX) continue;
    const ov = p.ovr||0, ag = p.age||0, pot = p.pot||ov;
    /* 挽留意愿：核心资产必留，老将/边缘人按阵容结构取舍 */
    let willing;
    if(ov>=88) willing = 1;
    else if(ov>=80) willing = 0.95;
    else if(ov>=72) willing = ag>=34? 0.45 : 0.85;
    else if(ov>=66) willing = ag>=31? 0.30 : 0.60;
    else willing = 0.15;
    if(pot>=84 && ag<=26) willing = Math.max(willing, 0.95);       // 高潜新星
    const bigs = rosterOf(L,t).filter(x=> (x.salary||0) >= capOf(L)*0.25).length;
    if(bigs>=3 && ov<86) willing *= 0.5;                           // 顶薪已满，慎签中档
    /* 穷鬼线球队：薪资低于下限时留人动机极强（自家可用球员优先续约，避免薪资不达标） */
    const needSal = basePayroll(L,t) < floorOf(L);
    if(needSal){ if(ov>=72) willing = 1; else if(ov>=66) willing = Math.max(willing, 0.92); }
    if(hash01(p.id*7.7 + t.id*2.3) > willing) continue;
    const bd = birdLevelOf(p.tenure||0);
    const maxOff = maxOfferFor(L,t,p);
    const ask = demandOf(L,p);
    if(ask > maxOff + 0.01 && bd < 2) continue;                    // 出不起价且非完整鸟权 → 放走
    const pitch = (hash01(p.id*3.3 + t.id*1.9) > 0.45)? topAmbitionKey(p) : "win";
    const rp = rolePromiseFor(L,t,p);
    const prem = (basePayroll(L,t) < floorOf(L) && ov>=66) ? 1.05 : 1;   // 穷鬼线球队小溢价留人（必须花到下限）
    const offer = Math.round(clamp(Math.min(ask*prem, maxOff), minSalFor(p), maxSalFor(p))*10)/10;
    if(interestOf(L,t,p,offer,pitch,rp) < 40) continue;            // 球员本人想试水市场
    p.tid = t.id; p.yrs = 2+ri(3); p.faSeasons = 0;
    p.tenure = Math.min(9, (p.tenure||0)+1);
    p.salary = offer; p.bonus = mkIncentive(p, p.salary); p.rolePromise = rp;
    if(offer>=22) (L._signLog=L._signLog||[]).push(["续约",t.abbr,p.name,p.ovr,ask,Math.round(capSpace(L,t)*10)/10,"own-"+bd,offer]);
    t.roster.push(p.id);
    kept++;
    addNews(L, "【续约】"+t.name+"以 "+fmtM(p.salary)+"/年 续约 "+p.name+"（"+p.pos+" "+p.ovr+"）。","fa");
  }
  L.faPool = L.players.filter(p=> p.tid<0 && !p.retired);
  return kept;
}
/* AI 自由市场：两阶段（先顶薪级，再其余球员），按兴趣度择优签约 */
function aiFreeAgency(L){
  L.lastResign = aiResign(L);                       // 先续约（鸟权留人），再开放市场
  enforceFloor(L);                                  // 2K/NBA 穷鬼线：先用空间把薪资补到下限，再抢人
  const pool = L.faPool.filter(p=> p.tid<0 && !p.retired);
  pool.sort((a,b)=> b.ovr-a.ovr);
  const phases = [ pool.filter(p=>p.ovr>=88), pool.filter(p=>p.ovr<88) ];
  for(const grp of phases){
    for(const p of grp){
      if(p.tid>=0) continue;
      const ask = demandOf(L, p);
      const cands = [];
      for(const t of L.teams){
        if(t.roster.length>=ROSTER_MAX) continue;
        if(t.id===L.myTid && t.roster.length>=ROSTER_MIN) continue;   // 玩家球队的引援由玩家决定
        const room = capSpace(L,t);
        const isOwn = (p.prevTid===t.id);                             // 鸟权：本队旧将可超帽续约
        const maxOff = maxOfferFor(L,t,p);
        let cap0 = maxOff;                                            // 该队合法出价上限
        if(!isOwn){
          if(room + Math.max(mleOf(L,t), baeOf(L,t)) < ask*0.72) continue;   // 完全够不着，不参与
          cap0 = Math.min(maxOff, Math.max(room, mleOf(L,t), baeOf(L,t)));   // 非鸟权只能用空间/特例
        }
        let offer = Math.min(ask, cap0);
        if(offer < minSalFor(p)-0.01) continue;
        const pitch = (hash01(p.id*3.3 + t.id*1.9) > 0.45)? topAmbitionKey(p) : "win";
        const rp = rolePromiseFor(L,t,p);
        const sc = interestOf(L,t,p,offer,pitch,rp);
        cands.push({t:t, sc:sc, offer:offer, cap0:cap0, rp:rp, _room:room});
      }
      if(!cands.length) continue;
      cands.sort((a,b)=> b.sc-a.sc);
      const best = cands[0];
      if(best.sc < 44 - Math.max(0, 82-p.ovr)*0.5) continue;          // 兴趣过低则本年无人问津
      const t = best.t, isOwn = (p.prevTid===t.id);
      /* 2K 式多队竞价：有竞争对手时报价被推高（竞争越多溢价越高，上限受该队合法空间约束） */
      const rivals = cands.filter(c=> c.t.id!==t.id && c.sc >= best.sc - 8).length;
      let bid = best.offer, bidTag = "new";
      if(rivals>=2){ bid = Math.min(best.cap0, Math.max(bid, ask*1.10)); bidTag = "竞价"; }
      else if(rivals===1 && best.sc>=68){ bid = Math.min(best.cap0, Math.max(bid, ask*1.03)); bidTag = "竞价"; }
      if(bid > best.offer + 0.01) L._bidCount = (L._bidCount||0)+1;
      if(p.salary>=22 || ask>=22) (L._signLog=L._signLog||[]).push([bidTag==="竞价"?"竞价":"FA",best.t.abbr,p.name,p.ovr,Math.round(ask*10)/10,Math.round(best._room*10)/10,isOwn?"own":bidTag,Math.round(bid*10)/10]);
      p.tid = t.id; p.yrs = 1+ri(3); p.faSeasons = 0;
      p.salary = Math.round(clamp(bid, minSalFor(p), maxSalFor(p))*10)/10;
      p.tenure = isOwn? Math.min(9, (p.tenure||0)+1) : 1;
      p.bonus = mkIncentive(p, p.salary);
      p.rolePromise = best.rp;
      t.roster.push(p.id);
      addNews(L, "【自由市场】"+t.name+"签下 "+p.name+"（"+p.pos+"，评分 "+p.ovr+"，"+starsStr(valueToStars(playerValue(L,p,t.id)))+"），合同 "+p.yrs+" 年 "+fmtM(p.salary)+"/年。","fa");
    }
  }
  L.faPool = L.players.filter(p=> p.tid<0 && !p.retired);
  fillRosters(L);
  enforceFloor(L);                                   // 再补足穷鬼线
  enforceCap(L);
  floorPenalty(L);                                   // 阵容已满仍不达标 → 差额均分给阵中球员
  L.teams.forEach(t=>{ t.payroll = payrollOf(L,t); t.lineup = autoLineup(L,t); });
}
function posCount(L, t){
  const c = {PG:0,SG:0,SF:0,PF:0,C:0};
  rosterOf(L,t).forEach(p=>{ c[p.pos]=(c[p.pos]||0)+1; });
  return c;
}

/* ---------- 球员成长 ---------- */
function developPlayer(L, p){
  p._prevOvr = p.ovr;
  const t = L.teams[p.tid];
  let age = p.age;
  let grow = 0;
  if(age<=21) grow = gauss(3.4, 3.0);
  else if(age<=23) grow = gauss(2.6, 2.6);
  else if(age<=25) grow = gauss(1.5, 2.2);
  else if(age<=27) grow = gauss(0.5, 1.8);
  else if(age<=29) grow = gauss(-0.4, 1.6);
  else if(age<=31) grow = gauss(-1.3, 1.5);
  else if(age<=33) grow = gauss(-2.4, 1.6);
  else if(age<=35) grow = gauss(-3.6, 1.8);
  else grow = gauss(-5.0, 2.2);
  // 老将缓冲：数值顶级 / 医疗与训练条件优良者下滑更慢，生涯因此得以延长
  if(age>=32 && grow<0) grow *= vetDeclineFactor(L,p);
  // 伤病负荷：休赛期康复逐步缓解
  p.injLoad = Math.max(0, Math.round((((p.injLoad||0))*0.7 - 0.3)*100)/100);
  // 潜力天花板
  const room = p.pot - p.ovr;
  if(grow>0 && room<=0) grow *= 0.25;
  else if(grow>0) grow = Math.min(grow, Math.max(0.6, room*0.45));
  // 出场时间/教练/设施
  const minutes = (p.st && p.st.g)? (p.st.sec||0)/60/p.st.g : 0;
  const playF = minutes>=26? 1.18 : minutes>=16? 1.05 : minutes>=8? 0.95 : 0.82;
  const coachF = t? 0.9 + (t.coach.rating-55)/260 : 1;
  grow *= playF*coachF;
  grow += gauss(0, 1.4);
  grow = clamp(grow, -12, 12);
  let d = Math.round(grow);
  if(d===0 && Math.random()<Math.abs(grow)) d = grow>0?1:-1;
  if(d!==0){
    const keys = ATTR_KEYS.slice();
    shuffle(keys);
    const n = Math.min(keys.length, 6+ri(6));
    for(let i=0;i<n;i++){
      const k = keys[i];
      p.r[k] = clamp(p.r[k] + d*gauss(0.9,0.5), 18, 99);
    }
    for(const k of keys) p.r[k] = Math.round(p.r[k]);
    // 年轻球员：身高/体重自然增长
    if(age<=22 && Math.random()<0.18){ p.h = clamp(p.h+1, 69, 91); p.wt+=3+ri(5); }
    if(age>=32){ const dec = ri(2); if(dec) p.r.spd=clamp(p.r.spd-1,18,99); }
    p.ovr = calcOvr(p);
    p.pot = Math.max(p.pot, p.ovr);
    // 潜力随年龄衰减
    const potDecay = age<=22?0 : age<=25? ri(2): age<=28? ri(3): ri(5);
    p.pot = clamp(p.pot - potDecay, p.ovr, 99);
  }
  p.age++;
  p.exp = (p.exp||0)+1;
  // 保留赛季末伤病信息，供退役判定与生涯评估使用
  if(p.injured){ p.lastInj = {y:L.year, s:(p.injured.s||1), d:p.injured.d, t:p.injured.t}; p.injured = null; }
  // 存档本赛季数据
  if(p.st && p.st.g>0){
    p.log.push({y:L.year, t:p.tid, g:p.st.g, pts:pg(p,'pts'), reb:pg(p,'reb'), ast:pg(p,'ast'),
      stl:pg(p,'stl'), blk:pg(p,'blk'), min:pg(p,'min'), fgp: p.st.fga? (p.st.fgm/p.st.fga*100):0,
      tpp: p.st.tpa? (p.st.tpm/p.st.tpa*100):0, ovr:p.ovr});
    if(p.log.length>16) p.log.shift();
  }
  p.st = newLine(); p.st.g=0; p.st.gs=0; p.st.sec=0;
  p.st.dd10 = 0;
  return d;
}
/* ---------- 退役机制 ----------
   两类新规则：
   ① 老将延迟退役：数值（能力值）或整体情况（综合竞技价值）足够高者，生涯上限更靠后，不按普通年龄线退役；
   ② 重伤提前退役：伤病过于严重（毁灭性伤病 / 反复大伤 / 生涯负荷过高）会触发提前退役。 */
/* 竞技价值分：能力值 + 整体情况（潜力剩余 / 身体机能） */
function vetScoreOf(p){
  const ov = p.ovr||0, pot = p.pot||ov;
  let s = ov + Math.min(4, Math.max(0, pot-ov)*0.35);
  const dur = (p.r && p.r.dur)? p.r.dur : 60;
  s += (dur-60)*0.06;                                  // 身体机能（耐久）折算
  return Math.round(s*10)/10;
}
/* 老将下滑缓冲系数：数值越高、医疗/训练设施越好，衰退越慢 */
function vetDeclineFactor(L,p){
  let soft = 1;
  const ov = vetScoreOf(p);
  if(ov>=90) soft -= 0.42; else if(ov>=85) soft -= 0.34; else if(ov>=80) soft -= 0.26;
  else if(ov>=74) soft -= 0.15; else if(ov>=68) soft -= 0.07;
  const med = (typeof facilityLv==="function")? facilityLv(L,"f2") : 0;
  const trn = (typeof facilityLv==="function")? facilityLv(L,"f1") : 0;
  soft -= med*0.030 + trn*0.018;
  soft += Math.min(0.22, (p.injLoad||0)*0.020 + (p.bigInj||0)*0.03);   // 伤病缠身者衰退更快
  return clamp(soft, 0.42, 1.05);
}
/* 生涯上限年龄：高价值老将可打到 38~41 岁；伤病负荷与设施条件共同修正 */
function retireCapAge(L,p){
  const v = vetScoreOf(p);
  let cap = 34 + Math.round(clamp((v-66)/3.1, 0, 7));
  const med = (typeof facilityLv==="function")? facilityLv(L,"f2") : 0;
  const trn = (typeof facilityLv==="function")? facilityLv(L,"f1") : 0;
  cap += Math.round(clamp((med+trn)*0.10, 0, 1));
  cap -= Math.round(Math.min(3, (p.injLoad||0)*0.20 + (p.bigInj||0)*0.5));
  return clamp(cap, 30, 41);
}
/* 重伤提前退役概率：毁灭性伤病与反复大伤者概率最高 */
function injRetireProb(L,p){
  const ag = p.age||0, ov = p.ovr||0;
  const last = (p.injHist && p.injHist.length)? p.injHist[p.injHist.length-1] : (p.lastInj||null);
  const lastS = last? (last.s||1) : 0;
  const vul = clamp(0.60 + (ag-26)*0.035, 0.50, 1.60);        // 年龄越大越难扛过伤病
  let pr = 0;
  if(p.sev4) pr += 0.15*p.sev4;                                // 有过毁灭性伤病：生涯终结风险
  if(lastS>=4) pr += 0.26*vul;                                 // 本季毁灭性伤病
  else if(lastS===3) pr += 0.09*vul;                           // 本季重伤
  if((p.bigInj||0)>=2) pr += 0.06*((p.bigInj||0)-1);           // 反复大伤累积
  const load = p.injLoad||0;
  if(load>=6) pr += (load-6)*0.035;                            // 生涯负荷过高
  if(ov>=85) pr *= 0.72; else if(ov>=78) pr *= 0.86;           // 顶级球员康复条件更好
  if(ag<=24) pr *= 0.55; else if(ag<=27) pr *= 0.78;
  if((p.pot||ov)-ov>=5) pr *= 0.72;                            // 仍有潜力者更可能被球队留下
  return clamp(pr, 0, 0.72);
}
/* 退役原因判定：返回 null 表示继续征战 */
function retireReason(L,p){
  const ov = p.ovr||0, ag = p.age||0;
  const cap = retireCapAge(L,p), vet = vetScoreOf(p);
  // ① 伤病提前退役（"正常人如果伤病过于严重，触发提前退役"）
  const ip = injRetireProb(L,p);
  if(ip>0 && Math.random()<ip) return "伤病";
  // ② 年龄到点：到达该球员的生涯上限年龄
  if(ag >= cap){ if(Math.random()<0.55) return "年龄"; return null; }
  if(ag >= cap-1 && Math.random()<0.22) return "年龄";
  // ③ 边缘球员（保留原有判定，但对高价值老将放宽）
  if(p.tid<0 && ov<58 && ag>=30) return "边缘";
  if(ag>=33 && ov<55) return "边缘";
  if(ag>=35 && ov<62 && vet<76) return "边缘";
  if(ag>=37 && vet<80 && Math.random()<0.45) return "年龄";
  return null;
}
function retirement(L){
  const out = [];
  for(const p of L.players){
    const why = retireReason(L,p);
    if(why){ p._retireWhy = why; out.push(p); }
  }
  out.forEach(p=>{
    p.retired = true; p.retireYear = L.year; p.leaveReason = p._retireWhy || "退役";
    if(p.tid>=0){ const t=L.teams[p.tid]; const i=t.roster.indexOf(p.id); if(i>=0) t.roster.splice(i,1); }
  });
  L.players = L.players.filter(p=> !p.retired);
  L.byId = {}; L.players.forEach(p=> L.byId[p.id]=p);
  const injN = out.filter(p=> p.leaveReason==="伤病").length;
  const ageN = out.filter(p=> p.leaveReason==="年龄").length;
  const vetN = out.filter(p=> p.age>=36).length;
  if(out.length){
    addNews(L, "【退役】"+out.length+" 名球员宣布退役（到龄 "+ageN+" 人 / 伤病提前退役 "+injN+" 人 / 边缘离队 "+(out.length-ageN-injN)+" 人），其中 36 岁以上老将 "+vetN+" 人。", "news");
    out.forEach(p=>{
      if(p.age>=32 || (p.ovr||0)>=78 || p.leaveReason==="伤病"){
        addNews(L, "【退役】"+p.name+"（"+p.age+" 岁，综合 "+(p.ovr||0)+"，"+p.leaveReason+
          ((p.rings||0)>0? "，"+p.rings+" 冠":"")+"）结束职业生涯。", "news");
      }
    });
  }
  return out;
}

/* ---------- 交易 ---------- */
/* 资产价值：2K 机制下综合 能力 / 潜力 / 年龄 / 合同性价比 / 鸟权 / 奖金条款 */
function playerValue(L, p, forTid){
  let v = Math.pow(Math.max(4, p.ovr-40), 2.05);
  if(p.pot>p.ovr) v += (p.pot-p.ovr)*Math.max(4,p.ovr-42)*0.55;
  const ageF = p.age<=21?1.32 : p.age<=24?1.22 : p.age<=27?1.06 : p.age<=30?0.94 : p.age<=33?0.74 : 0.5;
  v *= ageF;
  // 合同性价比：以 2K 市场价值曲线为基准，而非旧薪资公式
  const fair = marketValueOf(L, p);
  const ratio = ((p.salary||0)+incentiveCapHit(p))/Math.max(1,fair);
  if(ratio>1.5) v*=0.62; else if(ratio>1.2) v*=0.85; else if(ratio<0.7) v*=1.18;
  if(p.yrs<=1) v *= 0.90;
  if(p.injured) v *= 0.88;
  if(p.bonus && p.bonus.lv!=="不可能") v *= 0.97;              // 奖金占帽，轻微折价
  if((p.tenure||0)>=3 && (p.prevTid||-1)>=0) v *= 1.04;        // 完整鸟权资产更易续约
  return Math.round(v);
}
/* 5 星资产评级（半星精度） */
function tradeStars(L, p){ return valueToStars(playerValue(L, p)); }
function pickValue(L, tid, yr, rd){
  const t = L.teams[tid];
  const base = rd===1? 260: 90;
  const strength = 1 + (74 - winPct(t)*60)/100;
  const dist = 1 + (yr - L.year)*0.06;
  return Math.round(base*strength*dist);
}
/* 交易薪资匹配上限（对齐 NBA/2K 分级规则）：帽下用空间 / 超帽 125%+10万 / 超第一土豪线只能等额换入 */
function salMatchLimit(L, t, salOut){
  const room = Math.max(0, capSpace(L,t));
  if(room > 0.01) return Math.round((salOut + room)*10)/10;
  if(payrollOf(L,t) >= apronOf(L)) return Math.round((salOut + 0.1)*10)/10;
  return Math.round((salOut*1.25 + 0.1)*10)/10;
}
function evaluateTrade(L, offer, receive){
  let ov=0, rv=0;
  offer.players.forEach(id=>{ const p=L.byId[id]; if(p) ov += playerValue(L,p,offer.tid); });
  receive.players.forEach(id=>{ const p=L.byId[id]; if(p) rv += playerValue(L,p,receive.tid); });
  offer.picks.forEach(pk=> ov += pickValue(L, pk.tid, pk.yr, pk.rd));
  receive.picks.forEach(pk=> rv += pickValue(L, pk.tid, pk.yr, pk.rd));
  const A = L.teams[offer.tid], B = L.teams[receive.tid];
  const salOutA = offer.players.reduce((a,id)=> a + (L.byId[id]? L.byId[id].salary:0), 0);
  const salOutB = receive.players.reduce((a,id)=> a + (L.byId[id]? L.byId[id].salary:0), 0);
  const limitB = salMatchLimit(L, B, salOutB);   // B 最多能换入的薪资
  const limitA = salMatchLimit(L, A, salOutA);   // A 最多能换入的薪资
  let capOk = true, capMsg = "";
  if(salOutA > limitB + 0.01) { capOk=false; capMsg = B.abbr+" 无法匹配薪资（上限 "+fmtM(limitB)+"）"; }
  if(salOutB > limitA + 0.01) { capOk=false; capMsg = A.abbr+" 无法匹配薪资（上限 "+fmtM(limitA)+"）"; }
  if(A.roster.length - offer.players.length + receive.players.length > ROSTER_MAX) capOk=false;
  if(B.roster.length - receive.players.length + offer.players.length > ROSTER_MAX) capOk=false;
  if(B.roster.length - receive.players.length + offer.players.length < ROSTER_MIN) capOk=false;
  if(A.roster.length - offer.players.length + receive.players.length < ROSTER_MIN) capOk=false;
  const factor = B.prestige/ Math.max(1,A.prestige);
  const need = rv*1.02 - ov;
  return {valueA:ov, valueB:rv, ok: capOk && need<=0, capOk:capOk, capMsg:capMsg,
    verdict: !capOk? "规则不通过" : need> rv*0.35? "无讨论价值" : need>0? "略亏，可以谈" : need> -rv*0.15? "基本公平" : "很有吸引力",
    diff: Math.round((ov - rv))};
}
function execTrade(L, offer, receive){
  const A = L.teams[offer.tid], B = L.teams[receive.tid];
  offer.players.forEach(id=>{
    const p = L.byId[id];
    const i = A.roster.indexOf(id); if(i>=0) A.roster.splice(i,1);
    p.tid = B.id; B.roster.push(id);
  });
  receive.players.forEach(id=>{
    const p = L.byId[id];
    const i = B.roster.indexOf(id); if(i>=0) B.roster.splice(i,1);
    p.tid = A.id; A.roster.push(id);
  });
  // 选秀权交换
  const swap = (from, to, picks)=>{
    (picks||[]).forEach(pk=>{
      from.picks = from.picks||[]; to.picks = to.picks||[];
      const i = from.picks.findIndex(x=> x.yr===pk.yr && x.rd===pk.rd);
      if(i>=0){ const x = from.picks.splice(i,1)[0]; to.picks.push(x); }
    });
  };
  swap(A, B, offer.picks);
  swap(B, A, receive.picks);
  A.payroll = payrollOf(L,A); B.payroll = payrollOf(L,B);
  A.lineup = autoLineup(L,A); B.lineup = autoLineup(L,B);
  L.tradeLog.unshift({y:L.year, d:L.day, a:A.id, b:B.id,
    aGet: receive.players.slice(), bGet: offer.players.slice()});
  addNews(L, "【交易】"+A.name+" 与 "+B.name+" 达成交易："+A.abbr+"送出 "
    + offer.players.map(id=>L.byId[id].name).join("、") + "，得到 "
    + receive.players.map(id=>L.byId[id].name).join("、") + "。", "trade");
}

/* ---------- 新赛季 ---------- */
function nextSeason(L){
  const champTid = L.champ;
  // 成长与退役
  const log = [];
  L.players.forEach(p=>{ if(p.tid>=0) developPlayer(L,p); });
  const ret = retirement(L);
  L.seasonLog = {champ:champTid, awards:L.awards};
  L.history.push({year:L.year, champ:champTid,
    mvp: L.awards&&L.awards.mvp? {n:L.awards.mvp.name, tid:L.awards.mvp.tid}:null,
    record: L.teams.map(t=>t.w+"-"+t.l)});
  L.year++;
  setCapScaleFrom(L);            // 劳资金额随新赛季工资帽同步上浮
  L.phase = "preseason";
  L.day = 0; L.awards = null; L.allStarDone=false; L.draftDone=false; L.champ=null;
  L.mleUsed = {};   // 新赛季中产特例重新可用
  L.deadCap = {};   // 买断死钱仅计入当季
  L.teams.forEach(t=>{
    t.w=0;t.l=0;t.dw=0;t.dl=0;t.cw=0;t.cl=0;t.ptsF=0;t.ptsA=0;t.gp=0;
    t.playoff=false;t.seed=0;t.last10=[];t.streak=0;
    t.floorAdj = 0;                                // 穷鬼线差额按季重新核算
    t.coach.rating = clamp(t.coach.rating + ri(5)-2, 30, 95);
    t.coach.off = clamp(t.coach.off + ri(5)-2, 30, 95);
    t.coach.def = clamp(t.coach.def + ri(5)-2, 30, 95);
  });
  L.players.forEach(p=>{ p.st=newLine(); p.st.g=0; p.st.gs=0; p.st.sec=0; p.st.dd10=0; });
  // 选秀已完成 → 进入自由市场
  L.draftClass = null;
  L.draftState = null;
  makeFA(L);
  aiFreeAgency(L);
  const s = scheduleSeason(L.year);
  L.sched = s.days; L.schedLeft = s.left;
  L.teams.forEach(t=>{ t.lineup = autoLineup(L,t); t.payroll = payrollOf(L,t); });
  enforceCap(L);
  L.phase = "regular";
  addNews(L, "【新赛季】"+(L.year)+"-"+((L.year+1)%100)+" 赛季常规赛开打！", "news");
  return log;
}

  h += '<div class="card"><div class="hd"><b>主力阵容</b><div class="sp" style="flex:1"></div><span class="sub" data-act="nav" data-v="roster" style="cursor:pointer">全部 ›</span></div><div class="bd tight">';
  const rs = sortedRoster(L,t).slice(0,6);
  rs.forEach(p=> h += playerRow(L,p,{sub:pgLine(p)}));
  h += '</div></div>';
  // 排名
  h += '<div class="card"><div class="hd"><b>'+esc(t.conf==="E"?"东部":"西部")+'排名</b></div><div class="bd tight scrollx">';
  const st = standings(L, t.conf);
  h += '<table class="tbl"><thead><tr><th>#</th><th style="text-align:left">球队</th><th>胜</th><th>负</th><th>胜率</th></tr></thead><tbody>';
  st.slice(0,10).forEach((x,i)=>{
    h += '<tr class="'+(x.id===t.id?"mine":"")+' tapable" data-act="teamInfo" data-v="'+x.id+'"><td>'+(i+1)+'</td>'+
      '<td class="nm" style="text-align:left">'+esc(x.name)+'</td><td>'+x.w+'</td><td>'+x.l+'</td><td>'+(winPct(x)*100).toFixed(1)+'</td></tr>';
  });
  h += '</tbody></table></div></div>';
  // 新闻
  h += '<div class="card"><div class="hd"><b>联盟动态</b></div><div class="bd tight">';
  if(!L.news.length) h += '<div class="empty">暂无新闻</div>';
  L.news.slice(0,8).forEach(n=>{
    h += '<div style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.05);font-size:12.5px">'+
      '<span class="tag '+({champ:"y",award:"p",trade:"b",inj:"r",fa:"g"}[n.tag]||"")+'">'+({champ:"冠军",award:"奖项",trade:"交易",inj:"伤病",fa:"签约",news:"动态"}[n.tag]||"动态")+'</span> '+
      esc(n.t)+'</div>';
  });
  h += '</div></div>';
  // 数据领跑
  h += '<div class="card"><div class="hd"><b>球队数据领跑</b></div><div class="bd tight">';
  const lead = ["pts","reb","ast","stl","blk"].map(k=>{
    const best = rosterOf(L,t).filter(p=>p.st&&p.st.g>0).sort((a,b)=> pg(b,k)-pg(a,k))[0];
    const nm = {pts:"得分",reb:"篮板",ast:"助攻",stl:"抢断",blk:"盖帽"}[k];
    return best? {k:nm, p:best, v:pg(best,k)} : null;
  }).filter(Boolean);
  lead.forEach(x=>{
    h += '<div class="pl"><div class="pos '+x.p.pos+'">'+x.p.pos+'</div><div class="info"><b>'+esc(x.p.name)+'</b><span>'+x.k+'</span></div>'+
      '<div style="font-weight:800;font-size:15px">'+x.v.toFixed(1)+'</div></div>';
  });
  if(!lead.length) h += '<div class="empty">尚无比赛数据</div>';
  h += '</div></div>';
  h += '</div>';
  return h;
}
function teamBlock(t, extra){
  return '<div style="flex:1"><div style="width:52px;height:52px;margin:0 auto;border-radius:12px;background:'+t.c1+
    ';display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#fff;border:2px solid '+t.c2+'">'+
    esc(t.abbr)+'</div><div style="margin-top:6px;font-size:12.5px;font-weight:600">'+esc(t.name)+'</div>'+
    '<div style="font-size:11px;color:var(--dim2)">'+t.w+'-'+t.l+'</div></div>';
}
function rosterOfBase(L,t){ return t.roster.map(id=>L.byId[id]).filter(Boolean); }
function divRank(L, t){
  const d = divStandings(L, t.div);
  return d.findIndex(x=>x.id===t.id)+1;
}
function playerRow(L, p, opt){
  opt = opt || {};
  const t = L.teams[p.tid];
  let sub = opt.sub!==undefined? opt.sub : (p.pos+" · "+p.age+"岁"+(p.injured? ' · <span style="color:#f87171">伤停'+p.injured.d+'天'+(p.injured.s>=3? '（'+injTierName(p.injured.s)+'）':'')+'</span>':''));
  return '<div class="pl tapable" data-act="player" data-v="'+p.id+'">'+
    '<div class="pos '+p.pos+'">'+p.pos+'</div>'+
    '<div class="info"><b>'+esc(p.name)+(p.injured?' <span style="color:#f87171">✚</span>':'')+'</b><span>'+sub+'</span></div>'+
    '<div class="ovr '+ovClass(p.ovr)+'"><b>'+p.ovr+'</b><span>POT '+p.pot+'</span></div></div>';
}
function pgLine(p){
  if(!p.st || !p.st.g) return p.pos+" · 本季未出场";
  return pg(p,'pts').toFixed(1)+"分 "+pg(p,'reb').toFixed(1)+"板 "+pg(p,'ast').toFixed(1)+"助";
}
function pgv(p,k){ return pg(p,k); }
function pgBase(p,k){ if(!p.st || !p.st.g) return 0; return (p.st[k]||0)/p.st.g; }

/* ---------- 阵容 ---------- */
function renderRoster(){
  const L = S.L, t = myTeam();
  let h = '<div class="card"><div class="hd"><b>球队名单</b><div class="sp" style="flex:1"></div>'+
    '<span class="sub">'+rosterOf(L,t).length+'/15 人 · 薪资 '+fmtM(t.payroll)+'</span></div><div class="bd tight">';

  rs.forEach(p=>{

    h += '<div class="pl tapable" data-act="player" data-v="'+p.id+'">'+
      '<div class="pos '+p.pos+'">'+p.pos+'</div>'+

      '<span>'+p.age+'岁 · '+inch2str(p.h)+' · '+fmtM(p.salary)+' · '+(p.yrs||0)+'年'+(mm?" · "+mm+"分钟":"")+(p.injured? ' · <span style="color:#f87171">伤停'+p.injured.d+'天'+(p.injured.s>=3? '（'+injTierName(p.injured.s)+'）':'')+'</span>':'')+'</span></div>'+
      '<div class="ovr '+ovClass(p.ovr)+'"><b>'+p.ovr+'</b><span>POT '+p.pot+'</span></div></div>';

  h += '<div class="card"><div class="hd"><b>球员赛季数据</b></div><div class="bd tight scrollx">';

  rs.forEach(p=>{
    const fgp = p.st&&p.st.fga? (p.st.fgm/p.st.fga*100).toFixed(1):"—";
    const tpp = p.st&&p.st.tpa? (p.st.tpm/p.st.tpa*100).toFixed(1):"—";
    h += '<tr class="tapable" data-act="player" data-v="'+p.id+'"><td class="nm" style="text-align:left">'+esc(p.name)+'</td>'+
      '<td>'+((p.st&&p.st.g)||0)+'</td><td>'+pg(p,'min').toFixed(1)+'</td><td>'+pg(p,'pts').toFixed(1)+'</td>'+
      '<td>'+pg(p,'reb').toFixed(1)+'</td><td>'+pg(p,'ast').toFixed(1)+'</td><td>'+fgp+'</td><td>'+tpp+'</td></tr>';

  h += '</tbody></table></div></div>';
  h += renderStratCard(L,t);
  return h;
}

  h += '<div style="margin-top:9px"><div style="font-size:11px;color:var(--dim2);margin-bottom:5px">防守体系</div>'+
    '<div class="seg">'+["收缩","均衡","换防"].map(x=>'<button class="'+(st.def===x?"on":"")+'" data-act="strat" data-k="def" data-v="'+x+'">'+x+'</button>').join("")+'</div></div>';
  h += '<div class="gen" style="margin-top:12px"><div class="genrow"><span class="lb">战术速度</span>'+
    '<input type="range" min="0" max="2" step="1" value="'+st.tempo+'" data-act="stratRange" data-k="tempo"><span class="vl">'+["慢","中","快"][st.tempo]+'</span></div>'+

  h += '</div></div>';

  // 属性
  h += '<div style="margin-top:12px;font-size:12px;font-weight:700;color:var(--acc2)">能力属性</div><div style="margin-top:5px">';

    const v = p.r[a[0]];

  h += '<div class="kv"><span class="k">本季薪资</span><span class="v">'+fmtM(p.salary)+
    (p.realSal?' <span class="tag g" style="font-size:9px">真实合同</span>':(p.rookieSal?' <span class="tag b" style="font-size:9px">新秀标准档</span>':''))+'</span></div>';
  h += '<div class="kv"><span class="k">剩余年限</span><span class="v">'+(p.yrs||0)+' 年</span></div>';
  h += '<div class="kv"><span class="k">市场价值</span><span class="v">'+fmtM(salaryOf(p.ovr,p.age,p.pot))+'</span></div>';

  if(_ipr > 0.02) h += '<div class="kv"><span class="k">离队风险</span><span class="v" style="color:#f87171">伤病提前退役风险约 '+Math.round(_ipr*100)+'%</span></div>';
  else if(p.age >= retireCapAge(L,p)-2) h += '<div class="kv"><span class="k">离队风险</span><span class="v" style="color:#fbbf24">临近生涯上限（'+retireCapAge(L,p)+' 岁）</span></div>';

  if(p.log && p.log.length){

      h += '<tr><td>'+(l.y-1)+'-'+String(l.y%100).padStart(2,"0")+'</td><td>'+esc(L.teams[l.t]? L.teams[l.t].abbr:"FA")+'</td>'+
        '<td>'+l.g+'</td><td>'+l.min.toFixed(1)+'</td><td>'+l.pts.toFixed(1)+'</td><td>'+l.reb.toFixed(1)+'</td><td>'+l.ast.toFixed(1)+'</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  // 荣誉
  if(p.awards && p.awards.length){
    h += '<div style="margin-top:12px;font-size:12px;font-weight:700;color:var(--acc2)">荣誉</div><div style="margin-top:5px">';
    const nm = {mvp:"常规赛MVP",dpoy:"最佳防守",roy:"最佳新秀",mip:"最快进步",sixth:"最佳第六人",allstar:"全明星",allnba:"最佳阵容",fmvp:"总决赛MVP"};
    p.awards.slice().reverse().slice(0,14).forEach(a=>{
      h += '<span class="tag y" style="margin:2px 3px 2px 0">'+(a.y-1)+'-'+String(a.y%100).padStart(2,"0")+' '+nm[a.t]+'</span>';
    });
    h += '</div>';
  }
  // 操作
  let foot = "";
  const mine = p.tid === L.myTid;
  if(mine){
    const isS = t.lineup.starters.indexOf(p.id)>=0;
    foot += '<button class="btn" data-act="toggleStart" data-v="'+p.id+'">'+(isS?"移出先发":"设为先发")+'</button>';
    if(L.phase==="regular"||L.phase==="preseason") foot += '<button class="btn" data-act="tradeFor" data-v="'+p.id+'">放入交易</button>';
    foot += '<button class="btn" data-act="waiveAsk" data-v="'+p.id+'">裁掉</button>';
    foot += '<button class="btn pri" data-act="close">关闭</button>';
  } else {
    if(L.phase==="regular"||L.phase==="preseason") foot += '<button class="btn pri" data-act="tradeFor" data-v="'+p.id+'">发起交易</button>';
    foot += '<button class="btn" data-act="close">关闭</button>';
  }
  openModal("球员资料", h, foot);
}

/* ---------- 赛程 ---------- */
function renderSchedule(){
  const L = S.L, t = myTeam();
  if(L.phase==="playoffs" || (L.phase==="draft" && L.po)) return phaseBanner(L,t) + renderPlayoffs();
  let h = "";
  h += phaseBanner(L, t);
  h += '<div class="card"><div class="hd"><b>常规赛赛程</b><div class="sp" style="flex:1"></div><span class="sub">'+
    (L.phase==="regular"? dateStr(L):"赛季结束")+' · 第 '+Math.min(L.day+1, L.sched.length)+'/'+L.sched.length+' 天</span></div><div class="bd">';
  h += '<div class="row" style="gap:6px;flex-wrap:wrap">'+
    '<button class="btn sm" data-act="simDay">模拟1天</button>'+
    '<button class="btn sm" data-act="simNext">到我的下一场</button>'+
    '<button class="btn sm" data-act="simWeek">模拟1周</button>'+
    '<button class="btn sm pri" data-act="simSeason">模拟到赛季末</button></div></div></div>';

  h += '<div class="card"><div class="hd"><b>我的比赛</b><div class="sp" style="flex:1"></div>'+
    '<span class="sub">'+t.w+'胜'+t.l+'负</span></div><div class="bd tight">';
  const mine = [];
  for(let d=0; d<L.sched.length; d++){
    for(const g of L.sched[d]) if(g.h===t.id||g.a===t.id) mine.push({g:g, d:d});
  }
  let shown = mine.filter(x=> x.g.done).slice(-8).reverse();
  const upcoming = mine.filter(x=> !x.g.done).slice(0,6);
  if(shown.length){
    shown.forEach(x=> h += gameRow(L, x.g, x.d, true));
  } else h += '<div class="empty">暂无已完成比赛</div>';
  if(upcoming.length){
    h += '<div style="padding:8px 12px;font-size:11px;color:var(--dim2);background:rgba(255,255,255,.02)">即将进行</div>';
    upcoming.forEach(x=> h += gameRow(L, x.g, x.d, false));
  }
  h += '</div></div>';

  h += '<div class="card"><div class="hd"><b>全联盟近况</b><div class="sp" style="flex:1"></div>'+
    '<span class="sub">今日与近日赛果</span></div><div class="bd tight">';
  let cnt=0;
  for(let d=Math.max(0,L.day-4); d<Math.min(L.day+1,L.sched.length) && cnt<40; d++){
    const day = L.sched[d];
    const done = day.filter(g=>g.done);
    if(!done.length) continue;
    h += '<div style="padding:6px 12px;font-size:10.5px;color:var(--dim2);background:rgba(255,255,255,.02)">'+dateStr({year:L.year,day:d})+'</div>';
    done.forEach(g=>{ h += gameRow(L, g, d, false); cnt++; });
  }
  if(!cnt) h += '<div class="empty">暂无比赛结果</div>';
  h += '</div></div>';
  return h;
}
function gameRow(L, g, d, big){
  const H = L.teams[g.h], A = L.teams[g.a];
  const mine = (g.h===L.myTid||g.a===L.myTid);
  if(!g.done){
    return '<div class="sc'+(mine?" mine":"")+'"'+(mine?' data-act="playGame" style="cursor:pointer"':'')+'>'+
      '<div class="tm"><span class="dot" style="background:'+H.c1+'"></span><span>'+esc(H.abbr)+'</span>'+

      '<div class="num mut" style="width:auto;font-size:11px">'+dateStr({year:L.year,day:d})+'</div></div>';

}

    '<button class="btn pri" style="flex:1" data-act="tradeExec" '+(ev.ok&&canExec?"":"disabled")+'>提交交易</button></div>';
  h += '</div></div>';
  return h;

function renderFA(){
  const L = S.L, t = myTeam();
  let h = '<div class="card"><div class="hd"><b>薪资空间</b></div><div class="bd">';
  h += '<div class="kv"><span class="k">工资帽</span><span class="v">'+fmtM(capOf(L))+'</span></div>';
  h += '<div class="kv"><span class="k">当前薪资</span><span class="v">'+fmtM(t.payroll)+'</span></div>';
  h += '<div class="kv"><span class="k">可用空间</span><span class="v" style="color:'+(capSpace(L,t)>0?"var(--green)":"var(--red)")+'">'+fmtM(capSpace(L,t))+'</span></div>';
  h += '<div class="kv"><span class="k">阵容人数</span><span class="v">'+t.roster.length+' / 15</span></div>';
  const fl = floorOf(L);
  h += '<div class="kv"><span class="k">穷鬼线</span><span class="v" style="color:'+(t.payroll>=fl?"var(--green)":"var(--red)")+'">'+fmtM(fl)+(t.payroll>=fl? ' · 已达标' : ' · 还差 '+fmtM(fl-t.payroll))+'</span></div>';
  if(t.floorAdj) h += '<div class="kv"><span class="k">穷鬼线差额</span><span class="v" style="color:var(--red)">+'+fmtM(t.floorAdj)+' · 均分给阵中球员</span></div>';
  if(capSpace(L,t)<=0.01) h += '<div class="kv"><span class="k">中产特例</span><span class="v" style="color:'+(mleOf(L,t)>0?"var(--gold)":"var(--dim2)")+'">'+fmtM(mleOf(L,t))+'</span></div>';
  h += '</div></div>';
  const pool = L.players.filter(p=> p.tid<0).sort((a,b)=> b.ovr-a.ovr);
  h += '<div class="card"><div class="hd"><b>自由球员市场</b><div class="sp" style="flex:1"></div><span class="sub">共 '+pool.length+' 人</span></div><div class="bd tight">';
  if(!pool.length) h += '<div class="empty">当前没有自由球员</div>';
  pool.slice(0,60).forEach(p=>{
    const d = demandOf(L,p);
    // 以“我能开出的最优报价”预估兴趣度（2K 机制：球员先看钱，再看前景）
    const maxOff = maxOfferFor(L,t,p);
    const r = signProbOf(L,t,p,Math.min(d,maxOff), topAmbitionKey(p), rolePromiseFor(L,t,p));
    const tierColor = (r.sc>=64)? "var(--green)" : (r.sc>=50)? "var(--gold)" : "var(--dim2)";
    h += '<div class="pl">'+
      '<div class="pos '+p.pos+'">'+p.pos+'</div>'+
      '<div class="info"><b>'+esc(p.name)+'</b><span>'+p.age+'岁 · 评分 '+p.ovr+' · 潜力 '+p.pot+(p.tenure>=3?' · 鸟权':'')+'</span>'+
      '<span>'+starsStr(tradeStars(L,p))+' · 市场价 '+fmtM(marketValueOf(L,p))+' · 要价 '+fmtM(d)+'</span>'+
      '<span style="color:'+tierColor+'">兴趣：'+r.tier+'（'+r.sc+'）</span>'+
      (r.rivals.length>=2? '<span style="color:var(--gold)">竞争 '+r.rivals.length+' 队 · 需溢价约 10% 出价</span>' : '')+'</div>'+
      '<button class="btn sm pri" data-act="faOffer" data-v="'+p.id+'">报价</button></div>';
  });

/* ---------- 2K 风格报价弹窗：年薪 / 年限 / 招募话术 / 角色承诺 + 实时兴趣度 ---------- */
const FA_ROLE_LABEL = {star:"球队核心", starter:"首发", sixth:"第六人", role:"轮换", bench:"板凳"};
const FA_AMB_LABEL  = {money:"顶薪合同", win:"争冠前景", role:"战术地位", market:"城市市场"};

function faOfferModal(pid){

  h += '<div class="gen" style="margin-top:12px">'+

/* 按 2K 机制提交报价：先校验签约权限与上限，再按兴趣度判定是否加盟 */
function doSign(L, p, salary, yrs, pitchKey, rolePromise){
  const t = myTeam();
  if(t.roster.length>=ROSTER_MAX){ toast("阵容已满（15人），请先清理名单"); return false; }
  const room = capSpace(L,t);
  const own = (p.prevTid===t.id), bd = own? birdLevelOf(p.tenure||0) : -1;
  const maxSal = maxSalFor(p), minSal = minSalFor(p);
  const mle = mleOf(L,t), bae = baeOf(L,t), allow = Math.max(room, mle, bae);
  if(salary > maxSal + 0.01){ toast("超出该球员顶薪上限（"+fmtM(maxSal)+"）"); return false; }
  if(salary < minSal - 0.01){ toast("报价低于球龄底薪上限（"+fmtM(minSal)+"）"); return false; }
  if(own && bd>=2){
    /* 完整鸟权：可超帽签订，不占用空间 */
  } else if(own && bd===1){
    const lim = Math.min(maxSal, Math.max((p.salary||0)*1.75, capOf(L)*0.20));
    if(salary > lim + 0.01){ toast("早鸟权上限 "+fmtM(lim)+"，无法给出更高报价"); return false; }
  } else if(own){
    const lim = Math.min(maxSal, Math.max((p.salary||0)*1.20, MIN_SAL));
    if(salary > lim + 0.01){ toast("非鸟权上限 "+fmtM(lim)+"（上季薪资的 120%）"); return false; }
  } else if(salary > allow + 0.01){
    toast("薪资空间不足（可用 "+fmtM(room)+"，中产特例 "+fmtM(mle)+"，双年特例 "+fmtM(bae)+"）"); return false;
  }
  const r = signProbOf(L,t,p,salary,pitchKey,rolePromise);
  if(Math.random() < r.prob){
    p.tid = t.id; p.salary = Math.round(salary*10)/10; p.yrs = yrs; p.faSeasons = 0;
    p.tenure = own? Math.min(9, (p.tenure||0)+1) : 1;
    p.bonus = mkIncentive(p, p.salary);
    p.rolePromise = rolePromise || null;
    if(p.rolePromise){
      p.role = p.rolePromise;
      try{ const c = contractOf(L, p.id); if(c) c.role = p.rolePromise; }catch(e){}
    }
    if((!own || bd<1) && salary > room + 0.01){
      if(mle >= salary - 0.01){ L.mleUsed = L.mleUsed || {}; L.mleUsed[t.id] = true; }
      else if(bae >= salary - 0.01){ L.baeUsed = L.baeUsed || {}; L.baeUsed[t.id] = true; }
    }
    t.roster.push(p.id);
    t.payroll = payrollOf(L,t); t.lineup = autoLineup(L,t);
    addNews(L, "【签约】"+t.name+"签下自由球员 "+p.name+"（"+p.pos+"，评分 "+p.ovr+"），"+yrs+" 年 "+fmtM(p.salary)+"/年（兴趣 "+r.sc+"）。","fa");
    toast("签约成功：" + p.name + "（兴趣 " + r.sc + "）");
    return true;
  }
  const why = r.rivals.length? ("被 "+r.rivals[0].name+" 抢先") : (r.sc<50? "对报价不感兴趣" : "决定再观望");
  const who = r.rivals.length? pick(r.rivals) : null;
  toast(who? (p.name+" 选择了 "+who.name+"（兴趣 "+r.sc+"）") : (p.name+" 拒绝了你的报价（兴趣 "+r.sc+"，" + why + "）"));
  return false;
}

function myPickList(L){
  const t = myTeam();
  const out = [];
  const yr = L.year + 1;                       // 选秀权对应届别（赛季结束后即为次年选秀）
  for(let r=1;r<=2;r++) if(L.draftPicks && L.draftPicks[L.year]) out.push(yr+"年 第"+r+"轮");
  return out.length? out : [yr+"年 第1轮", yr+"年 第2轮"];
}
function startDraft(L){
  if(!L.draftClass) L.draftClass = genDraftClass(L, 60);
  const order = lotteryOrder(L);
  const picks = [];
  let idx = 0;
  for(let rd=1; rd<=2; rd++){
    const ord = rd===1? order.slice() : order.slice().reverse();
    ord.forEach((t,i)=> picks.push({tid:t.id, rd:rd, pk:i+1, team:t}));
  }
  L.draftState = {picks:picks, idx:0, klass:L.draftClass, log:[], waiting:null, avail:L.draftClass.slice()};
  L.draftOrder = order.map(t=>t.id);
  addNews(L,"【选秀】"+(L.year+1)+" 年 NBA 选秀大会开始，"+L.teams[order[0].id].name+"获得状元签。","news");
  return draftAdvance(L);
}
function draftValue(L, p, tid){
  const t = L.teams[tid];
  let v = p.pot*1.2 + p.ovr*0.6;
  const need = {PG:0,SG:0,SF:0,PF:0,C:0};
  rosterOf(L,t).forEach(x=> need[x.pos]=(need[x.pos]||0)+1);
  const n = need[p.pos]||0;
  if(n<=1) v += 9; else if(n===2) v += 4; else if(n>=4) v -= 5;
  return v;
}
function draftAdvance(L){
  const ds = L.draftState;
  while(ds.idx < ds.picks.length){
    const cur = ds.picks[ds.idx];
    if(cur.tid === L.myTid){
      ds.waiting = cur;
      return "wait";
    }
    // AI 选择
    const cands = ds.avail.slice().sort((a,b)=> draftValue(L,b,cur.tid)-draftValue(L,a,cur.tid));
    const p = cands[Math.min(ri(3), cands.length-1)] || cands[0];
    if(!p){ ds.idx = ds.picks.length; break; }
    doDraftPick(L, p, cur);
    ds.idx++;
  }
  ds.waiting = null;
  L.phase = "preseason";
  addNews(L,"【选秀】"+(L.year+1)+" 年选秀大会结束。","news");
  return "done";
}
function doDraftPick(L, p, cur){
  const ds = L.draftState;
  const t = L.teams[cur.tid];
  const i = ds.avail.indexOf(p); if(i>=0) ds.avail.splice(i,1);
  p.draft = {yr:L.year+1, rd:cur.rd, pk:cur.pk, prospect:true};
  ds.log.push({rd:cur.rd, pk:cur.pk, team:t.name, name:p.name, pos:p.pos, ovr:p.ovr, pot:p.pot});
  if(t.roster.length >= ROSTER_MAX){
    // 阵容已满：新秀暂不签约，放入自由市场（保留母队鸟权）
    p.tid = -1; p.prevTid = t.id; p.yrs = 0; p.prospect = true;
    if(!L.faPool) L.faPool = [];
    if(L.faPool.indexOf(p) < 0) L.faPool.push(p);
    L.players.push(p); L.byId[p.id] = p;
    if(p.draft.pk===1) addNews(L, "【选秀】"+t.name+"用状元签选中 "+p.name+"（"+p.pos+"，潜力 "+p.pot+"）。","news");
    addNews(L, "【选秀】"+t.name+"阵容已满（15 人），"+p.name+"暂未签约，进入自由市场。","news");
    return;
  }
  p.tid = t.id;
  p.exp = 0;
  p.yrs = 4;
  p.salary = rookieSalOf((cur.rd-1)*30 + cur.pk);   // 按总顺位标准档推算新秀合同
  t.roster.push(p.id);
  L.players.push(p); L.byId[p.id] = p;
  if(p.draft.pk===1) addNews(L, "【选秀】"+t.name+"用状元签选中 "+p.name+"（"+p.pos+"，潜力 "+p.pot+"）。","news");
}

  h += '<div class="kv"><span class="k">薪资空间</span><span class="v">'+fmtM(cap-pay)+'</span></div>';
  const dead = (L.deadCap && L.deadCap[t.id]) ? L.deadCap[t.id] : 0;
  if(dead) h += '<div class="kv"><span class="k">买断死钱</span><span class="v" style="color:var(--red)">'+fmtM(dead)+'</span></div>';
  h += '<div class="kv"><span class="k">奢侈税账单</span><span class="v" style="color:'+(taxBill?"var(--red)":"var(--green)")+'">'+fmtM(taxBill)+'</span></div>';
  h += '</div></div>';
  // 预算
  h += '<div class="card"><div class="hd"><b>运营预算</b></div><div class="bd">';
  const b = t.budget;
  h += '<div class="gen">'+
    '<div class="genrow"><span class="lb">门票定价</span><input type="range" min="80" max="140" step="5" value="'+Math.round(b.tickets*100)+'" data-act="budget" data-k="tickets"><span class="vl">'+Math.round(b.tickets*100)+'%</span></div>'+
    '<div class="genrow"><span class="lb">市场投入</span><input type="range" min="80" max="150" step="5" value="'+Math.round(b.market*100)+'" data-act="budget" data-k="market"><span class="vl">'+Math.round(b.market*100)+'%</span></div>'+
    '<div class="genrow"><span class="lb">青训投入</span><input type="range" min="80" max="150" step="5" value="'+Math.round(b.fac*100)+'" data-act="budget" data-k="fac"><span class="vl">'+Math.round(b.fac*100)+'%</span></div></div>';
  const est = estimateFinance(L,t);
  h += '<div style="margin-top:10px">'+
    '<div class="kv"><span class="k">门票收入</span><span class="v">'+fmtM(est.gate)+'</span></div>'+
    '<div class="kv"><span class="k">转播与分成</span><span class="v">'+fmtM(est.tv)+'</span></div>'+
    '<div class="kv"><span class="k">商品与赞助</span><span class="v">'+fmtM(est.spon)+'</span></div>'+
    '<div class="kv"><span class="k">薪资支出</span><span class="v">-'+fmtM(pay)+'</span></div>'+
    '<div class="kv"><span class="k">奢侈税</span><span class="v">-'+fmtM(taxBill)+'</span></div>'+
    '<div class="kv"><span class="k">运营与青训</span><span class="v">-'+fmtM(est.ops)+'</span></div>'+
    '<div class="kv"><span class="k">预计净利润</span><span class="v" style="color:'+(est.profit>0?"var(--green)":"var(--red)")+'">'+fmtM(est.profit)+'</span></div>'+
    '</div>';
  h += '</div></div>';
  // 薪资明细
  h += '<div class="card"><div class="hd"><b>球员薪资</b></div><div class="bd tight scrollx">';
  h += '<table class="tbl"><thead><tr><th style="text-align:left">球员</th><th>位置</th><th>评分</th><th>年薪</th><th>年限</th></tr></thead><tbody>';
  sortedRoster(L,t).forEach(p=>{
    h += '<tr class="tapable" data-act="player" data-v="'+p.id+'"><td class="nm" style="text-align:left">'+esc(p.name)+'</td>'+
      '<td>'+p.pos+'</td><td>'+p.ovr+'</td><td>'+fmtM(p.salary)+'</td><td>'+(p.yrs||0)+'</td></tr>';
  });
  h += '</tbody></table></div></div>';
  return h;
}
function estimateFinance(L,t){
  const gp = Math.max(1, t.gp);
  const perGame = 19000 * (0.75 + t.prestige/160) * (0.94 + (t.budget.tickets-1)*0.35) + (winPct(t)-0.5)*2600;
  const gate = Math.max(0, perGame * 41 * (t.budget.tickets-1>-0.2?1:0.9));
  const tv = 168;
  const spon = 62 * (0.7 + t.prestige/110) * (0.95 + (t.budget.market-1)*0.55);
  const ops = 78 * t.budget.fac + 46 * t.budget.market;
  const pay = payrollOf(L,t);
  const tax = pay>taxOf(L)? (pay-taxOf(L))*1.75 : 0;
  return {gate:gate, tv:tv, spon:spon, ops:ops, profit: gate+tv+spon-pay-tax-ops};
}

  }));
  return p;
