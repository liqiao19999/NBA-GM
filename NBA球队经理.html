<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e13">
<title>篮球王朝 GM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0e13; --bg2:#0f1620; --panel:#141d29; --panel2:#1a2532; --line:rgba(255,255,255,.08);
  --txt:#e8eef5; --dim:#8496a8; --dim2:#5d6d7e;
  --acc:#f97316; --acc2:#fb923c; --blue:#3b82f6; --green:#22c55e; --red:#ef4444; --gold:#fbbf24; --purple:#a855f7;
  --r:12px; --sh:0 8px 28px rgba(0,0,0,.5);
}
html,body{height:100%;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
body.lock{overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 布局骨架 ---------- */
#app{display:flex;height:100%;width:100%;overflow:hidden}
#side{display:none;width:212px;flex:0 0 212px;background:var(--bg2);border-right:1px solid var(--line);
  flex-direction:column;overflow-y:auto}
#side .logo{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
#side .logo b{font-size:17px;letter-spacing:.5px}
#side .logo i{font-style:normal;color:var(--acc);font-weight:800;font-size:17px}
#side .logo span{display:block;font-size:10.5px;color:var(--dim2);margin-top:3px;letter-spacing:1.5px}
.navitem{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--dim);font-size:13.5px;
  border-left:3px solid transparent;transition:.12s;white-space:nowrap}
.navitem:hover{background:rgba(255,255,255,.04);color:var(--txt)}
.navitem.on{background:linear-gradient(90deg,rgba(249,115,22,.16),transparent);color:var(--acc2);
  border-left-color:var(--acc);font-weight:600}
.navitem .ic{width:18px;text-align:center;font-size:15px}
#side .sidefoot{margin-top:auto;padding:12px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--dim2)}

#wrap{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#top{flex:0 0 auto;background:linear-gradient(180deg,#121b26,#0f1620);border-bottom:1px solid var(--line);
  padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px}
#top .tt{display:flex;flex-direction:column;min-width:0}
#top .tt b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .tt span{font-size:10.5px;color:var(--dim2)}
.chip{display:flex;flex-direction:column;align-items:center;padding:3px 9px;border-radius:8px;
  background:rgba(255,255,255,.05);white-space:nowrap}
.chip b{font-size:12.5px;font-variant-numeric:tabular-nums;line-height:1.25}
.chip span{font-size:9px;color:var(--dim2);letter-spacing:.5px}
.chip.g b{color:var(--green)} .chip.r b{color:var(--red)} .chip.a b{color:var(--acc2)}
.sp{flex:1}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px;padding-bottom:18px}
#tabs{display:flex;flex:0 0 auto;background:#0e151e;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;
  color:var(--dim2);font-size:10px;transition:.12s}
#tabs button .ic{font-size:17px;line-height:1}
#tabs button.on{color:var(--acc2)}
#tabs button.on .ic{transform:translateY(-1px)}
@media(min-width:900px){
  #side{display:flex} #tabs{display:none}
  #main{padding:16px 20px 28px}
  #top{padding:10px 20px 10px 20px}
  .mobonly{display:none!important}
}
@media(min-width:1240px){
  #main{padding:18px 26px 34px;max-width:none}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .grid3{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .gridwide{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;align-items:start}
}

/* ---------- 通用组件 ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.card>.hd{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.035),transparent)}
.card>.hd b{font-size:13px;letter-spacing:.3px}
.card>.hd .sub{font-size:10.5px;color:var(--dim2)}
.card>.bd{padding:10px 12px}
.card>.bd.tight{padding:0}
.tapable{cursor:pointer;transition:.1s}
.tapable:hover{background:rgba(255,255,255,.035)}
.tag{display:inline-block;padding:1px 6px;border-radius:5px;font-size:10px;font-weight:600;
  background:rgba(255,255,255,.08);color:var(--dim)}
.tag.b{background:rgba(59,130,246,.18);color:#7cb2ff}
.tag.o{background:rgba(249,115,22,.18);color:var(--acc2)}
.tag.g{background:rgba(34,197,94,.18);color:#4ade80}
.tag.r{background:rgba(239,68,68,.18);color:#f87171}
.tag.y{background:rgba(251,191,36,.18);color:#fcd34d}
.tag.p{background:rgba(168,85,247,.18);color:#c084fc}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:9px;
  background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:600;transition:.12s}
.btn:active{transform:scale(.97)}
.btn:hover{background:#22303f}
.btn.pri{background:linear-gradient(180deg,#f97316,#ea580c);border-color:#fb923c;color:#fff;
  box-shadow:0 4px 14px rgba(249,115,22,.3)}
.btn.blue{background:linear-gradient(180deg,#3b82f6,#2563eb);border-color:#60a5fa;color:#fff}
.btn.gh{background:transparent}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.38;cursor:not-allowed;box-shadow:none}
.btn:disabled:active{transform:none}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.06);font-size:12.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--dim)}
.kv .v{font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#f97316,#fbbf24)}
.bar.b>i{background:linear-gradient(90deg,#3b82f6,#22d3ee)}
.bar.g>i{background:linear-gradient(90deg,#22c55e,#86efac)}
.bar.r>i{background:linear-gradient(90deg,#ef4444,#f97316)}
.empty{padding:22px 12px;text-align:center;color:var(--dim2);font-size:12.5px}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{position:sticky;top:0;background:#18222e;color:var(--dim2);font-size:10.5px;font-weight:600;
  text-align:right;padding:7px 6px;letter-spacing:.4px;z-index:2}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:10px}
.tbl td{padding:7px 6px;text-align:right;border-bottom:1px solid rgba(255,255,255,.05);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.tapable:hover td{background:rgba(255,255,255,.035)}
.tbl td.nm{max-width:150px;overflow:hidden;text-overflow:ellipsis}
.tbl tr.mine td{background:rgba(249,115,22,.09)}
.tbl tr.mine:hover td{background:rgba(249,115,22,.15)}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* 球员行 */
.pl{display:flex;align-items:center;gap:9px;padding:8px 11px;border-bottom:1px solid rgba(255,255,255,.05)}
.pl:last-child{border-bottom:none}
.pl .pos{width:26px;height:26px;flex:0 0 26px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;font-size:10.5px;font-weight:800;background:rgba(255,255,255,.09);color:var(--dim)}
.pos.PG{background:rgba(59,130,246,.24);color:#93c5fd}
.pos.SG{background:rgba(34,197,94,.24);color:#86efac}
.pos.SF{background:rgba(251,191,36,.24);color:#fcd34d}
.pos.PF{background:rgba(249,115,22,.24);color:#fdba74}
.pos.C{background:rgba(168,85,247,.24);color:#d8b4fe}
.pl .info{flex:1;min-width:0}
.pl .info b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .info span{font-size:10.5px;color:var(--dim2)}
.pl .ovr{width:34px;flex:0 0 34px;text-align:center}
.pl .ovr b{display:block;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.pl .ovr span{font-size:9px;color:var(--dim2)}
.ovrA b{color:#4ade80} .ovrB b{color:#a3e635} .ovrC b{color:#fbbf24} .ovrD b{color:#fb923c} .ovrE b{color:#f87171}

/* 模态 */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(3px);z-index:80;
  display:none;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
#modal .sheet{width:100%;max-width:560px;max-height:88vh;background:var(--bg2);border:1px solid var(--line);
  border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:var(--sh);animation:up .2s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
#modal .mh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
#modal .mh b{font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#modal .mb{padding:12px 14px;overflow-y:auto;-webkit-overflow-scrolling:touch}
#modal .mf{padding:10px 14px;border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:8px;flex:0 0 auto}
#modal .mf .btn{flex:1}
@media(min-width:900px){
  #modal{align-items:center}
  #modal .sheet{max-width:640px;border-radius:16px;max-height:84vh;animation:none}
  #modal .mf{padding-bottom:10px}
}
.xbtn{width:28px;height:28px;flex:0 0 28px;border-radius:8px;background:rgba(255,255,255,.07);
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--dim)}
.xbtn:hover{background:rgba(255,255,255,.13);color:#fff}

/* 生成器 */
.gen{display:flex;flex-direction:column;gap:9px}
.genrow{display:flex;align-items:center;gap:9px}
.genrow .lb{width:52px;flex:0 0 52px;font-size:11px;color:var(--dim2)}
.genrow .vl{width:30px;text-align:right;font-size:11px;font-variant-numeric:tabular-nums;color:var(--dim)}
input[type=range]{-webkit-appearance:none;flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.15);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--acc);border:2px solid #fff2;box-shadow:0 2px 6px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--acc);border:none}

/* 雷达/条形属性 */
.attr{display:flex;align-items:center;gap:8px;padding:3.5px 0}
.attr .an{width:64px;flex:0 0 64px;font-size:11.5px;color:var(--dim)}
.attr .ab{flex:1}
.attr .av{width:26px;text-align:right;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:rgba(255,255,255,.06);border-radius:8px;padding:2px;gap:2px}
.seg button{padding:5px 11px;border-radius:6px;font-size:12px;color:var(--dim);font-weight:600}
.seg button.on{background:var(--panel2);color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.4)}

/* 比分牌 */
.sc{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid rgba(255,255,255,.05)}
.sc:last-child{border-bottom:none}
.sc .tm{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.sc .tm span{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .tm .dot{width:8px;height:8px;flex:0 0 8px;border-radius:2px}
.sc .num{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;width:30px;text-align:right}
.sc .num.w{color:var(--green)} .sc .num.l{color:var(--dim2)}
.live{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:#1e2a38;border:1px solid var(--line);color:var(--txt);padding:9px 15px;border-radius:10px;
  font-size:12.5px;z-index:200;box-shadow:var(--sh);max-width:86vw;text-align:center;pointer-events:none;
  opacity:0;transition:.22s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
@media(min-width:900px){.toast{bottom:32px}}
.tick{color:var(--green);font-weight:700}
.cross{color:var(--red);font-weight:700}
.mut{color:var(--dim2)}
.hi{color:var(--acc2);font-weight:600}
</style>
</head>

function pick(arr){ return arr[ri(arr.length)]; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function gauss(m,s){ let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
  return m + s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=ri(i+1); const t=a[i];a[i]=a[j];a[j]=t; } return a; }

function calcOvr(p){
  const w = OVR_W[p.pos] || OVR_W.SF;
  let s=0;
  for(const k in w) s += (p.r[k]||0) * w[k];
  return Math.round(s);
}
function calcPot(p){ return p.pot; }
function effOvr(p){ // 考虑伤病的即时战力
  return p.ovr;
}

function shapeToTarget(r, pos, target){
  for(let it=0; it<3; it++){
    let fake = {pos:pos, r:r};
    const cur = calcOvr(fake);
    let d = target - cur;
    if(Math.abs(d) < 1) break;
    for(const k of ATTR_KEYS){
      r[k] = clamp(Math.round(r[k] + d*0.92), 20, 99);
    }
  }
  return r;
}

function mkPlayer(tid, target, pos, age, used, opts){
  opts = opts || {};
  const hrange = POS_TPL[pos].h;
  // 身高：约 15% 偏矮 / 15% 偏高
  let h = ri(hrange[1]-hrange[0]+1) + hrange[0];
  if(Math.random()<0.18) h -= ri(3)+1;
  if(Math.random()<0.18) h += ri(3)+1;
  h = clamp(h, 69, 91);
  const baseWt = 165 + (h-70)*6.2;
  const wt = Math.round(baseWt + gauss(0, 11));
  const r = {};
  const tpl = POS_TPL[pos].w;
  for(const k of ATTR_KEYS){
    r[k] = clamp(Math.round(target + (tpl[k]||0)*0.52 + gauss(0, 6.6)), 20, 99);
  }
  shapeToTarget(r, pos, target);
  const ovr = calcOvr({pos:pos, r:r});
  // 潜力
  let room = 0;
  if(age<=20) room = ri(20)+4;
  else if(age<=22) room = ri(15)+2;
  else if(age<=24) room = ri(9);
  else if(age<=26) room = ri(5);
  else room = 0;
  let potRoom = room;
  if(Math.random() < 0.10) potRoom = Math.round(room*0.25);        // 早熟
  if(Math.random() < 0.09) potRoom = room + ri(9)+4;               // 大器晚成
  const pot = clamp(ovr + potRoom, ovr, 99);
  return {
    id:0, name:"", pos:pos, age:age, h:h, wt:wt, r:r, ovr:ovr, pot:pot,
    tid:tid, num:0, exp:Math.max(0, age-19-ri(3)), injured:null,
    mor: 60 + ri(25),
    draft: opts.draft || null,
    st:null, car:null, log:[],
    allStar:0, awards:[], rings:0
  };
}

function salaryOf(ovr, age, pot){
  let eff = ovr;
  if(age && age<=22) eff = ovr + (pot-ovr)*0.30;   // 新秀合同前的潜力溢价
  let s = MIN_SAL + Math.pow(Math.max(0, eff-52)/43, 3.05) * (MAX_SAL-MIN_SAL);
  s = clamp(s, MIN_SAL, MAX_SAL);
  return Math.round(s*10)/10;
}

function mkContract(p){
  const base = salaryOf(p.ovr, p.age, p.pot);
  let yrs;
  const roll = Math.random();
  if(p.exp<=1) yrs = roll<0.45?4:(roll<0.8?3:2);       // 新秀/年轻: 长约
  else if(p.age>=33) yrs = roll<0.4?1:(roll<0.8?2:3);
  else yrs = roll<0.25?1:(roll<0.55?2:(roll<0.85?3:4));
  if(p.age<=21) yrs = Math.max(yrs,3);
  p.salary = base; p.yrs = yrs;
  return p;
}

function mkPool(){
  const tiers = [
    {n:28,  a:[86,96], ages:[26,33]},
    {n:62,  a:[79,86], ages:[23,33]},
    {n:110, a:[72,79], ages:[21,34]},

    {n:112, a:[54,64], ages:[19,36]},
    {n:50,  a:[40,54], ages:[19,37]}
  ];
  const used = {};
  const out = [];
  let id = 1;
  for(const t of tiers){
    for(let i=0;i<t.n;i++){
      const pos = pick(POS_LIST);
      const target = Math.round(rp(t.a[0], t.a[1]));
      let age = Math.round(rp(t.ages[0], t.ages[1]));
      if(Math.random()<0.06) age = 19+ri(3);
      const p = mkPlayer(-1, target, pos, age, used);
      p.name = genName(used);
      p.id = id++;
      mkContract(p);
      p.num = pick(NUMS);
      out.push(p);
    }
  }
  return out;
}

function assignRosters(teams, pool){
  const used = {};
  const quotas = {PG:2, SG:3, SF:3, PF:3, C:3};
  for(const pos of POS_LIST){
    const group = pool.filter(p=>p.pos===pos).sort((a,b)=>b.ovr-a.ovr);
    let gi = 0;
    const q = quotas[pos];
    for(let slot=0; slot<q; slot++){
      // 每轮按底蕴加权随机排序，蛇形取人
      const order = teams.map(t=>({t:t, k:Math.pow(t.prestige/100, 1.9) + Math.random()*0.55}))
                         .sort((x,y)=> y.k - x.k).map(o=>o.t);
      for(const t of order){
        if(gi >= group.length) break;
        const p = group[gi++];
        p.tid = t.id; p.num = pick(NUMS);
        t.roster.push(p.id);
      }
    }
  }
  return pool;
}

/* ---------- 赛程生成 ---------- */
function buildMatchups(year){
  const mu = [];
  const DI = [];
  for(let i=0;i<30;i++){ let c=0; for(let k=0;k<i;k++) if(TEAMS_RAW[k][3]===TEAMS_RAW[i][3]) c++; DI.push(c); }
  for(let i=0;i<30;i++){
    for(let j=i+1;j<30;j++){
      const A=TEAMS_RAW[i], B=TEAMS_RAW[j];
      let n=0;
      if(A[3]===B[3]) n=4;
      else if(A[2]===B[2]) n = 3 + ((((DI[i]+DI[j]+year)%5)<3)?1:0);
      else n=2;
      // 主客场分配
      let h1 = Math.ceil(n/2), h2 = Math.floor(n/2);
      if(((i*7+j*3+year)%2)===0){ const t=h1;h1=h2;h2=t; }
      for(let k=0;k<h1;k++) mu.push({h:i,a:j});
      for(let k=0;k<h2;k++) mu.push({h:j,a:i});
    }
  }
  return mu;
}

function scheduleSeason(year){
  const mu = buildMatchups(year);
  // 按球队统计剩余
  const rem = [];
  for(let i=0;i<30;i++) rem.push([]);
  mu.forEach(g=>{ rem[g.h].push(g); });
  // 反向索引：需要客场的比赛
  const need = [];
  for(let i=0;i<30;i++) need.push({});
  mu.forEach((g,idx)=>{ (need[g.a][g.h] = need[g.a][g.h] || []).push(idx); });
  const pending = mu.map((g,i)=>({g:g, i:i, done:false}));
  const out = [];
  const days = 176;
  const ash = 96; // 全明星周末
  let idx = 0;
  for(let d=0; d<days; d++){
    if(d===ash || d===ash+1 || d===ash+2 || d===ash+3){ out.push([]); continue; }
    const avail = [];
    for(let i=0;i<30;i++){
      let c=0;
      for(const p of pending) if(!p.done && (p.g.h===i||p.g.a===i)) c++;
      avail.push({t:i, c:c});
    }
    avail.sort((x,y)=> y.c - x.c || Math.random()-0.5);
    const played = {};
    const dayGames = [];
    for(const av of avail){
      const t = av.t;
      if(played[t]) continue;
      // 找对手：优先剩余场次多的、未出场的
      let best=-1, bestC=-1;
      for(const p of pending){
        if(p.done) continue;
        const g=p.g;
        let other=-1;
        if(g.h===t) other=g.a; else if(g.a===t) other=g.h; else continue;
        if(played[other]) continue;
        const c = avail.find(x=>x.t===other).c;
        if(c>bestC || (c===bestC && Math.random()<0.4)){ bestC=c; best=p; }
      }
      if(best<0) continue;
      best.done = true;
      played[t]=1; played[best.g.h]=1; played[best.g.a]=1;
      dayGames.push({h:best.g.h, a:best.g.a, hs:-1, as:-1, done:false, d:d, po:false});
    }
    out.push(dayGames);
  }
  // 检查是否有剩余比赛
  let left = pending.filter(p=>!p.done);
  let guard = 0;
  while(left.length>0 && guard<400){
    guard++;
    for(let i=0;i<out.length && left.length>0;i++){
      if(out[i].length>=13) continue;
      const busy={};
      out[i].forEach(g=>{busy[g.h]=1;busy[g.a]=1;});
      for(let k=left.length-1;k>=0;k--){
        const p=left[k];
        if(busy[p.g.h]||busy[p.g.a]) continue;
        busy[p.g.h]=1;busy[p.g.a]=1;
        out[i].push({h:p.g.h,a:p.g.a,hs:-1,as:-1,done:false,d:i,po:false});
        p.done=true; left.splice(k,1);
      }
    }
  }
  return {days:out, left:left.length};
}

function newLeague(myTid){
  const teams = buildTeams();
  const pool = mkPool();
  assignRosters(teams, pool);
  const byId = {}; pool.forEach(p=>byId[p.id]=p);
  const L = {
    ver:SIM_VER, year:2025, phase:"regular", day:0, myTid:myTid,
    teams:teams, players:pool, byId:byId,
    nextPid: pool.length+1,
    sched:[], news:[], history:[], awards:null, faOffers:[],
    cap:CAP, tax:TAX, apron:APRON1,
    champ:null, draftDone:false, allStarDone:false, tradeLog:[],
    settings:{ autoSim:true, askTrade:true }
  };
  // 补齐球队 payroll
  teams.forEach(t=>{ t.payroll = payrollOf(L,t); t.lineup = autoLineup(L,t); t.coach.name = genName({})+" 教练"; });
  const s = scheduleSeason(2025);
  L.sched = s.days;
  L.schedLeft = s.left;
  addNews(L, "赛季揭幕：2025-26 赛季常规赛正式开启，30 支球队向总冠军发起冲击。");
  return L;
}

function payrollOf(L, t){
  let s=0;
  for(const pid of t.roster){ const p=L.byId[pid]; if(p) s += p.salary||0; }
  return Math.round(s*10)/10;
}
function teamOf(L, tid){ return L.teams[tid]; }
function rosterOf(L, t){
  return t.roster.map(id=>L.byId[id]).filter(Boolean);
}
function sortedRoster(L, t){
  const r = rosterOf(L,t);
  const ord = {PG:0,SG:1,SF:2,PF:3,C:4};
  return r.sort((a,b)=> b.ovr-a.ovr);
}
function startersOf(L, t){
  if(!t.lineup) t.lineup = autoLineup(L,t);
  return t.lineup.starters.map(id=>L.byId[id]).filter(Boolean);
}
function autoLineup(L, t){
  const rs = rosterOf(L,t).sort((a,b)=>b.ovr-a.ovr);
  const starters = [];
  const need = {PG:1,SG:1,SF:1,PF:1,C:1};
  for(const p of rs){
    if(need[p.pos]>0 && starters.length<5){ need[p.pos]--; starters.push(p.id); }
  }
  for(const p of rs){
    if(starters.length>=5) break;
    if(starters.indexOf(p.id)<0) starters.push(p.id);
  }
  const minutes = {};
  const rest = rs.filter(p=>starters.indexOf(p.id)<0).slice(0, 7);
  const startMin = [34,33,32,30,28];
  starters.forEach((id,i)=>{ minutes[id] = startMin[i]; });
  const benchSlots = [22,18,14,10,8,6,4];
  rest.forEach((p,i)=>{ minutes[p.id] = benchSlots[i]||3; });
  return {starters:starters, minutes:minutes};
}
function minutesOf(L,t,pid){
  if(!t.lineup) t.lineup = autoLineup(L,t);
  const m = t.lineup.minutes[pid];
  return m===undefined? 0 : m;
}
function activePlayers(L, t){
  // 出场轮换：按分钟>0 且未伤
  if(!t.lineup) t.lineup = autoLineup(L,t);
  const out = [];
  for(const pid in t.lineup.minutes){
    const p = L.byId[pid];
    if(!p || p.tid!==t.id) continue;
    if(p.injured) continue;
    if(t.lineup.minutes[pid]<=0) continue;
    out.push(p);
  }
  if(out.length<5){
    const rs = rosterOf(L,t).filter(p=>!p.injured).sort((a,b)=>b.ovr-a.ovr);
    for(const p of rs){ if(out.length>=5) break; if(out.indexOf(p)<0) out.push(p); }
  }
  return out;
}
function addNewsBase(L, txt, tag){
  L.news.unshift({d:L.day, y:L.year, t:txt, tag:tag||""});
  if(L.news.length>200) L.news.pop();
}

function usageW(p){

function wpick(list, weightFn, exclude){
  let tot=0; const ws=[];
  for(const it of list){ if(it===exclude){ws.push(0);continue;} const w=weightFn(it); ws.push(w); tot+=w; }
  if(tot<=0) return list[0];
  let x = Math.random()*tot;
  for(let i=0;i<list.length;i++){ x-=ws[i]; if(x<=0) return list[i]; }
  return list[list.length-1];
}

/* 轮换计划：24 段，每段 2 分钟 */
function buildRotation(L, t){
  let act = activePlayers(L, t);
  if(act.length<5){
    const rest = rosterOf(L,t).sort((a,b)=>b.ovr-a.ovr);
    for(const p of rest){ if(act.length>=5) break; if(act.indexOf(p)<0) act.push(p); }
  }
  const target = {}; let tot=0;
  for(const p of act){ let m = t.lineup.minutes[p.id]; if(m===undefined||m===null) m = 0;
    if(m<=0) m = 6; target[p.id]=m*60; tot += m; }
  const scale = tot>240 ? 240/tot : 1;
  const played = {};
  const plan = [];
  for(let s=0;s<24;s++){
    const cand = act.map(p=>{
      const fat = (s>0 && plan[s-1].some(x=>x.id===p.id)) ? 26 : 0;
      const need = (target[p.id]||0)*scale - (played[p.id]||0) + fat;
      return {p:p, need:need};
    }).sort((x,y)=> y.need - x.need);
    const five = cand.slice(0,5).map(c=>c.p);
    five.forEach(p=>{ played[p.id] = (played[p.id]||0)+120; });
    plan.push(five);
  }
  return {plan:plan, played:played};
}

function newLine(){
  return {sec:0,pts:0,reb:0,orb:0,drb:0,ast:0,stl:0,blk:0,to:0,pf:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0};
}

function simGame(L, hTid, aTid, opts){
  opts = opts||{};
  const H = L.teams[hTid], A = L.teams[aTid];
  const rbH = buildRotation(L,H), rbA = buildRotation(L,A);
  const rotH = rbH.plan, rotA = rbA.plan;
  const box = {};
  const get = (pid)=>{ if(!box[pid]) box[pid]=Object.assign({pid:pid}, newLine()); return box[pid]; };
  const qs = [[0,0],[0,0],[0,0],[0,0]];
  const qW = [0.243,0.250,0.250,0.257];
  let paceP = TUNE.POSS
    + (H.strat.tempo-1)*3.4 + (A.strat.tempo-1)*3.4
    + (A.strat.tempo - H.strat.tempo)*0.6 + gauss(0,3.0);
  paceP = clamp(paceP, 86, 114);
  const possH = Math.round(paceP*(1+gauss(0,0.012)));
  const possA = Math.round(paceP*(1+gauss(0,0.012)));

  // 球队每节命中数缓存(用于和局)
  const homeHca = TUNE.HCA, awayHca = -0.6;

  for(let q=0;q<4;q++){
    const ph = Math.round(possH*qW[q]);
    const pa = Math.round(possA*qW[q]);
    const last = (q===3);
    runHalf(H, A, ph, q, true, homeHca, last);
    runHalf(A, H, pa, q, false, awayHca, last);
  }
  function segIdx(q, i, n){
    const s = Math.floor(i/Math.max(1,Math.round(n/6)));
    return q*6 + clamp(s,0,5);
  }

  function runHalf(off, def, poss, q, isHome, hca, last){
    const rotOff = isHome? rotH : rotA;
    const rotDef = isHome? rotA : rotH;
    const toRate = clamp(TUNE.TO * (1 + (avgOf(off,'han')-avgOf(def,'stl'))*0.0042), 0.075, 0.20);
    for(let i=0;i<poss;i++){
      const sIdx = segIdx(q, i, poss);
      const o5 = rotOff[sIdx], d5 = rotDef[sIdx];
      const d2 = def2Of(d5), d3 = def3Of(d5);
      // 失误
      if(Math.random() < toRate){
        const tk = wpick(o5, p=>Math.pow(p.r.han*0.6+p.r.pas*0.4,1.6));
        get(tk.id).to++;
        if(Math.random() < TUNE.STL){
          const th = wpick(d5, p=>Math.pow(p.r.stl,2.2));
          get(th.id).stl++;
        }
        continue;
      }
      let ext = 0;
      let live = true;
      let first = true;
      while(live && ext<4){
        live = false; ext++;
        let scorer = wpick(o5, usageW);
        if(last && Math.abs(qs[0][isHome?0:1]+qs[1][isHome?0:1]+qs[2][isHome?0:1]+qs[3][isHome?0:1]
            - (qs[0][isHome?1:0]+qs[1][isHome?1:0]+qs[2][isHome?1:0]+qs[3][isHome?1:0]))<9)
          scorer = wpick(o5, p=> usageW(p)*(p.ovr>82?1.5:0.85));
        const is3 = Math.random() < tpTend(scorer);
        const ln = get(scorer.id);
        // 犯规
        const fpr = is3? TUNE.FT3 : TUNE.FT2;
        if(Math.random() < fpr){
          const dfd = wpick(d5, p=>Math.pow(Math.max(6,100-p.r.diq)*0.5+p.r.blk*0.5, 1.8));
          get(dfd.id).pf++;
          const n = is3?3:2;
          ln.fta += n;
          for(let k=0;k<n;k++){ if(Math.random() < ftp(scorer)){ ln.ftm++; ln.pts++; qs[q][isHome?0:1]++; } }
          if(!is3 && Math.random()<0.02){ ln.fga++; } // 技术性忽略
          live = false; continue;
        }
        if(is3){
          ln.tpa++; ln.fga++;
          if(Math.random() < p3s(scorer, d3, hca)){
            ln.tpm++; ln.fgm++; ln.pts+=3; qs[q][isHome?0:1]+=3;
            if(Math.random()<TUNE.AST){
              const as = wpick(o5.filter(p=>p.id!==scorer.id), p=>Math.pow(p.r.pas,2.4));
              if(as) get(as.id).ast++;
            }
            if(Math.random()<TUNE.AND1){ ln.fta++; if(Math.random()<ftp(scorer)){ ln.ftm++;ln.pts++;qs[q][isHome?0:1]++; } }
          }else{
            if(Math.random()<TUNE.BLK*0.18){
              const bl = wpick(d5, p=>Math.pow(p.r.blk,2.6)); get(bl.id).blk++;
              get(wpick(d5,p=>Math.pow(p.r.drb,2.0)).id).drb++;
            }else live = reb(o5,d5,get,true);
          }
        }else{
          ln.fga++;
          if(Math.random() < p2s(scorer, d2, hca)){
            ln.fgm++; ln.pts+=2; qs[q][isHome?0:1]+=2;
            if(Math.random()<TUNE.AST){
              const as = wpick(o5.filter(p=>p.id!==scorer.id), p=>Math.pow(p.r.pas,2.4));
              if(as) get(as.id).ast++;
            }
            if(Math.random()<TUNE.AND1){ ln.fta++; if(Math.random()<ftp(scorer)){ ln.ftm++;ln.pts++;qs[q][isHome?0:1]++; } }
          }else{
            if(Math.random()<TUNE.BLK){
              const bl = wpick(d5, p=>Math.pow(p.r.blk,2.6)); get(bl.id).blk++;
              get(wpick(d5,p=>Math.pow(p.r.drb,2.0)).id).drb++;
            }else live = reb(o5,d5,get,is3);
          }
        }
      }
    }
  }
  function reb(o5,d5,get,is3){
    const orbAdj = TUNE.ORB * (is3?1.06:0.96);
    if(Math.random() < orbAdj){
      const o = wpick(o5, p=>Math.pow(p.r.orb,2.4));
      const l=get(o.id); l.reb++; l.orb++;
      return true;
    }
    const d = wpick(d5, p=>Math.pow(p.r.drb,2.2));
    const l=get(d.id); l.reb++; l.drb++;
    return false;
  }
  function avgOf(t,k){
    const act = activePlayers(L,t); let s=0;
    for(const p of act) s += p.r[k];
    return act.length? s/act.length : 50;
  }
  function ftp(p){ return clamp(sig(TUNE.SFT + TUNE.KFT*(p.r.ft-75)), 0.36, 0.96); }
  function p2s(p, d2, hca){
    const o2 = 0.55*p.r.ins + 0.45*p.r.mid;
    return clamp(sig(TUNE.S2 + TUNE.K2*(o2 + hca - d2)), 0.26, 0.76);
  }
  function p3s(p, d3, hca){
    const o3 = 0.78*p.r.tp + 0.22*p.r.mid;
    return clamp(sig(TUNE.S3 + TUNE.K3*(o3 + hca - d3)), 0.14, 0.58);
  }
  const hs = qs.reduce((a,q)=>a+q[0],0), as = qs.reduce((a,q)=>a+q[1],0);
  const minsec = {};
  for(const k in rbH.played) minsec[k] = rbH.played[k];
  for(const k in rbA.played) minsec[k] = (minsec[k]||0) + rbA.played[k];
  return {hs:hs, as:as, qs:qs, box:box, minsec:minsec, hTid:hTid, aTid:aTid};
}

/* 把比赛结果写入统计 */
function applyGame(L, res){
  const H = L.teams[res.hTid], A = L.teams[res.aTid];
  H.ptsF += res.hs; H.ptsA += res.as; H.gp++;
  A.ptsF += res.as; A.ptsA += res.hs; A.gp++;
  for(const pid in res.box){
    const s = res.box[pid];
    const p = L.byId[pid]; if(!p) continue;
    if(!p.st) p.st = newLine();
    p.st.sec += Math.round((res.minsec && res.minsec[pid]) || 0);
    for(const k in s){ if(k==='pid'||k==='sec') continue; p.st[k] = (p.st[k]||0) + s[k]; }
    p.st.g = (p.st.g||0)+1;
    // 先发
    if(H.lineup && H.lineup.starters.indexOf(+pid)>=0 && p.tid===H.id) p.st.gs=(p.st.gs||0)+1;
    else if(A.lineup && A.lineup.starters.indexOf(+pid)>=0 && p.tid===A.id) p.st.gs=(p.st.gs||0)+1;
    // 伤病
    if(!p.injured && Math.random() < 0.00085*(s.sec/1500+0.6)){
      const days = 3 + ri(38);
      p.injured = {d:days, t: injText()};
      addNews(L, "【伤病】"+p.name+"（"+L.teams[p.tid].abbr+"）"+p.injured.t+"，预计缺阵 "+days+" 天。", "inj");
    }
  }
  if(res.hs>res.as){
    H.w++; A.l++;
    H.streak = H.streak>=0? H.streak+1 : 1;
    A.streak = A.streak<=0? A.streak-1 : -1;
    if(H.conf===A.conf){ H.cw++; A.cl++; }
    if(H.div===A.div){ H.dw++; A.dl++; }
  }else{
    A.w++; H.l++;
    A.streak = A.streak>=0? A.streak+1 : 1;
    H.streak = H.streak<=0? H.streak-1 : -1;
    if(H.conf===A.conf){ A.cw++; H.cl++; }
    if(H.div===A.div){ A.dw++; H.dl++; }
  }
  H.last10.push(res.hs>res.as?1:0); if(H.last10.length>10) H.last10.shift();
  A.last10.push(res.as>res.hs?1:0); if(A.last10.length>10) A.last10.shift();
}
const INJ = ["脚踝扭伤","膝盖挫伤","腿筋拉伤","手指骨折","背部痉挛","肩部不适","小腿拉伤","手腕扭伤","脚部酸痛","脑震荡保护","腹股沟拉伤","生病"];
function injText(){ return pick(INJ); }

function teamRating(L,t){
  const rs = rosterOf(L,t); if(!rs.length) return 40;
  const st = startersOf(L,t);
  let s=0, wsum=0;
  const mins = t.lineup.minutes;
  for(const p of rs){
    if(p.injured) continue;
    const m = mins[p.id]!==undefined? mins[p.id] : 4;
    const w = m/40;
    s += p.ovr*w; wsum += w;
  }
  return wsum>0? s/wsum : 40;
}

/* ============================================================
   模块: 03 赛季推进 / 排名 / 季后赛 / 颁奖 / 选秀 / 自由市场 / 交易 / 成长
   ============================================================ */

function confTeams(L, conf){ return L.teams.filter(t=>t.conf===conf); }
function winPct(t){ const g=t.w+t.l; return g? t.w/g : 0; }
function standings(L, conf){
  const arr = conf? confTeams(L,conf) : L.teams.slice();
  return arr.sort((a,b)=> winPct(b)-winPct(a) || (b.w-a.w));
}
function divStandings(L, div){
  return L.teams.filter(t=>t.div===div).sort((a,b)=> winPct(b)-winPct(a) || b.w-a.w);
}
function leagueRank(L, tid){
  const st = standings(L, null);
  const i = st.findIndex(t=>t.id===tid);
  return i+1;
}
function seedConf(L, conf){
  return standings(L,conf).slice(0,10);
}

function playDay(L){
  const day = L.sched[L.day];
  if(!day) return {games:0, results:[], userGame:null};
  const results = []; let userGame = null;
  for(const g of day){
    if(g.done) continue;
    const res = simGame(L, g.h, g.a, {});
    g.hs = res.hs; g.as = res.as; g.done = true; g.qs = res.qs; g.box = res.box;
    applyGame(L, res);
    results.push(g);
    if(g.h===L.myTid || g.a===L.myTid) userGame = g;
  }
  L.day++;
  doInjuriesTick(L);
  if(L.day>=96 && !L.allStarDone && L.phase==="regular") runAllStar(L);
  return {games:results.length, results:results, userGame:userGame};
}
function doInjuriesTick(L){
  for(const p of L.players){
    if(p.injured){ p.injured.d--; if(p.injured.d<=0) p.injured=null; }
  }
}
function isLastDay(L){ return L.day >= L.sched.length; }
function nextUserGame(L){
  for(let d=L.day; d<L.sched.length; d++){
    for(const g of L.sched[d]) if(!g.done && (g.h===L.myTid||g.a===L.myTid)) return {g:g, d:d};
  }
  return null;
}
function simToNextUser(L, maxDays){
  let n=0; const my = nextUserGame(L);
  const lim = my? my.d : L.sched.length;
  while(L.day < lim && n < (maxDays||400)){ playDay(L); n++; }
  return n;
}
function simRestOfSeason(L){
  let n=0;
  while(L.day < L.sched.length && n<400){ playDay(L); n++; }
  return n;
}

/* ---------- 赛季结算 ---------- */
function seasonOver(L){
  L.phase = "playoffs";
  if(!L.awards && typeof computeAwards === "function") computeAwards(L);
  buildPlayoffs(L);
  return L.po;
}
function buildPlayoffs(L){
  const po = {east:{}, west:{}, round:0, games:[], log:[], done:false, champ:null, fmvp:null};
  L.teams.forEach(t=>{ t.playoff = false; });
  ["E","W"].forEach(c=>{
    const key = c==="E"?"east":"west";
    const t10 = seedConf(L, c);
    po[key].seeds = t10;
    po[key].series = null;
  });
  L.po = po;
  runPlayIn(L);
}
function runPlayIn(L){
  const out = {};
  ["E","W"].forEach(c=>{
    const key = c==="E"?"east":"west";
    const s = L.po[key].seeds;
    const r1 = simSeries(L, s[6].id, s[7].id, 1, true);
    const r2 = simSeries(L, s[8].id, s[9].id, 1, true);
    const r3 = simSeries(L, r1.w, r2.w, 1, true);
    const seeds = s.slice(0,7).concat([L.teams[r3.w]]);
    seeds.forEach(t=>{ t.playoff = true; });
    L.po[key].seeds = seeds;
    L.po.log.push({t:"附加赛 "+(c==="E"?"东部":"西部"), t1:r1.w, t2:r1.lose, r:"单场", sc:""});
  });
  L.po.round = 1;
  L.po.bracket = {};
  ["E","W"].forEach(c=>{
    const key = c==="E"?"east":"west";
    const s = L.po[key].seeds;
    L.po.bracket[key] = [[s[0].id,s[7].id],[s[3].id,s[4].id],[s[1].id,s[6].id],[s[2].id,s[5].id]];
  });
}
function simSeries(L, t1, t2, round, single){
  const need = single?1:4;
  const better = (L.teams[t1].w >= L.teams[t2].w)? t1 : t2;
  const worse = better===t1? t2 : t1;
  const homeSeq = single? [better] : [better,better,worse,worse,better,worse,better];
  let w1=0, w2=0, g=0;
  while(w1<need && w2<need){
    const h = homeSeq[g % homeSeq.length];
    const a = h===better? worse : better;
    const res = simGame(L, h, a, {po:true});
    if(res.hs>res.as){ if(h===t1) w1++; else w2++; }
    else { if(a===t1) w1++; else w2++; }
    g++;
    if(g>9) break;
  }
  return {t1:t1, t2:t2, w1:w1, w2:w2, w:w1>w2?t1:t2, lose:w1>w2?t2:t1, games:g};
}
function simPlayoffRound(L){
  const po = L.po;
  const round = po.round;
  const res = {};
  ["E","W"].forEach(c=>{
    const key = c==="E"?"east":"west";
    const br = po.bracket[key];
    const out = [];
    const winners = [];
    for(let i=0;i<br.length;i++){
      const s = simSeries(L, br[i][0], br[i][1], round, false);
      out.push(s); winners.push(s.w);
    }
    const nb = [];
    for(let i=0;i<winners.length;i+=2) nb.push([winners[i], winners[i+1]]);
    po.bracket[key] = nb;
    res[key] = out;
  });
  po.round++;
  return res;
}
function simPlayoffsAll(L, interactive){
  const log = [];
  for(let r=0;r<3;r++){
    const res = simPlayoffRound(L);
    ["E","W"].forEach(c=>{
      const key = c==="E"?"east":"west";
      (res[key]||[]).forEach(s=>{
        log.push({r:L.po.round-1, t1:s.t1, t2:s.t2, w:s.w, l:s.lose, sc:s.w1+"-"+s.w2});
      });
    });
  }
  const fin = simSeries(L, L.po.bracket.east[0][0], L.po.bracket.west[0][0], 4, false);
  log.push({r:4, t1:fin.t1, t2:fin.t2, w:fin.w, l:fin.lose, sc:fin.w1+"-"+fin.w2});
  L.po.champ = fin.w;
  const ct = L.teams[fin.w];
  ct.titles++; ct.fin++;
  L.teams[fin.lose].fin++;
  L.champ = fin.w;
  // FMVP：冠军阵中综合贡献最高者
  const cands = rosterOf(L, ct).slice().sort((a,b)=> impact(L,b)-impact(L,a));
  const fmvp = cands[0] || null;
  if(fmvp){ fmvp.awards.push({y:L.year, t:"fmvp"}); L.po.fmvp = fmvp.id; }
  L.po.mvp = fmvp? fmvp.id : null;
  L.po.log = log;
  L.po.done = true;
  L.phase = "draft";
  if(!L.draftClass) L.draftClass = genDraftClass(L, 60);
  addNews(L, "【总冠军】"+ct.name+"击败 "+L.teams[fin.lose].name+"（"+fin.w1+"-"+fin.w2+"），夺得 "+L.year+"-"+((L.year+1)%100)+" 赛季总冠军！", "champ");
  if(fmvp) addNews(L, "【FMVP】总决赛最有价值球员："+fmvp.name+"（"+ct.abbr+"）。", "award");
  return log;
}

/* ---------- 奖项 ---------- */
function pg(p,k){ return p.st&&p.st.g? (p.st[k]||0)/p.st.g : 0; }
function impact(L, p){
  if(!p.st || p.st.g < Math.max(12, Math.round(82*0.55))) return -1;
  const g = p.st.g;
  const ts = (p.st.fga>0)? (p.st.pts/(2*(p.st.fga+0.44*p.st.fta))) : 0;
  let v = pg(p,'pts')*1.00 + pg(p,'reb')*1.05 + pg(p,'ast')*1.45 + pg(p,'stl')*2.30 + pg(p,'blk')*2.10
        - pg(p,'to')*1.50 + (ts-0.55)*22 + (p.st.pts/g-18)*0.22;
  const t = L.teams[p.tid];
  v *= 0.52 + 0.48*(t? winPct(t) : .5);
  return Math.round(v*10)/10;
}
function defImpact(L, p){
  if(!p.st || p.st.g < 30) return -1;
  const t = L.teams[p.tid];
  return Math.round((pg(p,'reb')*1.1 + pg(p,'stl')*2.6 + pg(p,'blk')*2.6 + (t? winPct(t)*7:3))*10)/10;
}
function qualifiers(L, extra){
  const arr = L.players.filter(p=>{ if(p.st && p.st.g>=Math.max(12, Math.round(82*0.55))) return true; return false; });
  return arr;
}
function computeAwards(L){
  const q = qualifiers(L);
  const mvp = q.slice().sort((a,b)=> impact(L,b)-impact(L,a)).slice(0,1)[0];
  const dpoy = q.slice().sort((a,b)=> defImpact(L,b)-defImpact(L,a)).slice(0,1)[0];
  const rookies = q.filter(p=> p.exp<=1 && p.age<=22);
  const roy = rookies.sort((a,b)=> impact(L,b)-impact(L,a))[0] || null;
  const mipCand = q.filter(p=> p._prevOvr && p.ovr - p._prevOvr > 2);
  const mip = (mipCand.length? mipCand.sort((a,b)=> (b.ovr-b._prevOvr)-(a.ovr-a._prevOvr))[0] : null);
  const sm = q.filter(p=> minutesOf(L,L.teams[p.tid],p.id) < 30 && p.ovr<79);
  const sixth = sm.sort((a,b)=> impact(L,b)-impact(L,a))[0]||null;
  const allnba = [[],[],[]];
  const sorted = q.slice().sort((a,b)=> impact(L,b)-impact(L,a));
  let cnt={PG:0,SG:0,SF:0,PF:0,C:0};
  const first=[],second=[],third=[];
  for(const p of sorted){
    if(first.length<5 && (cnt[p.pos]||0)<2){ first.push(p); cnt[p.pos]=(cnt[p.pos]||0)+1; }
  }
  for(const p of sorted){ if(first.length>=5)break; if(first.indexOf(p)<0) first.push(p); }
  const c2={PG:0,SG:0,SF:0,PF:0,C:0};
  for(const p of sorted){
    if(first.indexOf(p)>=0) continue;
    if(second.length<5 && (c2[p.pos]||0)<2){ second.push(p); c2[p.pos]=(c2[p.pos]||0)+1; }
  }
  for(const p of sorted){ if(second.length>=5)break; if(first.indexOf(p)<0&&second.indexOf(p)<0) second.push(p); }
  const c3={PG:0,SG:0,SF:0,PF:0,C:0};
  for(const p of sorted){
    if(first.indexOf(p)>=0||second.indexOf(p)>=0) continue;
    if(third.length<5 && (c3[p.pos]||0)<2){ third.push(p); c3[p.pos]=(c3[p.pos]||0)+1; }
  }
  const allstar = sorted.slice(0, 24);
  const aw = {mvp:mvp, dpoy:dpoy, roy:roy, mip:mip, sixth:sixth, allnba:[first,second,third], allstar:allstar, fmvp:null};
  L.awards = aw;
  [["mvp",mvp],["dpoy",dpoy],["roy",roy],["mip",mip],["sixth",sixth]].forEach(x=>{
    if(x[1]) x[1].awards.push({y:L.year, t:x[0]});
  });
  if(mvp) addNews(L,"【MVP】"+L.year+"-"+((L.year+1)%100)+" 常规赛 MVP："+mvp.name+"（"+L.teams[mvp.tid].abbr+"）场均 "+pg(mvp,'pts').toFixed(1)+" 分 "+pg(mvp,'reb').toFixed(1)+" 篮板 "+pg(mvp,'ast').toFixed(1)+" 助攻。","award");
  return aw;
}

/* ---------- 全明星 ---------- */
function runAllStar(L){

  q.sort((a,b)=> impact(L,b)-impact(L,a));

}

/* ---------- 选秀 ---------- */
function lotteryOrder(L){
  const noPo = L.teams.filter(t=> !t.playoff).map(t=>({t:t}));
  const poT = L.teams.filter(t=> t.playoff);
  const odds = [140,140,140,125,105,90,75,60,45,30,20,15,10,5];
  const picks = [];
  const pool = noPo.slice();
  // 只对战绩最差的14队乐透
  pool.sort((a,b)=> winPct(a.t)-winPct(b.t));
  const lot = pool.slice(0,14);
  const rest = pool.slice(14);
  const remaining = lot.map((x,i)=>({x:x, w:odds[i]||5}));
  let order = [];
  // 抽前4
  let pool2 = remaining.slice();
  for(let k=0;k<4;k++){
    let tot = pool2.reduce((a,b)=>a+b.w,0);
    let x = Math.random()*tot, sel=0;
    for(let i=0;i<pool2.length;i++){ x-=pool2[i].w; if(x<=0){ sel=i; break; } }
    order.push(pool2[sel].x.t);
    pool2.splice(sel,1);
  }
  // 其余乐透按战绩倒序
  pool2.sort((a,b)=> winPct(a.x.t)-winPct(b.x.t)).forEach(o=>order.push(o.x.t));
  rest.sort((a,b)=> winPct(a.t)-winPct(b.t)).forEach(o=>order.push(o.t));
  // 季后赛球队按战绩倒序
  poT.sort((a,b)=> winPct(a)-winPct(b)).forEach(t=>order.push(t));
  return order;
}
function genDraftClass(L, n){
  const used = {};
  L.players.forEach(p=> used[p.name]=1);
  const out = [];
  for(let i=0;i<n;i++){
    const pos = pick(POS_LIST);
    const tier = i<5? rp(74,86) : i<14? rp(68,80) : i<30? rp(60,74) : i<45? rp(52,66) : rp(42,58);
    const age = 19 + (Math.random()<0.75?0:(Math.random()<0.6?1:2));
    const p = mkPlayer(-1, Math.round(tier), pos, age, used);
    p.name = genName(used);
    p.id = L.nextPid++;
    p.draft = {yr:L.year, rd: i<30?1:2, pk: (i%30)+1, prospect:true};
    p.exp = 0;
    mkContract(p);
    p.salary = Math.round((MIN_SAL + (i<30? 1.6:0.4) + Math.random()*1.4)*10)/10;
    p.yrs = 4;
    p.pot = clamp(p.pot + (i<5? ri(9):(i<14? ri(7): ri(5))), p.ovr, 99);
    out.push(p);
  }
  return out;
}
function runDraft(L){
  const order = lotteryOrder(L);
  const klass = genDraftClass(L, 60);
  const res = [];
  let pi = 0;
  for(let rd=0; rd<2; rd++){
    for(let i=0;i<30;i++){
      const t = order[i];
      const p = klass[pi++];
      if(!p) break;
      // AI 选择：优先位置需求
      p.tid = t.id; p.draft = {yr:L.year, rd:rd+1, pk:i+1};
      t.roster.push(p.id);
      L.players.push(p); L.byId[p.id]=p;
      res.push({t:t, p:p});
    }
    order.reverse();
  }
  L.draftRes = res;
  L.draftDone = true;
  return res;
}

/* ---------- 薪资 / 工资帽 ---------- */
function capOf(L){ return CAP * (1 + (L.year-2025)*0.06); }
function taxOf(L){ return TAX * (1 + (L.year-2025)*0.06); }
function teamPayroll(L,t){ return payrollOf(L,t); }
function capSpace(L,t){ return Math.round((capOf(L)-payrollOf(L,t))*10)/10; }
function enforceCap(L){
  L.teams.forEach(t=>{
    t.payroll = payrollOf(L,t);
    t.over = t.payroll > taxOf(L);
  });
}

/* ---------- 自由市场 ---------- */
function demandOf(L, p){
  const base = salaryOf(p.ovr, p.age, p.pot);
  const ageF = p.age<=23? 1.10 : p.age>=34? 0.72 : 1.0;
  return Math.round(clamp(base*ageF, MIN_SAL, MAX_SAL)*10)/10;
}
function makeFA(L){
  const fa = [];
  for(const t of L.teams){
    const keep = [];
    const next = [];
    const rs = sortedRoster(L,t);
    for(const p of rs){
      p.yrs = (p.yrs||1) - 1;
      if(p.yrs<=0 || (p.age>=33 && p.ovr<68)){
        if(p.yrs<=0 && Math.random()<0.72 && t.roster.length>ROSTER_MIN){ next.push(p.id); continue; }
        if(p.yrs<=0){ keep.push(p.id); }
        else { /* 合同到期 */ next.push(p.id); }
      } else keep.push(p.id);
    }
    // 保留名单裁剪到 15
    while(keep.length>ROSTER_MAX){ next.push(keep.pop()); }
    t.roster = keep;
    next.forEach(id=>{ const p=L.byId[id]; p.tid=-1; p.yrs=0; fa.push(p); });
  }
  // 其他已有FA
  L.players.forEach(p=>{ if(p.tid<0 && fa.indexOf(p)<0) fa.push(p); if(p.tid<0) p.yrs=0; });
  // 补齐球队人数
  L.teams.forEach(t=>{
    while(t.roster.length < ROSTER_MIN){
      const cand = fa.filter(p=>p.tid<0).sort((a,b)=>b.ovr-a.ovr)[0];
      if(!cand) break;
      cand.tid = t.id; cand.yrs = 1+ri(2); cand.salary = demandOf(L,cand);
      t.roster.push(cand.id);
      fa.splice(fa.indexOf(cand),1);
      addNews(L, "【签约】"+t.name+"签下 "+cand.name+"（"+cand.pos+" "+cand.ovr+"）。","fa");
    }
  });
  L.faPool = fa.filter(p=>p.tid<0);
  return L.faPool;
}
function aiFreeAgency(L){
  const pool = L.faPool.filter(p=>p.tid<0);
  pool.sort((a,b)=> b.ovr-a.ovr);
  for(const p of pool){
    const need = [];
    for(const t of L.teams){
      if(t.roster.length>=ROSTER_MAX) continue;
      const room = capSpace(L,t);
      const dm = demandOf(L,p);
      let sc = 0;
      if(room >= dm) sc += 40; else if(room >= dm*0.5) sc += 12; else sc -= 25;
      sc += (t.prestige-50)*0.28;
      sc += (p.ovr-62)*0.6;
      sc -= Math.abs(needAt(t,p.pos)-1.6)*9;
      sc += Math.random()*22;
      need.push({t:t, sc:sc, ok: room>=dm*0.6});
    }
    need.sort((a,b)=> b.sc-a.sc);
    const best = need[0];
    if(best && best.ok && best.sc>10){
      p.tid = best.t.id; p.yrs = 1+ri(3);
      p.salary = Math.round(clamp(demandOf(L,p), MIN_SAL, MAX_SAL)*10)/10;
      best.t.roster.push(p.id);
      addNews(L, "【自由市场】"+best.t.name+"签下 "+p.name+"（"+p.pos+"，评分 "+p.ovr+"），合同 "+p.yrs+" 年 "+fmtM(p.salary)+"/年。","fa");
    }
  }
  L.faPool = L.players.filter(p=>p.tid<0);
  // 落选/退役清理低战力FA
  enforceCap(L);
  L.teams.forEach(t=>{ t.payroll = payrollOf(L,t); t.lineup = autoLineup(L,t); });
}
function needAt(t, pos){
  let n=0;
  t.roster.forEach(id=>{});
  return 0;
}
function posCount(L, t){
  const c = {PG:0,SG:0,SF:0,PF:0,C:0};
  rosterOf(L,t).forEach(p=>{ c[p.pos]=(c[p.pos]||0)+1; });
  return c;
}

/* ---------- 球员成长 ---------- */
function developPlayer(L, p){
  p._prevOvr = p.ovr;
  const t = L.teams[p.tid];
  let age = p.age;
  let grow = 0;
  if(age<=21) grow = gauss(3.4, 3.0);
  else if(age<=23) grow = gauss(2.6, 2.6);
  else if(age<=25) grow = gauss(1.5, 2.2);
  else if(age<=27) grow = gauss(0.5, 1.8);
  else if(age<=29) grow = gauss(-0.4, 1.6);
  else if(age<=31) grow = gauss(-1.3, 1.5);
  else if(age<=33) grow = gauss(-2.4, 1.6);
  else if(age<=35) grow = gauss(-3.6, 1.8);
  else grow = gauss(-5.0, 2.2);
  // 潜力天花板
  const room = p.pot - p.ovr;
  if(grow>0 && room<=0) grow *= 0.25;
  else if(grow>0) grow = Math.min(grow, Math.max(0.6, room*0.45));
  // 出场时间/教练/设施
  const minutes = (p.st && p.st.g)? (p.st.sec||0)/60/p.st.g : 0;
  const playF = minutes>=26? 1.18 : minutes>=16? 1.05 : minutes>=8? 0.95 : 0.82;
  const coachF = t? 0.9 + (t.coach.rating-55)/260 : 1;
  grow *= playF*coachF;
  grow += gauss(0, 1.4);
  grow = clamp(grow, -12, 12);
  let d = Math.round(grow);
  if(d===0 && Math.random()<Math.abs(grow)) d = grow>0?1:-1;
  if(d!==0){
    const keys = ATTR_KEYS.slice();
    shuffle(keys);
    const n = Math.min(keys.length, 6+ri(6));
    for(let i=0;i<n;i++){
      const k = keys[i];
      p.r[k] = clamp(p.r[k] + d*gauss(0.9,0.5), 18, 99);
    }
    for(const k of keys) p.r[k] = Math.round(p.r[k]);
    // 年轻球员：身高/体重自然增长
    if(age<=22 && Math.random()<0.18){ p.h = clamp(p.h+1, 69, 91); p.wt+=3+ri(5); }
    if(age>=32){ const dec = ri(2); if(dec) p.r.spd=clamp(p.r.spd-1,18,99); }
    p.ovr = calcOvr(p);
    p.pot = Math.max(p.pot, p.ovr);
    // 潜力随年龄衰减
    const potDecay = age<=22?0 : age<=25? ri(2): age<=28? ri(3): ri(5);
    p.pot = clamp(p.pot - potDecay, p.ovr, 99);
  }
  p.age++;
  p.exp = (p.exp||0)+1;
  if(p.injured) p.injured = null;
  // 存档本赛季数据
  if(p.st && p.st.g>0){
    p.log.push({y:L.year, t:p.tid, g:p.st.g, pts:pg(p,'pts'), reb:pg(p,'reb'), ast:pg(p,'ast'),
      stl:pg(p,'stl'), blk:pg(p,'blk'), min:pg(p,'min'), fgp: p.st.fga? (p.st.fgm/p.st.fga*100):0,
      tpp: p.st.tpa? (p.st.tpm/p.st.tpa*100):0, ovr:p.ovr});
    if(p.log.length>16) p.log.shift();
  }
  p.st = newLine(); p.st.g=0; p.st.gs=0; p.st.sec=0;
  p.st.dd10 = 0;
  return d;
}
function retirement(L){
  const out = [];
  for(const p of L.players){
    if(p.tid<0 && p.ovr<58 && p.age>=30) { out.push(p); continue; }
    if(p.age>=35 && p.ovr<62) { out.push(p); continue; }
    if(p.age>=38 && Math.random()<0.6) { out.push(p); continue; }
    if(p.age>=36 && Math.random()<0.35) { out.push(p); continue; }
    if(p.age>=33 && p.ovr<55) { out.push(p); continue; }
  }
  out.forEach(p=>{
    p.retired = true; p.retireYear = L.year;
    if(p.tid>=0){ const t=L.teams[p.tid]; const i=t.roster.indexOf(p.id); if(i>=0) t.roster.splice(i,1); }
  });
  L.players = L.players.filter(p=> !p.retired);
  L.byId = {}; L.players.forEach(p=> L.byId[p.id]=p);
  return out;
}

/* ---------- 交易 ---------- */
function playerValue(L, p, forTid){
  let v = Math.pow(Math.max(4, p.ovr-40), 2.05);
  if(p.pot>p.ovr) v += (p.pot-p.ovr)*Math.max(4,p.ovr-42)*0.55;
  const ageF = p.age<=21?1.32 : p.age<=24?1.22 : p.age<=27?1.06 : p.age<=30?0.94 : p.age<=33?0.74 : 0.5;
  v *= ageF;
  // 合同性价比
  const fair = salaryOf(p.ovr, p.age, p.pot);
  const ratio = p.salary/Math.max(1,fair);
  if(ratio>1.5) v*=0.62; else if(ratio>1.2) v*=0.85; else if(ratio<0.7) v*=1.18;
  if(p.yrs<=1) v *= 0.90;
  if(p.injured) v *= 0.88;
  return Math.round(v);
}
function pickValue(L, tid, yr, rd){
  const t = L.teams[tid];
  const base = rd===1? 260: 90;
  const strength = 1 + (74 - winPct(t)*60)/100;
  const dist = 1 + (yr - L.year)*0.06;
  return Math.round(base*strength*dist);
}
function evaluateTrade(L, offer, receive){
  let ov=0, rv=0;
  offer.players.forEach(id=>{ const p=L.byId[id]; if(p) ov += playerValue(L,p,offer.tid); });
  receive.players.forEach(id=>{ const p=L.byId[id]; if(p) rv += playerValue(L,p,receive.tid); });
  offer.picks.forEach(pk=> ov += pickValue(L, pk.tid, pk.yr, pk.rd));
  receive.picks.forEach(pk=> rv += pickValue(L, pk.tid, pk.yr, pk.rd));
  const A = L.teams[offer.tid], B = L.teams[receive.tid];
  const roomA = capSpace(L,A), roomB = capSpace(L,B);
  const salOutA = offer.players.reduce((a,id)=> a + (L.byId[id]? L.byId[id].salary:0), 0);
  const salOutB = receive.players.reduce((a,id)=> a + (L.byId[id]? L.byId[id].salary:0), 0);
  // 薪资匹配规则（简化：150% + 10万）
  const limitB = salOutB*1.5 + 10;
  const limitA = salOutA*1.5 + 10;
  let capOk = true, capMsg = "";
  if(salOutA > limitB + Math.max(0,roomB)) { capOk=false; capMsg = B.abbr+" 无法匹配薪资"; }
  if(salOutB > limitA + Math.max(0,roomA)) { capOk=false; capMsg = A.abbr+" 无法匹配薪资"; }
  if(A.roster.length - offer.players.length + receive.players.length > ROSTER_MAX) capOk=false;
  if(B.roster.length - receive.players.length + offer.players.length > ROSTER_MAX) capOk=false;
  if(B.roster.length - receive.players.length + offer.players.length < ROSTER_MIN) capOk=false;
  if(A.roster.length - offer.players.length + receive.players.length < ROSTER_MIN) capOk=false;
  const factor = B.prestige/ Math.max(1,A.prestige);
  const need = rv*1.02 - ov;
  return {valueA:ov, valueB:rv, ok: capOk && need<=0, capOk:capOk, capMsg:capMsg,
    verdict: !capOk? "规则不通过" : need> rv*0.35? "无讨论价值" : need>0? "略亏，可以谈" : need> -rv*0.15? "基本公平" : "很有吸引力",
    diff: Math.round((ov - rv))};
}
function execTrade(L, offer, receive){
  const A = L.teams[offer.tid], B = L.teams[receive.tid];
  offer.players.forEach(id=>{
    const p = L.byId[id];
    const i = A.roster.indexOf(id); if(i>=0) A.roster.splice(i,1);
    p.tid = B.id; B.roster.push(id);
  });
  receive.players.forEach(id=>{
    const p = L.byId[id];
    const i = B.roster.indexOf(id); if(i>=0) B.roster.splice(i,1);
    p.tid = A.id; A.roster.push(id);
  });
  // 选秀权交换
  const swap = (from, to, picks)=>{
    (picks||[]).forEach(pk=>{
      from.picks = from.picks||[]; to.picks = to.picks||[];
      const i = from.picks.findIndex(x=> x.yr===pk.yr && x.rd===pk.rd);
      if(i>=0){ const x = from.picks.splice(i,1)[0]; to.picks.push(x); }
    });
  };
  swap(A, B, offer.picks);
  swap(B, A, receive.picks);
  A.payroll = payrollOf(L,A); B.payroll = payrollOf(L,B);
  A.lineup = autoLineup(L,A); B.lineup = autoLineup(L,B);
  L.tradeLog.unshift({y:L.year, d:L.day, a:A.id, b:B.id,
    aGet: receive.players.slice(), bGet: offer.players.slice()});
  addNews(L, "【交易】"+A.name+" 与 "+B.name+" 达成交易："+A.abbr+"送出 "
    + offer.players.map(id=>L.byId[id].name).join("、") + "，得到 "
    + receive.players.map(id=>L.byId[id].name).join("、") + "。", "trade");
}

/* ---------- 新赛季 ---------- */
function nextSeason(L){
  const champTid = L.champ;
  // 成长与退役
  const log = [];
  L.players.forEach(p=>{ if(p.tid>=0) developPlayer(L,p); });
  const ret = retirement(L);
  L.seasonLog = {champ:champTid, awards:L.awards};
  L.history.push({year:L.year, champ:champTid,
    mvp: L.awards&&L.awards.mvp? {n:L.awards.mvp.name, tid:L.awards.mvp.tid}:null,
    record: L.teams.map(t=>t.w+"-"+t.l)});
  L.year++;
  L.phase = "preseason";
  L.day = 0; L.awards = null; L.allStarDone=false; L.draftDone=false; L.champ=null;
  L.teams.forEach(t=>{
    t.w=0;t.l=0;t.dw=0;t.dl=0;t.cw=0;t.cl=0;t.ptsF=0;t.ptsA=0;t.gp=0;
    t.playoff=false;t.seed=0;t.last10=[];t.streak=0;
    t.coach.rating = clamp(t.coach.rating + ri(5)-2, 30, 95);
    t.coach.off = clamp(t.coach.off + ri(5)-2, 30, 95);
    t.coach.def = clamp(t.coach.def + ri(5)-2, 30, 95);
  });
  L.players.forEach(p=>{ p.st=newLine(); p.st.g=0; p.st.gs=0; p.st.sec=0; p.st.dd10=0; });
  // 选秀已完成 → 进入自由市场
  L.draftClass = null;
  L.draftState = null;
  makeFA(L);
  aiFreeAgency(L);
  const s = scheduleSeason(L.year);
  L.sched = s.days; L.schedLeft = s.left;
  L.teams.forEach(t=>{ t.lineup = autoLineup(L,t); t.payroll = payrollOf(L,t); });
  enforceCap(L);
  L.phase = "regular";
  addNews(L, "【新赛季】"+(L.year)+"-"+((L.year+1)%100)+" 赛季常规赛开打！", "news");
  return log;
}

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._tm); t._tm = setTimeout(()=> t.classList.remove("show"), 1900);
}
function openModal(title, body, foot, cls){
  $("mtitle").innerHTML = title;
  $("mbody").innerHTML = body;
  $("mfoot").innerHTML = foot||"";
  $("mfoot").style.display = foot? "flex":"none";
  $("modal").classList.add("show");
}
function closeModal(){ $("modal").classList.remove("show"); }
function dateStr(L){
  const start = Date.UTC(L.year, 9, 21);
  const d = new Date(start + L.day*86400000);
  return (d.getUTCMonth()+1)+"月"+d.getUTCDate()+"日";
}
function seasonLabel(L){ return L.year+"-"+String((L.year+1)%100).padStart(2,"0"); }
function myTeam(){ return S.L.teams[S.L.myTid]; }
function ovrColor(v){ return v>=85?"#4ade80":v>=78?"#a3e635":v>=70?"#fbbf24":v>=62?"#fb923c":"#f87171"; }

/* ---------- 顶部栏 ---------- */
function renderTopBase(){
  const L = S.L, t = myTeam();
  const ng = nextUserGame(L);
  let sub = dateStr(L);
  if(L.phase==="regular") sub = seasonLabel(L)+" · "+dateStr(L);
  else if(L.phase==="playoffs") sub = "季后赛 · 第"+L.po.round+"轮";
  else if(L.phase==="draft") sub = "选秀大会";
  else if(L.phase==="preseason") sub = "休赛期";
  let html = '<div class="chip a" style="padding:5px 10px"><b style="font-size:13px">'+esc(t.abbr)+'</b><span>'+t.w+"胜"+t.l+"负</span></div>";
  html += '<div class="tt"><b>'+esc(t.name)+'</b><span>'+sub+'</span></div><div class="sp"></div>';
  if(ng && L.phase==="regular"){
    const opp = L.teams[ng.g.h===t.id? ng.g.a : ng.g.h];
    html += '<div class="chip"><b>'+(ng.g.h===t.id?"主":"客")+' '+esc(opp.abbr)+'</b><span>'+dateStr({year:L.year,day:ng.d})+'</span></div>';
  }
  html += '<div class="chip g"><b>'+fmtM(capSpace(L,t))+'</b><span>空间</span></div>';
  html += '<button class="btn pri sm" data-act="simGo">▶ 推进</button>';
  $("top").innerHTML = html;
}
function renderNav(){
  const cur = S.screen;
  const isTab = TABS.some(x=>x[0]===cur);
  $("navpc").innerHTML = NAV.map(n=>
    '<div class="navitem'+(cur===n[0]?" on":"")+'" data-act="nav" data-v="'+n[0]+'">'+
    '<span class="ic">'+n[1]+'</span>'+n[2]+'</div>').join("");
  $("tabs").innerHTML = TABS.map(n=>
    '<button class="'+(cur===n[0]||(n[0]==="more"&&!isTab)?"on":"")+'" data-act="nav" data-v="'+n[0]+'">'+
    '<span class="ic">'+n[1]+'</span>'+n[2]+'</button>').join("");
  const t = myTeam();
  $("sidefoot").innerHTML = "战绩 "+t.w+"-"+t.l+"<br>薪资 "+fmtM(t.payroll)+" / 帽 "+fmtM(capOf(S.L))+"<br>赛季 "+seasonLabel(S.L);
}
function go(screen){
  if(screen==="more"){ openMore(); return; }
  if(typeof closeModal === "function") closeModal();
  S.screen = screen;
  render();
  $("main").scrollTop = 0;
}
function openMore(){
  const isTab = TABS.some(x=>x[0]===S.screen);
  const rest = NAV.filter(n=> !TABS.some(x=>x[0]===n[0]));
  openModal("全部功能", '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">'+
    rest.map(n=>'<button class="btn" style="flex-direction:column;padding:14px 4px;gap:5px" data-act="nav" data-v="'+n[0]+'">'+
    '<span style="font-size:19px">'+n[1]+'</span><span style="font-size:11.5px">'+n[2]+'</span></button>').join("")+
    '</div>');
}

/* ---------- 通用渲染 ---------- */
function renderBase(){
  renderTop(); renderNav();
  const f = {dash:renderDash, roster:renderRoster, schedule:renderSchedule, league:renderLeague,
    stats:renderStats, trade:renderTrade, fa:renderFA, draft:renderDraft, finance:renderFinance,
    history:renderHistory, save:renderSave}[S.screen] || renderDash;
  $("main").innerHTML = f();
}

/* ---------- 主页 ---------- */
function renderDash(){
  const L = S.L, t = myTeam();
  const ng = nextUserGame(L);
  let h = "";
  // 战绩条
  h += '<div class="card"><div class="bd" style="padding:12px">';
  h += '<div class="row" style="align-items:flex-start;gap:14px">';
  h += '<div style="flex:1"><div style="font-size:11px;color:var(--dim2)">常规赛战绩</div>'+
       '<div style="font-size:26px;font-weight:800;font-variant-numeric:tabular-nums">'+t.w+'<span class="mut">-</span>'+t.l+'</div>'+
       '<div style="font-size:11px;color:var(--dim2)">胜率 '+(winPct(t)*100).toFixed(1)+'% · 联盟第 '+leagueRank(L,t.id)+'</div></div>';
  const l10 = t.last10.reduce((a,b)=>a+b,0);
  h += '<div style="text-align:right"><div style="font-size:11px;color:var(--dim2)">近10场</div>'+
       '<div style="font-size:26px;font-weight:800">'+l10+'<span class="mut">-</span>'+(t.last10.length-l10)+'</div>'+
       '<div style="font-size:11px;color:var(--dim2)">'+esc(t.div)+'第 '+divRank(L,t)+'</div></div>';
  h += '</div>';
  h += '<div class="row" style="margin-top:10px;gap:6px">';
  h += '<button class="btn sm" data-act="simDay">模拟1天</button>';
  h += '<button class="btn sm" data-act="simNext">下一场</button>';
  h += '<button class="btn sm" data-act="simWeek">1周</button>';
  h += '<button class="btn sm pri" data-act="simMonth">到赛季末</button>';
  h += '</div></div></div>';

  // 下一场比赛
  h += '<div class="card"><div class="hd"><b>下一场比赛</b><div class="sp" style="flex:1"></div><span class="sub">'+
       (ng? dateStr({year:L.year, day:ng.d}) : "赛季已结束")+'</span></div><div class="bd">';
  if(ng){
    const g = ng.g, isHome = g.h===t.id;
    const opp = L.teams[isHome? g.a : g.h];
    h += '<div class="row" style="justify-content:space-around;text-align:center">';
    h += teamBlock(t,"主"===("x")?"":"");
    h += '<div style="font-size:12px;color:var(--dim2)">VS<br><span class="tag '+(isHome?"g":"b")+'">'+(isHome?"主场":"客场")+'</span></div>';
    h += teamBlock(opp,"");
    h += '</div>';
    h += '<div class="row" style="margin-top:12px"><button class="btn pri" style="flex:1" data-act="playGame">开始比赛</button>'+
         '<button class="btn" style="flex:1" data-act="simDay">模拟此日</button></div>';
    h += '<div style="margin-top:9px;font-size:11.5px;color:var(--dim2);text-align:center">对手战绩 '+opp.w+"-"+opp.l+" · 实力 "+Math.round(teamRating(L,opp))+'</div>';
  } else {
    if(L.phase==="draft") h += '<div style="text-align:center;padding:8px">选秀大会即将开始<br><button class="btn pri" style="margin-top:9px" data-act="nav" data-v="draft">进入选秀</button></div>';
    else h += '<div class="empty">常规赛已全部结束</div>';
  }
  h += '</div></div>';

  h += '<div class="grid2">';
  // 阵容速览
  h += '<div class="card"><div class="hd"><b>主力阵容</b><div class="sp" style="flex:1"></div><span class="sub" data-act="nav" data-v="roster" style="cursor:pointer">全部 ›</span></div><div class="bd tight">';
  const rs = sortedRoster(L,t).slice(0,6);
  rs.forEach(p=> h += playerRow(L,p,{sub:pgLine(p)}));
  h += '</div></div>';
  // 排名
  h += '<div class="card"><div class="hd"><b>'+esc(t.conf==="E"?"东部":"西部")+'排名</b></div><div class="bd tight scrollx">';
  const st = standings(L, t.conf);
  h += '<table class="tbl"><thead><tr><th>#</th><th style="text-align:left">球队</th><th>胜</th><th>负</th><th>胜率</th></tr></thead><tbody>';
  st.slice(0,10).forEach((x,i)=>{
    h += '<tr class="'+(x.id===t.id?"mine":"")+' tapable" data-act="teamInfo" data-v="'+x.id+'"><td>'+(i+1)+'</td>'+
      '<td class="nm" style="text-align:left">'+esc(x.name)+'</td><td>'+x.w+'</td><td>'+x.l+'</td><td>'+(winPct(x)*100).toFixed(1)+'</td></tr>';
  });
  h += '</tbody></table></div></div>';
  // 新闻
  h += '<div class="card"><div class="hd"><b>联盟动态</b></div><div class="bd tight">';
  if(!L.news.length) h += '<div class="empty">暂无新闻</div>';
  L.news.slice(0,8).forEach(n=>{
    h += '<div style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.05);font-size:12.5px">'+
      '<span class="tag '+({champ:"y",award:"p",trade:"b",inj:"r",fa:"g"}[n.tag]||"")+'">'+({champ:"冠军",award:"奖项",trade:"交易",inj:"伤病",fa:"签约",news:"动态"}[n.tag]||"动态")+'</span> '+
      esc(n.t)+'</div>';
  });
  h += '</div></div>';
  // 数据领跑
  h += '<div class="card"><div class="hd"><b>球队数据领跑</b></div><div class="bd tight">';
  const lead = ["pts","reb","ast","stl","blk"].map(k=>{
    const best = rosterOf(L,t).filter(p=>p.st&&p.st.g>0).sort((a,b)=> pg(b,k)-pg(a,k))[0];
    const nm = {pts:"得分",reb:"篮板",ast:"助攻",stl:"抢断",blk:"盖帽"}[k];
    return best? {k:nm, p:best, v:pg(best,k)} : null;
  }).filter(Boolean);
  lead.forEach(x=>{
    h += '<div class="pl"><div class="pos '+x.p.pos+'">'+x.p.pos+'</div><div class="info"><b>'+esc(x.p.name)+'</b><span>'+x.k+'</span></div>'+
      '<div style="font-weight:800;font-size:15px">'+x.v.toFixed(1)+'</div></div>';
  });
  if(!lead.length) h += '<div class="empty">尚无比赛数据</div>';
  h += '</div></div>';
  h += '</div>';
  return h;
}
function teamBlock(t, extra){
  return '<div style="flex:1"><div style="width:52px;height:52px;margin:0 auto;border-radius:12px;background:'+t.c1+
    ';display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#fff;border:2px solid '+t.c2+'">'+
    esc(t.abbr)+'</div><div style="margin-top:6px;font-size:12.5px;font-weight:600">'+esc(t.name)+'</div>'+
    '<div style="font-size:11px;color:var(--dim2)">'+t.w+'-'+t.l+'</div></div>';
}
function rosterOfBase(L,t){ return t.roster.map(id=>L.byId[id]).filter(Boolean); }
function divRank(L, t){
  const d = divStandings(L, t.div);
  return d.findIndex(x=>x.id===t.id)+1;
}
function playerRow(L, p, opt){
  opt = opt || {};
  const t = L.teams[p.tid];
  let sub = opt.sub!==undefined? opt.sub : (p.pos+" · "+p.age+"岁"+(p.injured? ' · <span style="color:#f87171">伤停'+p.injured.d+'天</span>':''));
  return '<div class="pl tapable" data-act="player" data-v="'+p.id+'">'+
    '<div class="pos '+p.pos+'">'+p.pos+'</div>'+
    '<div class="info"><b>'+esc(p.name)+(p.injured?' <span style="color:#f87171">✚</span>':'')+'</b><span>'+sub+'</span></div>'+
    '<div class="ovr '+ovClass(p.ovr)+'"><b>'+p.ovr+'</b><span>POT '+p.pot+'</span></div></div>';
}
function pgLine(p){
  if(!p.st || !p.st.g) return p.pos+" · 本季未出场";
  return pg(p,'pts').toFixed(1)+"分 "+pg(p,'reb').toFixed(1)+"板 "+pg(p,'ast').toFixed(1)+"助";
}
function pgv(p,k){ return pg(p,k); }
function pgBase(p,k){ if(!p.st || !p.st.g) return 0; return (p.st[k]||0)/p.st.g; }

/* ---------- 阵容 ---------- */
function renderRoster(){
  const L = S.L, t = myTeam();
  let h = '<div class="card"><div class="hd"><b>球队名单</b><div class="sp" style="flex:1"></div>'+
    '<span class="sub">'+rosterOf(L,t).length+'/15 人 · 薪资 '+fmtM(t.payroll)+'</span></div><div class="bd tight">';
  const rs = sortedRoster(L,t);
  rs.forEach(p=>{
    const st = (t.lineup.starters.indexOf(p.id)>=0)?"<span class='tag o'>先发</span> ":"";
    const mm = t.lineup.minutes[p.id];
    h += '<div class="pl tapable" data-act="player" data-v="'+p.id+'">'+
      '<div class="pos '+p.pos+'">'+p.pos+'</div>'+
      '<div class="info"><b>'+st+esc(p.name)+(p.injured?' <span style="color:#f87171">✚</span>':'')+'</b>'+
      '<span>'+p.age+'岁 · '+inch2str(p.h)+' · '+fmtM(p.salary)+' · '+(p.yrs||0)+'年'+(mm?" · "+mm+"分钟":"")+'</span></div>'+
      '<div class="ovr '+ovClass(p.ovr)+'"><b>'+p.ovr+'</b><span>POT '+p.pot+'</span></div></div>';
  });
  h += '</div></div>';
  h += '<div class="row" style="gap:8px;margin-bottom:10px">'+
    '<button class="btn pri" style="flex:1" data-act="editLineup">编辑轮换</button>'+
    '<button class="btn" style="flex:1" data-act="autoLineup">自动排阵</button></div>';
  // 数据表
  h += '<div class="card"><div class="hd"><b>球员赛季数据</b></div><div class="bd tight scrollx">';
  h += '<table class="tbl"><thead><tr><th style="text-align:left">球员</th><th>场</th><th>时间</th><th>得分</th><th>篮板</th><th>助攻</th><th>命中%</th><th>三分%</th></tr></thead><tbody>';
  rs.forEach(p=>{
    const fgp = p.st&&p.st.fga? (p.st.fgm/p.st.fga*100).toFixed(1):"—";
    const tpp = p.st&&p.st.tpa? (p.st.tpm/p.st.tpa*100).toFixed(1):"—";
    h += '<tr class="tapable" data-act="player" data-v="'+p.id+'"><td class="nm" style="text-align:left">'+esc(p.name)+'</td>'+
      '<td>'+((p.st&&p.st.g)||0)+'</td><td>'+pg(p,'min').toFixed(1)+'</td><td>'+pg(p,'pts').toFixed(1)+'</td>'+
      '<td>'+pg(p,'reb').toFixed(1)+'</td><td>'+pg(p,'ast').toFixed(1)+'</td><td>'+fgp+'</td><td>'+tpp+'</td></tr>';
  });
  h += '</tbody></table></div></div>';
  h += renderStratCard(L,t);
  return h;
}
function renderStratCard(L,t){
  let h = '<div class="card"><div class="hd"><b>战术与教练</b></div><div class="bd">';
  const st = t.strat;
  h += '<div class="kv"><span class="k">主教练</span><span class="v">'+esc(t.coach.name)+'</span></div>';
  h += '<div class="kv"><span class="k">教练评分</span><span class="v">'+t.coach.rating+'（进攻 '+t.coach.off+' / 防守 '+t.coach.def+'）</span></div>';
  h += '<div style="margin-top:9px"><div style="font-size:11px;color:var(--dim2);margin-bottom:5px">进攻体系</div>'+
    '<div class="seg" data-seg="off">'+["阵地","均衡","快节奏"].map(x=>'<button class="'+(st.off===x?"on":"")+'" data-act="strat" data-k="off" data-v="'+x+'">'+x+'</button>').join("")+'</div></div>';
  h += '<div style="margin-top:9px"><div style="font-size:11px;color:var(--dim2);margin-bottom:5px">防守体系</div>'+
    '<div class="seg">'+["收缩","均衡","换防"].map(x=>'<button class="'+(st.def===x?"on":"")+'" data-act="strat" data-k="def" data-v="'+x+'">'+x+'</button>').join("")+'</div></div>';
  h += '<div class="gen" style="margin-top:12px"><div class="genrow"><span class="lb">战术速度</span>'+
    '<input type="range" min="0" max="2" step="1" value="'+st.tempo+'" data-act="stratRange" data-k="tempo"><span class="vl">'+["慢","中","快"][st.tempo]+'</span></div>'+
    '<div class="genrow"><span class="lb">球星战术</span>'+
    '<input type="range" min="0" max="2" step="1" value="'+st.star+'" data-act="stratRange" data-k="star"><span class="vl">'+["团队","均衡","单打"][st.star]+'</span></div></div>';
  h += '</div></div>';
  return h;
}
function renderLineupModal(){
  const L = S.L, t = myTeam();
  const rs = sortedRoster(L,t);
  const starters = t.lineup.starters.slice();
  const mins = t.lineup.minutes;
  let used = 0; rs.forEach(p=> used += (mins[p.id]||0));
  let h = '<div style="font-size:11.5px;color:var(--dim2);margin-bottom:9px">选择 5 名先发并分配出场时间（总时长 '+used+'/240 分钟）</div>';
  h += '<div style="display:grid;grid-template-columns:1fr;gap:6px">';
  rs.forEach(p=>{
    const isS = starters.indexOf(p.id)>=0;
    h += '<div class="row" style="background:rgba(255,255,255,.045);border-radius:9px;padding:7px 9px;gap:8px">'+
      '<div class="pos '+p.pos+'">'+p.pos+'</div>'+
      '<div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(p.name)+'</div>'+
      '<div style="font-size:10.5px;color:var(--dim2)">评分 '+p.ovr+' · 潜力 '+p.pot+'</div></div>'+
      '<button class="btn sm '+(isS?"pri":"")+'" data-act="toggleStart" data-v="'+p.id+'">'+(isS?"先发":"替补")+'</button>'+
      '<input type="range" min="0" max="40" step="1" value="'+(mins[p.id]||0)+'" style="width:88px" data-act="minRange" data-v="'+p.id+'">'+
      '<span style="width:22px;text-align:right;font-size:11.5px;font-variant-numeric:tabular-nums">'+(mins[p.id]||0)+'</span></div>';
  });
  h += '</div>';
  const foot = '<button class="btn" data-act="autoLineup">自动排阵</button><button class="btn pri" data-act="lineupDone">完成</button>';
  openModal("编辑轮换", h, foot);
}

/* ---------- 球员详情 ---------- */

    (p.exp<=1?'<span class="tag b">新秀</span> ':'')+'</div></div>';

  h += '<div style="text-align:center"><div style="font-size:30px;font-weight:900;color:var(--purple)">'+p.pot+'</div>'+
    '<div style="font-size:10px;color:var(--dim2)">潜力</div></div>';
  h += '</div>';
  // 属性
  h += '<div style="margin-top:12px;font-size:12px;font-weight:700;color:var(--acc2)">能力属性</div><div style="margin-top:5px">';
  ATTRS.forEach(a=>{
    const v = p.r[a[0]];
    h += '<div class="attr"><span class="an">'+a[1]+'</span><div class="ab"><div class="bar '+(v>=80?"g":v>=65?"":"r")+'"><i style="width:'+v+'%"></i></div></div>'+
      '<span class="av" style="color:'+ovrColor(v)+'">'+v+'</span></div>';
  });
  h += '</div>';
  // 合同
  h += '<div style="margin-top:12px;font-size:12px;font-weight:700;color:var(--acc2)">合同</div>';

  h += '<div class="kv"><span class="k">剩余年限</span><span class="v">'+(p.yrs||0)+' 年</span></div>';
  h += '<div class="kv"><span class="k">市场价值</span><span class="v">'+fmtM(salaryOf(p.ovr,p.age,p.pot))+'</span></div>';
  // 本赛季
  h += '<div style="margin-top:12px;font-size:12px;font-weight:700;color:var(--acc2)">本赛季数据</div>';
  if(p.st && p.st.g){
    const g = p.st.g;
    h += '<div class="scrollx"><table class="tbl"><thead><tr><th>场</th><th>时间</th><th>得分</th><th>篮板</th><th>助攻</th><th>抢断</th><th>盖帽</th><th>失误</th><th>FG%</th><th>3P%</th><th>FT%</th></tr></thead><tbody><tr>'+
      '<td>'+g+'</td><td>'+(p.st.sec/60/g).toFixed(1)+'</td><td>'+(p.st.pts/g).toFixed(1)+'</td><td>'+(p.st.reb/g).toFixed(1)+'</td>'+
      '<td>'+(p.st.ast/g).toFixed(1)+'</td><td>'+(p.st.stl/g).toFixed(1)+'</td><td>'+(p.st.blk/g).toFixed(1)+'</td><td>'+(p.st.to/g).toFixed(1)+'</td>'+
      '<td>'+(p.st.fga? (p.st.fgm/p.st.fga*100).toFixed(1):"—")+'</td><td>'+(p.st.tpa? (p.st.tpm/p.st.tpa*100).toFixed(1):"—")+'</td>'+
      '<td>'+(p.st.fta? (p.st.ftm/p.st.fta*100).toFixed(1):"—")+'</td></tr></tbody></table></div>';
  } else h += '<div class="empty" style="padding:10px">本赛季暂无出场数据</div>';
  // 生涯
  if(p.log && p.log.length){
    h += '<div style="margin-top:12px;font-size:12px;font-weight:700;color:var(--acc2)">生涯数据</div>';
    h += '<div class="scrollx"><table class="tbl"><thead><tr><th>赛季</th><th>球队</th><th>场</th><th>时间</th><th>得分</th><th>篮板</th><th>助攻</th></tr></thead><tbody>';
    p.log.slice().reverse().forEach(l=>{
      h += '<tr><td>'+(l.y-1)+'-'+String(l.y%100).padStart(2,"0")+'</td><td>'+esc(L.teams[l.t]? L.teams[l.t].abbr:"FA")+'</td>'+
        '<td>'+l.g+'</td><td>'+l.min.toFixed(1)+'</td><td>'+l.pts.toFixed(1)+'</td><td>'+l.reb.toFixed(1)+'</td><td>'+l.ast.toFixed(1)+'</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  // 荣誉
  if(p.awards && p.awards.length){
    h += '<div style="margin-top:12px;font-size:12px;font-weight:700;color:var(--acc2)">荣誉</div><div style="margin-top:5px">';
    const nm = {mvp:"常规赛MVP",dpoy:"最佳防守",roy:"最佳新秀",mip:"最快进步",sixth:"最佳第六人",allstar:"全明星",allnba:"最佳阵容",fmvp:"总决赛MVP"};
    p.awards.slice().reverse().slice(0,14).forEach(a=>{
      h += '<span class="tag y" style="margin:2px 3px 2px 0">'+(a.y-1)+'-'+String(a.y%100).padStart(2,"0")+' '+nm[a.t]+'</span>';
    });
    h += '</div>';
  }
  // 操作
  let foot = "";
  const mine = p.tid === L.myTid;
  if(mine){
    const isS = t.lineup.starters.indexOf(p.id)>=0;
    foot += '<button class="btn" data-act="toggleStart" data-v="'+p.id+'">'+(isS?"移出先发":"设为先发")+'</button>';
    if(L.phase==="regular"||L.phase==="preseason") foot += '<button class="btn" data-act="tradeFor" data-v="'+p.id+'">放入交易</button>';
    foot += '<button class="btn pri" data-act="close">关闭</button>';
  } else {
    if(L.phase==="regular"||L.phase==="preseason") foot += '<button class="btn pri" data-act="tradeFor" data-v="'+p.id+'">发起交易</button>';
    foot += '<button class="btn" data-act="close">关闭</button>';
  }
  openModal("球员资料", h, foot);
}

/* ---------- 赛程 ---------- */
function renderSchedule(){
  const L = S.L, t = myTeam();
  if(L.phase==="playoffs" || (L.phase==="draft" && L.po)) return renderPlayoffs();
  let h = "";
  h += '<div class="card"><div class="hd"><b>常规赛赛程</b><div class="sp" style="flex:1"></div><span class="sub">'+
    (L.phase==="regular"? dateStr(L):"赛季结束")+' · 第 '+Math.min(L.day+1, L.sched.length)+'/'+L.sched.length+' 天</span></div><div class="bd">';
  h += '<div class="row" style="gap:6px;flex-wrap:wrap">'+
    '<button class="btn sm" data-act="simDay">模拟1天</button>'+
    '<button class="btn sm" data-act="simNext">到我的下一场</button>'+
    '<button class="btn sm" data-act="simWeek">模拟1周</button>'+
    '<button class="btn sm pri" data-act="simSeason">模拟到赛季末</button></div></div></div>';

  h += '<div class="card"><div class="hd"><b>我的比赛</b><div class="sp" style="flex:1"></div>'+
    '<span class="sub">'+t.w+'胜'+t.l+'负</span></div><div class="bd tight">';
  const mine = [];
  for(let d=0; d<L.sched.length; d++){
    for(const g of L.sched[d]) if(g.h===t.id||g.a===t.id) mine.push({g:g, d:d});
  }
  let shown = mine.filter(x=> x.g.done).slice(-8).reverse();
  const upcoming = mine.filter(x=> !x.g.done).slice(0,6);
  if(shown.length){
    shown.forEach(x=> h += gameRow(L, x.g, x.d, true));
  } else h += '<div class="empty">暂无已完成比赛</div>';
  if(upcoming.length){
    h += '<div style="padding:8px 12px;font-size:11px;color:var(--dim2);background:rgba(255,255,255,.02)">即将进行</div>';
    upcoming.forEach(x=> h += gameRow(L, x.g, x.d, false));
  }
  h += '</div></div>';

  h += '<div class="card"><div class="hd"><b>全联盟近况</b><div class="sp" style="flex:1"></div>'+
    '<span class="sub">今日与近日赛果</span></div><div class="bd tight">';
  let cnt=0;
  for(let d=Math.max(0,L.day-4); d<Math.min(L.day+1,L.sched.length) && cnt<40; d++){
    const day = L.sched[d];
    const done = day.filter(g=>g.done);
    if(!done.length) continue;
    h += '<div style="padding:6px 12px;font-size:10.5px;color:var(--dim2);background:rgba(255,255,255,.02)">'+dateStr({year:L.year,day:d})+'</div>';
    done.forEach(g=>{ h += gameRow(L, g, d, false); cnt++; });
  }
  if(!cnt) h += '<div class="empty">暂无比赛结果</div>';
  h += '</div></div>';
  return h;
}
function gameRow(L, g, d, big){
  const H = L.teams[g.h], A = L.teams[g.a];
  const mine = (g.h===L.myTid||g.a===L.myTid);
  if(!g.done){
    return '<div class="sc'+(mine?" mine":"")+'"'+(mine?' data-act="playGame" style="cursor:pointer"':'')+'>'+
      '<div class="tm"><span class="dot" style="background:'+H.c1+'"></span><span>'+esc(H.abbr)+'</span>'+
      '<span class="mut">vs</span><span class="dot" style="background:'+A.c1+'"></span><span>'+esc(A.abbr)+'</span></div>'+
      '<div class="num mut" style="width:auto;font-size:11px">'+dateStr({year:L.year,day:d})+'</div></div>';
  }
  const hw = g.hs>g.as;
  return '<div class="sc tapable'+(mine?" mine":"")+'" data-act="gameres" data-v="'+d+'_'+g.h+'_'+g.a+'">'+
    '<div class="tm"><span class="dot" style="background:'+H.c1+'"></span><span>'+esc(H.abbr)+'</span>'+
    '<span class="mut" style="font-size:10px">'+(L.phase==="playoffs"?"季":"")+'</span>'+
    '<span class="dot" style="background:'+A.c1+'"></span><span>'+esc(A.abbr)+'</span></div>'+
    '<div class="num '+(hw?"w":"l")+'">'+g.hs+'</div><div class="num '+(hw?"l":"w")+'">'+g.as+'</div></div>';
}

        '<div style="font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums">'+x.w+'-'+x.l+'</div></div>';
