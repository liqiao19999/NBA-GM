/* ---------- 数据榜 ---------- */
function renderStats(){
  const L = S.L;
  const cats = [["pts","得分"],["reb","篮板"],["ast","助攻"],["stl","抢断"],["blk","盖帽"],["tpm","三分命中"]];
  let h = "";
  const pool = L.players.filter(p=> p.st && p.st.g>=Math.max(3, Math.round(L.day/3)));
  if(!pool.length) return '<div class="card"><div class="empty">赛季尚未开始，暂无数据</div></div>';
  h += '<div class="grid2">';
  cats.forEach(c=>{
    const arr = pool.slice().sort((a,b)=> pg(b,c[0])-pg(a,c[0])).slice(0,10);
    h += '<div class="card"><div class="hd"><b>'+c[1]+'榜</b></div><div class="bd tight scrollx">';
    h += '<table class="tbl"><thead><tr><th>#</th><th style="text-align:left">球员</th><th>球队</th><th>场</th><th>'+c[1]+'</th></tr></thead><tbody>';
    arr.forEach((p,i)=>{
      h += '<tr class="tapable'+(p.tid===L.myTid?" mine":"")+'" data-act="player" data-v="'+p.id+'">'+
        '<td>'+(i+1)+'</td><td class="nm" style="text-align:left">'+esc(p.name)+'</td>'+
        '<td>'+esc(L.teams[p.tid]? L.teams[p.tid].abbr:"FA")+'</td><td>'+p.st.g+'</td>'+
        '<td><b>'+pg(p,c[0]).toFixed(c[0]==="tpm"?1:1)+'</b></td></tr>';
    });
    h += '</tbody></table></div></div>';
  });
  h += '</div>';
  // 效率榜
  const eff = pool.slice().sort((a,b)=> impact(L,b)-impact(L,a)).slice(0,15);
  h += '<div class="card"><div class="hd"><b>综合效率榜</b><div class="sp" style="flex:1"></div><span class="sub">含战绩加权</span></div><div class="bd tight scrollx">';
  h += '<table class="tbl"><thead><tr><th>#</th><th style="text-align:left">球员</th><th>球队</th><th>场</th><th>得分</th><th>篮板</th><th>助攻</th><th>效率</th></tr></thead><tbody>';
  eff.forEach((p,i)=>{
    h += '<tr class="tapable'+(p.tid===L.myTid?" mine":"")+'" data-act="player" data-v="'+p.id+'">'+
      '<td>'+(i+1)+'</td><td class="nm" style="text-align:left">'+esc(p.name)+'</td>'+
      '<td>'+esc(L.teams[p.tid]?L.teams[p.tid].abbr:"FA")+'</td><td>'+p.st.g+'</td>'+
      '<td>'+pg(p,'pts').toFixed(1)+'</td><td>'+pg(p,'reb').toFixed(1)+'</td><td>'+pg(p,'ast').toFixed(1)+'</td>'+
      '<td><b style="color:var(--acc2)">'+impact(L,p).toFixed(1)+'</b></td></tr>';
  });
  h += '</tbody></table></div></div>';
  return h;
}

/* ---------- 交易 ---------- */
function renderTrade(){
  const L = S.L, t = myTeam();
  const tr = S.trade;
  let h = '<div class="card"><div class="hd"><b>交易中心</b></div><div class="bd">';
  h += '<div style="font-size:11.5px;color:var(--dim2);margin-bottom:8px">薪资空间 '+fmtM(capSpace(L,t))+
    ' · 薪资总额 '+fmtM(t.payroll)+' · 人员 '+t.roster.length+'/15</div>';
  if(tr.b===null||tr.b===undefined){
    h += '<div style="font-size:12px;color:var(--dim2)">选择一支交易伙伴球队</div>';
  } else {
    const B = L.teams[tr.b];
    h += '<div class="row" style="gap:8px"><div class="chip a" style="flex:1"><b>'+esc(t.abbr)+'</b><span>我方</span></div>'+
      '<div class="chip b" style="flex:1"><b>'+esc(B.abbr)+'</b><span>对方</span></div></div>'+
      '<div style="margin-top:8px"><button class="btn sm" data-act="tradeClear">更换交易伙伴</button></div>';
  }
  h += '</div></div>';
  if(tr.b===null||tr.b===undefined){
    h += '<div class="card"><div class="bd tight">';
    L.teams.filter(x=>x.id!==t.id).forEach(x=>{
      h += '<div class="pl tapable" data-act="tradePickTeam" data-v="'+x.id+'">'+
        '<div class="pos" style="background:'+x.c1+'33;color:'+x.c2+'">'+x.abbr.slice(0,2)+'</div>'+
        '<div class="info"><b>'+esc(x.name)+'</b><span>'+x.w+'-'+x.l+' · 实力 '+Math.round(teamRating(L,x))+' · 薪资 '+fmtM(x.payroll)+'</span></div>'+
        '<div style="font-size:11px;color:var(--dim2)">选择 ›</div></div>';
    });
    h += '</div></div>';
    return h;
  }
  const B = L.teams[tr.b];
  const box = (team, key, pkkey, side)=>{
    let o = '<div class="card"><div class="hd"><b>'+esc(team.name)+'</b><div class="sp" style="flex:1"></div>'+
      '<button class="btn sm" data-act="tradeEdit" data-v="'+side+'">选择</button></div><div class="bd tight">';
    const sel = tr[key];
    if(sel.length) sel.forEach(id=>{
      const p = L.byId[id];
      o += '<div class="pl tapable" data-act="tradeRm" data-v="'+side+'_'+id+'">'+
        '<div class="pos '+p.pos+'">'+p.pos+'</div><div class="info"><b>'+esc(p.name)+'</b><span>'+p.ovr+' · '+fmtM(p.salary)+'</span></div>'+
        '<div style="font-size:11px;color:var(--red)">移除 ✕</div></div>';
    }); else o += '<div class="empty" style="padding:14px">未选择球员</div>';
    o += '</div></div>';
    return o;
  };
  h += box(t, "ap", "apk", "a");
  h += box(B, "bp", "bpk", "b");
  // 评估
  const pkOf = function(side, tid){
    return (side==="a"? tr.apk: tr.bpk).map(function(k){
      const q = String(k).split("_");
      return {tid: tid, yr: parseInt(q[0],10), rd: parseInt(q[1],10)};
    });
  };
  const ev = evaluateTrade(L, {tid:t.id, players:tr.ap, picks:pkOf("a", t.id)}, {tid:B.id, players:tr.bp, picks:pkOf("b", B.id)});
  const canExec = tr.ap.length || tr.bp.length || tr.apk.length || tr.bpk.length;
  h += '<div class="card"><div class="hd"><b>交易评估</b></div><div class="bd">';
  h += '<div class="kv"><span class="k">我方送出价值</span><span class="v">'+ev.valueA+'</span></div>';
  h += '<div class="kv"><span class="k">获得球员价值</span><span class="v">'+ev.valueB+'</span></div>';

function doSign(L, p, salary, yrs){
  const t = myTeam();
  if(t.roster.length>=ROSTER_MAX){ toast("阵容已满（15人），请先清理名单"); return false; }
  const room = capSpace(L,t);
  if(salary > room + 0.01){ toast("薪资空间不足（可用 "+fmtM(room)+"）"); return false; }
  const demand = demandOf(L,p);
  let prob = 0.5;
  const ratio = salary/demand;
  if(ratio>=1.15) prob = 0.97;
  else if(ratio>=1.0) prob = 0.85;
  else if(ratio>=0.9) prob = 0.55;
  else if(ratio>=0.8) prob = 0.28;
  else prob = 0.08;
  prob += (t.prestige-50)*0.004;
  if(yrs>=4) prob += 0.05;
  if(p.tid===t.id) prob += 0.12;
  // 其他球队竞争
  const rival = L.teams.filter(x=> x.id!==t.id && x.roster.length<ROSTER_MAX && capSpace(L,x)>=demand && Math.random()<0.25);
  if(rival.length) prob *= 0.62;
  if(Math.random()<prob){
    p.tid = t.id; p.salary = Math.round(salary*10)/10; p.yrs = yrs; p.injured = p.injured;
    t.roster.push(p.id);
    t.payroll = payrollOf(L,t); t.lineup = autoLineup(L,t);
    addNews(L, "【签约】"+t.name+"签下自由球员 "+p.name+"（"+p.pos+"，评分 "+p.ovr+"），"+yrs+" 年 "+fmtM(p.salary)+"/年。","fa");
    toast("签约成功：" + p.name);
    return true;
  }
  const who = rival.length? pick(rival) : null;
  toast(who? (p.name+" 选择了 "+who.name) : (p.name+" 拒绝了你的报价"));
  return false;
}

function startDraft(L){
  if(!L.draftClass) L.draftClass = genDraftClass(L, 60);
  const order = lotteryOrder(L);
  const picks = [];
  let idx = 0;
  for(let rd=1; rd<=2; rd++){
    const ord = rd===1? order.slice() : order.slice().reverse();
    ord.forEach((t,i)=> picks.push({tid:t.id, rd:rd, pk:i+1, team:t}));
  }
  L.draftState = {picks:picks, idx:0, klass:L.draftClass, log:[], waiting:null, avail:L.draftClass.slice()};
  L.draftOrder = order.map(t=>t.id);
  addNews(L,"【选秀】"+L.year+" 年 NBA 选秀大会开始，"+L.teams[order[0].id].name+"获得状元签。","news");
  return draftAdvance(L);
}
function draftValue(L, p, tid){
  const t = L.teams[tid];
  let v = p.pot*1.2 + p.ovr*0.6;
  const need = {PG:0,SG:0,SF:0,PF:0,C:0};
  rosterOf(L,t).forEach(x=> need[x.pos]=(need[x.pos]||0)+1);
  const n = need[p.pos]||0;
  if(n<=1) v += 9; else if(n===2) v += 4; else if(n>=4) v -= 5;
  return v;
}
function draftAdvance(L){
  const ds = L.draftState;
  while(ds.idx < ds.picks.length){
    const cur = ds.picks[ds.idx];
    if(cur.tid === L.myTid){
      ds.waiting = cur;
      return "wait";
    }
    // AI 选择
    const cands = ds.avail.slice().sort((a,b)=> draftValue(L,b,cur.tid)-draftValue(L,a,cur.tid));
    const p = cands[Math.min(ri(3), cands.length-1)] || cands[0];
    if(!p){ ds.idx = ds.picks.length; break; }
    doDraftPick(L, p, cur);
    ds.idx++;
  }
  ds.waiting = null;
  L.phase = "preseason";
  addNews(L,"【选秀】"+L.year+" 年选秀大会结束。","news");
  return "done";
}
function doDraftPick(L, p, cur){
  const ds = L.draftState;
  const t = L.teams[cur.tid];
  p.tid = t.id;
  p.draft = {yr:L.year, rd:cur.rd, pk:cur.pk};
  p.exp = 0;
  p.yrs = 4;
  p.salary = Math.round((MIN_SAL + (cur.rd===1? (1.9 + (30-cur.pk)*0.13) : 0.6) + Math.random()*0.5)*10)/10;
  t.roster.push(p.id);
  L.players.push(p); L.byId[p.id] = p;
  const i = ds.avail.indexOf(p); if(i>=0) ds.avail.splice(i,1);
  ds.log.push({rd:cur.rd, pk:cur.pk, team:t.name, name:p.name, pos:p.pos, ovr:p.ovr, pot:p.pot});
  if(p.draft.pk===1) addNews(L, "【选秀】"+t.name+"用状元签选中 "+p.name+"（"+p.pos+"，潜力 "+p.pot+"）。","news");
}

    '<div class="kv"><span class="k">运营与青训</span><span class="v">-'+fmtM(est.ops)+'</span></div>'+

  });
  h += '</tbody></table></div></div>';
  return h;
}
function estimateFinance(L,t){
  const gp = Math.max(1, t.gp);
  const perGame = 19000 * (0.75 + t.prestige/160) * (0.94 + (t.budget.tickets-1)*0.35) + (winPct(t)-0.5)*2600;
  const gate = Math.max(0, perGame * 41 * (t.budget.tickets-1>-0.2?1:0.9));
  const tv = 168;
  const spon = 62 * (0.7 + t.prestige/110) * (0.95 + (t.budget.market-1)*0.55);
  const ops = 78 * t.budget.fac + 46 * t.budget.market;
  const pay = payrollOf(L,t);
  const tax = pay>taxOf(L)? (pay-taxOf(L))*1.75 : 0;
  return {gate:gate, tv:tv, spon:spon, ops:ops, profit: gate+tv+spon-pay-tax-ops};
}

  const hist = L.history.slice().reverse();
  if(!hist.length) h += '<div class="empty">还没有完成的赛季</div>';
  hist.forEach(x=>{
    const ct = L.teams[x.champ] || null;
    const c1 = ct? ct.c1 : "#888", c2 = ct? ct.c2 : "#ffffff";
    const ab = ct? String(ct.abbr||"?") : "??", nm2 = ct? ct.name : "（未知球队）";
    h += '<div class="pl"><div class="pos" style="background:'+c1+'33;color:'+c2+'">'+
      esc(ab.slice(0,2))+'</div>'+
      '<div class="info"><b>'+esc(nm2)+'</b><span>'+(x.year)+'-'+String((x.year+1)%100).padStart(2,"0")+' 赛季总冠军'+
      (x.mvp? ' · MVP '+esc(x.mvp.n):'')+'</span></div></div>';
  });
  h += '</div></div>';
  // 联盟纪录
  h += '<div class="card"><div class="hd"><b>单季数据纪录</b><div class="sp" style="flex:1"></div><span class="sub">本存档累计</span></div><div class="bd tight">';
  const all = L.players.filter(p=> p.log && p.log.length);
  const best = {};
  all.forEach(p=> p.log.forEach(l=>{
    [["pts","场均得分"],["reb","场均篮板"],["ast","场均助攻"]].forEach(c=>{
      if(!best[c[0]] || l[c[0]]>best[c[0]].v) best[c[0]] = {p:p, v:l[c[0]], y:l.y};
    });
  }));
  const keys = Object.keys(best);
  if(!keys.length) h += '<div class="empty">暂无历史数据</div>';
  keys.forEach(k=>{
    h += '<div class="pl"><div class="info"><b>'+esc(best[k].p.name)+'</b><span>'+
      ({pts:"场均得分",reb:"场均篮板",ast:"场均助攻"}[k])+' · '+(best[k].y-1)+'-'+String(best[k].y%100).padStart(2,"0")+' 赛季</span></div>'+
      '<div style="font-weight:800;font-size:15px">'+best[k].v.toFixed(1)+'</div></div>';
  });
  h += '</div></div>';
  return h;
}

function saveToSlot(i){
  const L = S.L, t = myTeam();
  const payload = {
    teamName: t.name, teamAbbr: t.abbr, seasonLabel: seasonLabel(L), record: t.w+"胜"+t.l+"负",
    myTid: L.myTid, data: packLeague(L)

function packLeague(L){
  const p = JSON.parse(JSON.stringify(L, (k,v)=>{
    if(k==="sched") return v.map(day=> day.map(g=>({h:g.h,a:g.a,hs:g.hs,as:g.as,done:g.done,qs:g.qs})));
    return v;
  }));
  return p;
}
function loadSlot(i){
  const raw = localStorage.getItem("bbgm_slot"+i);
  if(!raw){ toast("该存档为空"); return; }
  try{

    S.L.players.forEach(p=>{ if(!p.st) p.st = newLine(); });
    closeModal(); S.screen="dash"; render(); toast("读取成功");

function bindEvents(){
  const clickAct = function(ev){
    let el = ev.target;
    while(el && el!==document.body){
      const a = el.getAttribute? el.getAttribute("data-act") : null;
      if(a){
        if(el.tagName==="INPUT" && a!=="impChange") return;
        const v = el.getAttribute("data-v");
        if(a!=="impChange" && a!=="pickFile"){ if(ev.preventDefault) ev.preventDefault(); }
        dispatchAct(a, v, el, ev);
        return;
      }
      el = el.parentNode;
    }
  };
  document.addEventListener("click", clickAct, false);
  document.addEventListener("change", function(ev){
    const el = ev.target;
    if(el && el.id==="impFile" && el.files && el.files[0]) importSaveFile(el.files[0]);
  }, false);
  document.addEventListener("keydown", function(ev){
    if(ev.key==="Escape") closeModal();
  }, false);
}

/* ==================== 三、交互派发 ==================== */
function dispatchAct(a, v, el, ev){
  const L = S.L;
  try{
    const fn = ACT[a];
    if(!fn){ toast("该功能暂不可用：("+a+")"); return; }
    fn(v, el, ev);
    if(MODAL_ACTS[a]) render();
    else if(!(a in QUIET_ACTS)) render();
  }catch(e){
    toast("操作出错："+(e && e.message? e.message : e));
    if(window.console) console.error(e);
  }
}
const QUIET_ACTS = {
  nav:1, openMore:1, player:1, teamInfo:1, closeModal:1, gameres:1,
  tradeSel:1, faOffer:1, draftPickOpen:1, lineupEdit:1, playerActs:1,
  awards:1, draftStart:1, exportSave:1, pickFile:1, impChange:1, delSlot:1, delSlotDo:1, newCareer:1
};

  /* ---------- 导航 / 通用 ---------- */
  nav: function(v){ if(v==="offseason"){ S.screen="schedule"; render(); return; } go(v); },
  openMore: function(){ openMore(); },

  player: function(v){ const p = S.L.byId[v]; if(p) renderPlayerModal(v); else toast("找不到该球员"); },

  /* ---------- 推进 ---------- */

  simDay: function(){
    const L = S.L;

    finishRegular(L);

    const L = S.L;
    if(L.phase!=="regular"){ ACT.simDay(); return; }
    if(!nextUserGame(L)){ ACT.simSeason(); return; }
    simToNextUser(L, 40);
    const g = lastUserGame(L);
    if(g) showGame(g.h, g.a, g);
    render();
    finishRegular(L);
  },
  simWeek: function(){
    const L = S.L;
    if(L.phase!=="regular"){ ACT.simDay(); return; }
    let n = 0;
    while(n<7 && L.phase==="regular" && L.day<L.sched.length){ playDay(L); n++; }

    if(g) showGame(g.h, g.a, g);
    render();
    finishRegular(L);
  },

    const L = S.L;
    if(L.phase!=="regular"){ ACT.simDay(); return; }

  draftNext: function(){

    const r = draftAdvance(L);

    render();
    if(r==="wait") draftPickModal();

  draftPickOpen: function(){ draftPickModal(); },
  draftPickOne: function(v){

  },
  draftAuto: function(){

  seasonStart: function(){

  },
  seasonStartDo: function(){
    const L = S.L;
    closeModal();
    showSim();
    nextSeason(L);
    hideSim();
    S.screen = "dash";
    render();
    toast(seasonLabel(L)+" 赛季常规赛开打！");
  },
  toHome: function(){ closeModal(); go("dash"); },

  /* ---------- 交易 ---------- */
  tradeSel: function(v, el){
    const p = String(v).split("_");
    S.trade.side = p[0];
    S.trade[p[0]==="a"? "a" : "b"] = parseInt(p[1],10);
    render();
    tradeSelectModal(S.trade.side);
  },
  tradePick: function(v){
    const p = String(v).split("_");
    const side = p[0], pid = parseInt(p[1],10);
    const arr = side==="a"? S.trade.ap : S.trade.bp;
    const i = arr.indexOf(pid);
    if(i>=0) arr.splice(i,1); else arr.push(pid);
    render();
    tradeSelectModal(side);
  },
  tradePk: function(v){
    const p = String(v).split("_");
    const side = p[0], yr = parseInt(p[1],10), rd = parseInt(p[2],10);
    const arr = side==="a"? S.trade.apk : S.trade.bpk;
    const key = yr+"_"+rd;
    const i = arr.indexOf(key);
    if(i>=0) arr.splice(i,1); else arr.push(key);
    render();
    tradeSelectModal(side);
  },
  tradeExec: function(){
    const L = S.L, tr = S.trade;
    if(tr.a==null || tr.b==null){ toast("请先选择双方球队"); return; }
    if(!tr.ap.length && !tr.bp.length && !tr.apk.length && !tr.bpk.length){ toast("请先选择交易筹码"); return; }
    const pkOf = function(side, tid){
      return (side==="a"? tr.apk: tr.bpk).map(function(k){
        const q = String(k).split("_");
        return {tid: tid, yr: parseInt(q[0],10), rd: parseInt(q[1],10)};
      });
    };
    const offer   = {tid: tr.a, players: tr.ap.slice(), picks: pkOf("a", tr.a)};
    const receive = {tid: tr.b, players: tr.bp.slice(), picks: pkOf("b", tr.b)};
    showSim();
    const ev = evaluateTrade(L, offer, receive);
    let ok = false;
    if(ev.ok){ execTrade(L, offer, receive); ok = true; }
    hideSim();
    if(ok){ toast("交易达成！"); S.trade = {a:S.L.myTid, b:null, ap:[], bp:[], apk:[], bpk:[]}; }
    else toast("交易未达成："+ev.verdict+(ev.capMsg? "（"+ev.capMsg+"）":""));
    render();
  },
  tradePickTeam: function(v){
    const tr = (typeof ensureTrade === "function")? ensureTrade(S.L) : S.trade;
    const id = parseInt(v,10);
    if(isNaN(id) || !S.L.teams[id]){ toast("无效的球队"); return; }
    if(id === S.L.myTid){ toast("不能与自己交易"); return; }
    tr.b = id; tr.bp = []; tr.bpk = [];
    render(); toast("已选择交易伙伴："+S.L.teams[id].name);
  },
  tradeReset: function(){ ACT.tradeClear(); },
  tradeClear: function(){
    S.trade = {a:S.L.myTid, b:null, ap:[], bp:[], apk:[], bpk:[]};
    render();
  },

  /* ---------- 自由市场 ---------- */
  faOffer: function(v){ faOfferModal(parseInt(v,10)); },
  plOffer: function(v){ faOfferModal(parseInt(v,10)); },
  faSign: function(){
    const p = S.L.byId[S.mk && S.mk.pid];
    if(!p) return;
    const sal = parseFloat($("mkSal")? $("mkSal").value : 0);
    const yrs = parseInt($("mkYrs")? $("mkYrs").value : 1, 10);
    const ok = doSign(S.L, p, sal, yrs);
    if(ok){ closeModal(); render(); }
  },

  /* ---------- 球员 / 阵容 ---------- */
  lineupEdit: function(){ renderLineupModal(); },
  playerActs: function(){ renderPlayerModal(S.mk? S.mk.pid : null); },
  lineupSet: function(v){
    const L = S.L, t = myTeam();
    const p = String(v).split("_");
    const pid = parseInt(p[0],10);
    const arr = t.lineup.starters.slice();
    if(p[1]==="out"){ const i = arr.indexOf(pid); if(i>=0) arr.splice(i,1); }
    else { const i = parseInt(p[1],10); if(i>=0 && i<arr.length) arr[i] = pid; }
    const set = {};
    arr.forEach(x=>{ if(x>0) set[x]=1; });
    const others = rosterOf(L,t).filter(x=> !set[x.id]).sort((a,b)=> b.ovr-a.ovr).map(x=>x.id);
    while(arr.length<5 && others.length) arr.push(others.shift());
    t.lineup.starters = arr.slice(0,5);
    t.lineup = autoLineup(L, t);
    render();
    renderLineupModal();
  },

  /* ---------- 其他 ---------- */
  awards: function(){ showAwards(); },
  newsOpen: function(){ go("news"); },
  asg: function(){ showASG(); },
  historyAll: function(){ go("history"); }
};

function findGame(L, H, A, day){
  const cands = [];
  if(typeof day==="number" && L.sched[day]) cands.push(L.sched[day]);
  for(let d=L.sched.length-1; d>=0 && cands.length<3; d--){
    if(d===day) continue;
    cands.push(L.sched[d]);
  }
  cands.unshift(L.sched[L.day] || []);
  for(const arr of cands){
    if(!arr) continue;
    for(const g of arr) if(g.h===H && g.a===A && g.done) return g;
  }
  return null;
}
function showGame(H, A, gObj, day){
  const L = S.L;
  const g = (gObj && gObj.done)? gObj : findGame(L, H, A, day);
  if(!g){ toast("未找到该场比赛数据"); return; }
  const H2 = L.teams[g.h], A2 = L.teams[g.a];
  openModal(esc(H2.abbr)+" "+g.hs+" - "+g.as+" "+esc(A2.abbr), gameModalHTML(L, g),
    '<button class="btn" data-act="closeModal">关闭</button>');
}

function simFinals(L){
  const po = L.po;
  if(!po || po.round!==3 || po.done){ return; }
  const e = (po.bracket.east && po.bracket.east[0])? po.bracket.east[0] : null;
  const w = (po.bracket.west && po.bracket.west[0])? po.bracket.west[0] : null;
  if(!e || !w){ po.done = true; return; }
  const fin = simSeries(L, e[0], w[0], 4, false);
  po.round = 4;
  po.done = true;
  po.champ = fin.w;
  const ct = L.teams[fin.w];
  ct.titles = (ct.titles||0) + 1;
  L.champ = fin.w;
  po.log.push({r:4, t1:fin.t1, t2:fin.t2, w:fin.w, l:fin.lose, sc:fin.w1+"-"+fin.w2});
  if(!L.awards) L.awards = {mvp:null, dpoy:null, roy:null, mip:null, sixth:null, allnba:[[],[],[]], allstar:[], fmvp:null};
  const lineup = [];
  (po.roster||[]).forEach(tid=>{ if(tid===fin.w) lineup.push(tid); });
  let cand = rosterOf(L, ct);
  if(po.finalists) cand = cand.filter(p=> true);
  const fmvp = cand.slice().sort((a,b)=> impact(L,b)-impact(L,a))[0] || null;
  L.awards.fmvp = fmvp? fmvp.id : null;
  po.fmvp = fmvp? fmvp.id : null;
  if(fmvp) fmvp.awards.push({y:L.year, t:"fmvp"});
  addNews(L, "【总冠军】"+L.year+"-"+((L.year+1)%100)+" 总冠军诞生："+ct.name+"！总决赛 "+fin.w1+"-"+fin.w2+" 击败 "+L.teams[fin.lose].name+"。"+(fmvp? " FMVP："+fmvp.name+"。":""), "champ");
  L.draftClass = genDraftClass(L, 60);
  L.draftDone = false;
}
function simStep(fn){
  const el = $("toast");
  if(el){ el.textContent = "计算中…"; el.classList.add("show"); }

    try{ fn(); }
    catch(e){ if(window.console) console.error(e); toast("模拟出错："+(e&&e.message?e.message:e)); }
    finally{ const t2 = $("toast"); if(t2) t2.classList.remove("show"); }

function exportSaveFile(){
  const L = S.L, t = myTeam();
  const payload = { teamName:t.name, teamAbbr:t.abbr, seasonLabel:seasonLabel(L),
    record:t.w+"胜"+t.l+"负", myTid:L.myTid, data:packLeague(L) };
  const name = "篮球王朝GM_"+L.year+"_"+t.abbr+".json";
  try{

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ try{ document.body.removeChild(a); URL.revokeObjectURL(url); }catch(e){} }, 600);
    toast("已导出 "+name);
  }catch(e){ toast("导出失败："+(e&&e.message?e.message:e)); }
}
function importSaveFile(file){
  const rd = new FileReader();
  rd.onload = function(){
    try{
      const d = JSON.parse(String(rd.result));
      if(!d || !d.data || !d.data.teams) throw new Error("文件格式不正确");
      S.L = d.data;
      hydrateLeague(S.L);
      S.screen = "dash";
      S.trade = {a:null,b:null,ap:[],bp:[],apk:[],bpk:[]};
      closeModal();
      render();
      toast("导入成功："+S.L.teams[S.L.myTid].name);
    }catch(e){ toast("导入失败："+(e&&e.message?e.message:e)); }
  };
  rd.readAsText(file);
}
function hydrateLeague(L){
  if(!L.byId) L.byId = {};
  L.players.forEach(p=>{
    L.byId[p.id] = p;
    if(!p.st) p.st = newLine();
    if(!p.awards) p.awards = [];
  });
  const relink = arr => (arr||[]).map(x=> L.byId[x && x.id] || x);
  if(L.draftState){
    L.draftState.avail = relink(L.draftState.avail);
    L.draftState.klass = relink(L.draftState.klass);
  }
  if(L.draftClass) L.draftClass = relink(L.draftClass);
  if(L.faPool) L.faPool = relink(L.faPool);
  if(L.sched) L.sched.forEach(day=> day.forEach(g=>{ if(g.box) g.box = relink(g.box); }));
  if(!L.tradeFAs) L.tradeFAs = {};
  L.teams.forEach(t=>{ if(!t.lineup) t.lineup = autoLineup(L,t); if(!t.budget) t.budget = {tickets:1.0, market:1.0, fac:1.0}; });
  if(!L.news) L.news = [];
  if(!L.history) L.history = [];
}

/* ============================================================
   模块 07：深度系统补丁 / 王朝资料片
   —— 本模块在 p1~p8 之后加载，同名 function 声明覆盖前序同名函数
   —— ACT 为 const 对象，通过属性赋值扩展流程；render 重新实现接入新页面
   ============================================================ */

/* ---------------- 0. 关键修复 ---------------- */
/* p8 的 dispatchAct 引用了 MODAL_ACTS，但全工程从未定义 → 每次点击都抛
   ReferenceError 并被 try/catch 吞掉，界面不再刷新（游戏实质不可玩）。补齐之。 */
const MODAL_ACTS = {};

/* 技术统计：原版对 g.box（对象映射）调用 .filter() 且访问不存在的 x.tid / x.tov，
   首次打开比赛结果弹窗即抛错。此处兼容对象/数组两种结构重建。 */
function boxTable(L, g, tid){
  if(!g) return '<div class="empty">无比赛数据</div>';
  const b = g.box;
  if(!b) return '<div class="empty">该场比赛暂无逐人统计（旧存档仅记录比分）</div>';
  const ms = g.minsec || {};
  const rows = [];
  const push = function(x, key){
    if(!x) return;
    const pid = (x.pid!=null? x.pid : (x.id!=null? x.id : key));
    const p = L.byId[pid] || L.byId[key];
    if(!p || (tid!=null && p.tid !== tid)) return;
    rows.push({
      name: p.name, sec: Math.round(ms[key]||ms[pid]||0),
      pts: x.pts||0, reb: x.reb||0, ast: x.ast||0, stl: x.stl||0, blk: x.blk||0,
      to: (x.to!=null? x.to : (x.tov||0)), fgm: x.fgm||0, fga: x.fga||0
    });
  };
  if(Array.isArray(b)){ b.forEach(function(x){ push(x, (x.pid!=null? x.pid : x.id)); }); }
  else { Object.keys(b).forEach(function(k){ push(b[k], k); }); }
  if(!rows.length) return '<div class="empty">本场无该队球员数据</div>';
  rows.sort(function(a,b2){ return b2.sec - a.sec; });
  const agg = {pts:0,reb:0,ast:0,stl:0,blk:0,to:0,fgm:0,fga:0};
  rows.forEach(function(r){ for(const k in agg) agg[k] += r[k]; });
  let h = '<div class="scrollx"><table class="tbl"><thead><tr><th style="text-align:left">球员</th><th>时间</th><th>分</th><th>板</th><th>助</th><th>断</th><th>帽</th><th>失</th><th>命中</th></tr></thead><tbody>';
  rows.slice(0,9).forEach(function(r,i){
    h += '<tr'+(i<5?' class="mine"':'')+'><td class="nm" style="text-align:left">'+esc(r.name)+'</td><td>'+(r.sec/60).toFixed(1)+'</td>'+
      '<td>'+r.pts+'</td><td>'+r.reb+'</td><td>'+r.ast+'</td><td>'+r.stl+'</td><td>'+r.blk+'</td><td>'+r.to+'</td><td>'+r.fgm+'/'+r.fga+'</td></tr>';
  });
  h += '<tr><td style="text-align:right;font-weight:700">合计</td><td>—</td><td>'+agg.pts+'</td><td>'+agg.reb+'</td><td>'+agg.ast+'</td><td>'+agg.stl+'</td><td>'+agg.blk+'</td><td>'+agg.to+'</td><td>'+agg.fgm+'/'+agg.fga+'</td></tr>';
  h += '</tbody></table></div>';
  return h;
}

/* 比赛结果弹窗：原版四节比分按 [{h,a}] 结构渲染成 undefined，且依赖 boxTable。整体重写。 */
function gameModalHTML(L, g){

  h += '<div style="font-size:25px;font-weight:900;letter-spacing:1px"><span style="color:'+(hw?'var(--green)':'var(--dim)')+'">'+g.hs+'</span> : <span style="color:'+(!hw?'var(--green)':'var(--dim)')+'">'+g.as+'</span></div>';
  h += '<div style="text-align:center;width:88px"><div style="width:46px;height:46px;margin:0 auto;border-radius:12px;background:'+A.c1+';border:2px solid '+A.c2+';display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:#fff">'+esc(A.abbr)+'</div><div style="font-size:11px;color:var(--dim2);margin-top:4px">客</div></div>';
  h += '</div>';
  h += '<div style="font-size:12.5px;font-weight:800;margin-top:8px;color:'+(hw?'var(--green)':'var(--acc2)')+'">'+esc((hw?H:A).name)+' 取胜</div>';
  h += '</div>';
  if(g.qs && g.qs.length){
    h += '<div class="scrollx"><table class="tbl"><thead><tr><th style="text-align:left">球队</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th>总分</th></tr></thead><tbody>';
    [["h",H],["a",A]].forEach(function(pair){
      const key = pair[0], T = pair[1];
      h += '<tr><td style="text-align:left;font-weight:700">'+esc(T.abbr)+'</td>';
      g.qs.forEach(function(q){
        const v = Array.isArray(q)? (key==="h"? q[0] : q[1]) : (key==="h"? q.h : q.a);
        h += '<td>'+(v==null? "-" : v)+'</td>';
      });
      h += '<td><b>'+(key==="h"? g.hs : g.as)+'</b></td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '<div style="font-size:12px;font-weight:800;color:var(--acc2);margin:12px 0 6px">'+esc(H.name)+' 球员数据</div>';
  h += boxTable(L, g, g.h);
  h += '<div style="font-size:12px;font-weight:800;color:var(--acc2);margin:12px 0 6px">'+esc(A.name)+' 球员数据</div>';
  h += boxTable(L, g, g.a);
  return h;
}

    });

if (typeof fmtM !== "function") {
  window.fmtM = function(v){
    const n = Number(v)||0;
    if (Math.abs(n) >= 1000) return (n/1000).toFixed(2)+"B";
    return n.toFixed(1)+"M";
  };
}

      sum += c? c.sal : 2.0;
    });
    return Math.round((cap - sum)*10)/10;
  };
}
if (typeof myTeam !== "function") {

}

/* ---------------- 1. 通用小工具 ---------------- */
function ri(a,b){ if(b===undefined){ return Math.floor(Math.random()*(a||1)); } return Math.floor(Math.random()*(b-a+1))+a; }
function clampDeep(v,a,b){ return v<a? a : (v>b? b : v); }
function pickOne(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function chance(p){ return Math.random() < p; }
function money(v){
  const n = Math.round(Number(v)||0);
  return "$"+n.toFixed(1)+"M";
}
function bar(v, color){

  return '<div class="mbar"><i style="width:'+w+'%;background:'+(color||"var(--acc2)")+'"></i></div>';
}
function attrColor(v){
  v = Number(v)||0;
  if(v>=90) return "var(--gold)";
  if(v>=82) return "var(--green)";
  if(v>=74) return "var(--acc2)";
  if(v>=65) return "var(--dim)";
  return "var(--red)";
}
function potColor(v){

  if(v>=90) return "var(--gold)";

}

/* ---------------- 2. 深度状态 ---------------- */
function newG9(){
  return {
    v: 1,
    staff: {hc:null, ac:null, off:null, def:null},
    staffMarket: COACHES.map(function(c){ return c.id; }),
    facilities: {f1:0,f2:0,f3:0,f4:0,f5:0,f6:0},
    dev: {},                  // pid -> {plan, points, spent, prog, history:[]}
    contracts: {},            // pid -> {sal, years, role, opt, noTrade, bonus, since}
    train: {overall:"balanced", intensity:2, weekly:0, fatigue:{}, focus:null},
    story: {chapter:1, xp:0, level:1, flags:{}, log:[]},
    news: [],
    inbox: [],
    inboxUnread: 0,
    records: [],
    legacy: {titles:0, finals:0, playoffs:0, best:0, hof:[]},
    relations: {},            // pid -> {morale, trust}
    lastWeek: -1,
    lastCheck: 0,
    momentum: 0,
    fanMood: 55,
    chem: 50,
    planFocus: null,
    taunts: 0,
    seasonEdge: 0
  };
}
function ensureG9(L){
  if(!L) return null;
  if(!L.g9 || L.g9.v !== 1){
    const g = newG9();
    L.g9 = g;
    initG9ForLeague(L, g);
  }
  const g = L.g9;
  ["staff","facilities","dev","contracts","train","story","inbox","relations","legacy"].forEach(function(k){
    if(!g[k]) g[k] = newG9()[k];
  });
  if(!Array.isArray(g.news)) g.news = [];
  if(!Array.isArray(g.records)) g.records = [];
  if(typeof g.inboxUnread !== "number") g.inboxUnread = 0;
  if(!g.train.fatigue) g.train.fatigue = {};
  if(!g.train.overall) g.train.overall = "balanced";
  if(!g.train.intensity) g.train.intensity = 2;
  if(!g.story.log) g.story.log = [];
  if(!g.story.chapter) g.story.chapter = 1;
  if(!g.staffMarket || !g.staffMarket.length) g.staffMarket = COACHES.map(function(c){ return c.id; });
  return g;
}

/* 首次进入时为全联盟生成合同、发展计划、角色、关系 */
function initG9ForLeague(L, g){
  const total = (typeof L.salaryCap!=="undefined"? L.salaryCap : (L.cap||140));
  if(typeof L.cap === "undefined") L.cap = total;
  L.teams.forEach(function(t){
    const size = (t.roster||[]).length;
    (t.roster||[]).forEach(function(pid, i){
      const p = L.byId[pid];
      if(!p) return;
      if(!g.contracts[pid]) g.contracts[pid] = makeContract(L, p, t, i, size);
      if(t.id === myTeamIdOf(L) && !g.dev[pid]) g.dev[pid] = {plan:"balanced", points:0, spent:0, prog:"off", hist:[]};
      if(!g.relations[pid]) g.relations[pid] = {morale: p.morale!=null? p.morale : 65, trust: 50};
    });
  });
  g.facilities = {f1:1,f2:1,f3:1,f4:1,f5:1,f6:1};
  g.train.overall = "balanced";
  g.train.intensity = 2;
  g.fanMood = 55;
  g.chem = 50;
  g.legacy = {titles:0, finals:0, playoffs:0, best:0, hof:[]};
  g.news = [];
  g.inbox = [];
  g.records = [];
  addNews(L, "system", "新赛季启程", (myTeam().name||"球队")+"管理层完成架构重组，全新的训练与发展体系正式上线。", 2);
}
function myTeamIdOf(L){
  if(L && L.myTid != null) return L.myTid;
  if(typeof S !== "undefined" && S && S.L && S.L.myTid != null) return S.L.myTid;
  return 0;
}
function makeContract(L, p, t, idx, size){
  const ov = Number(p.ov!=null? p.ov : (p.ovr||70));
  const base = 1.5 + Math.pow(Math.max(0, ov-62)/38, 2.3) * 38;
  const jitter = 0.85 + Math.random()*0.3;
  let sal = (p && p.salary!=null && p.salary>0)? Number(p.salary) : Math.round(base*jitter*10)/10;
  sal = Math.max(1.2, Math.min(52, Math.round(sal*10)/10));
  const years = (p && p.yrs!=null && p.yrs>0)? p.yrs : Math.max(1, ri(1,4));
  let role = "bench";
  if(idx===0 && ov>=80) role = "star";
  else if(idx<5) role = ov>=78? "starter" : "sixth";
  else if(idx<8) role = "role";
  else role = "bench";
  return {
    sal: sal, years: years, role: role,
    opt: years<=2 && ov>=80 && Math.random()<0.5,
    noTrade: ov>=85 && Math.random()<0.4,
    bonus: ov>=88? Math.round(sal*0.12*10)/10 : 0,
    since: L.year - ri(0,2)
  };
}
function contractOf(L, pid){
  const g = ensureG9(L);
  if(!g.contracts[pid]){
    const t = teamOfPlayer(L, pid);
    g.contracts[pid] = makeContract(L, L.byId[pid]||{}, t||{roster:[]}, 8, 12);
  }
  return g.contracts[pid];
}
function teamOfPlayer(L, pid){
  for(let i=0;i<L.teams.length;i++) if((L.teams[i].roster||[]).indexOf(pid)>=0) return L.teams[i];
  return null;
}
function payrollOfDeep(L, t){
  let sum = 0;
  (t.roster||[]).forEach(function(pid){ sum += contractOf(L, pid).sal; });
  return Math.round(sum*10)/10;
}
function capSpaceDeep(L, t){
  if(typeof L.cap === "undefined") L.cap = 140;
  return Math.round((L.cap - payrollOf(L, t))*10)/10;
}
function devOf(L, pid){
  const g = ensureG9(L);
  if(!g.dev[pid]) g.dev[pid] = {plan:"balanced", points:0, spent:0, prog:"off", hist:[]};
  return g.dev[pid];
}
function relOf(L, pid){
  const g = ensureG9(L);
  if(!g.relations[pid]) g.relations[pid] = {morale: 65, trust: 50};
  return g.relations[pid];
}
function roleOf(L, pid){
  const t = teamOfPlayer(L, pid);
  if(t && t.id === myTeamIdOf(L)){
    const c = contractOf(L, pid);
    return c.role || "role";
  }
  return contractOf(L, pid).role || "role";
}
function minutesForRole(role, rotSize){
  const base = {star:34, starter:31, sixth:25, role:17, bench:9}[role] || 15;
  const k = rotSize>=10? 0.9 : (rotSize<=7? 1.1 : 1);
  return Math.round(base*k);
}
function staffOf(L){
  const g = ensureG9(L);
  function byId(id){ return id? COACHES.filter(function(c){ return c.id===id; })[0] : null; }
  return {
    hc: byId(g.staff.hc), ac: byId(g.staff.ac),
    off: byId(g.staff.off), def: byId(g.staff.def),
    get offBonus(){ return g.staff.off? 0.04 : 0; },
    get defBonus(){ return g.staff.def? 0.04 : 0; },
    offLv: (g.staff.hc? (byId(g.staff.hc)||{}).off||0 : 0) + (g.staff.off? 2:0),
    defLv: (g.staff.hc? (byId(g.staff.hc)||{}).def||0 : 0) + (g.staff.def? 2:0),

/* 每周训练结算 */
function runWeeklyTraining(L, force){
  const g = ensureG9(L);
  const prog = trainProgramInfo(L);
  const inf = trainIntensityInfo(g.train.intensity);
  const st = staffOf(L);
  if(g.train.weekly < 100 && !force) return null;
  g.train.weekly = Math.max(0, g.train.weekly - 100);
  const kFac = 1 + facilityLv(L,"f1")*0.05;
  const kDev = 1 + st.devLv*0.06;
  const kInt = {1:0.4, 2:1.0, 3:1.35, 4:1.7}[g.train.intensity] || 1;
  const t = myTeam();
  let grown = 0;
  const msec = Math.max(0, (S && S.sim && S.sim.sec)? S.sim.sec : 0);
  (t.roster||[]).forEach(function(pid){
    const p = L.byId[pid]; if(!p) return;
    const dev = devOf(L, pid);
    const age = p.age||24;
    const youngK = age<=21? 1.5 : (age<=24? 1.2 : (age<=28? 0.85 : (age<=32? 0.5 : 0.2)));
    const fac = (1 + facilityLv(L,"f4")*0.07*(age<=23?1:0.4));
    let gain = 0.55 * kFac * kDev * kInt * youngK * fac * (prog.cost||1);
    if(msec>400) gain *= 0.7;
    gain = Math.max(0, gain * (0.7 + Math.random()*0.6));
    if(gain < 0.05) return;
    growAttr(p, pickOne(prog.attr), gain*0.7);
    growAttr(p, pickOne(prog.attr), gain*0.3);
    dev.points = (dev.points||0) + Math.round(gain*10)/10;
    dev.hist = dev.hist||[];
    if(dev.hist.length<40) dev.hist.push({y: L.year, d: L.day, g: Math.round(gain*10)/10});
    grown += 1;
    const fatAdd = {1: 1.5, 2: 4, 3: 7.5, 4: 12}[g.train.intensity] || 4;
    g.train.fatigue[pid] = clamp((g.train.fatigue[pid]||0) + fatAdd - staffOf(L).morLv*0.4, 0, 100);
    alsoRecomputeOV(p);
  });
  const msg = grown? ("本次训练共 "+grown+" 名球员获得属性提升。") : "本次训练收效甚微，球员状态已恢复到常规水平。";
  addNews(L, "system", "训练课结束", msg + "（"+prog.n+" · "+trainIntensityInfo(g.train.intensity).n+"）", 1);
  storyXp(L, 4, "球队完成周期训练");
  return msg;
}
function growAttr(p, key, amount){
  if(!key || amount<=0) return;
  const max = 99;
  p.at = p.at || {};
  const cur = Number(p.at[key]!=null? p.at[key] : p[key]) || 60;
  const pot = Number(p.pot!=null? p.pot : 85);
  const ceiling = clamp(Math.round(pot + 4), cur, 99);
  const hardCap = key==="ft"? 99 : ceiling;
  const nv = Math.min(hardCap, cur + amount);
  p.at[key] = nv;
  p[key] = nv;
}
function alsoRecomputeOV(p){
  const ov = computeOV(p);
  if(ov != null) p.ov = ov;
}
function computeOV(p){
  const at = p.at||{};
  const keys = ["ins","mid","tp","ft","stl","blk","orb","drb","pas","han","diq","str","spd","jmp","end","dur"];
  let has = false, sum = 0, n = 0;
  keys.forEach(function(k){ if(at[k]!=null){ has = true; sum += at[k]; n++; } });
  if(!has) return null;
  return Math.round(sum/n);
}

       '<button class="btn" data-act="devBoost">投入专项资金培养（$12.0M）</button></div>';
  h += '<div class="hint">发展潜力与年龄、训练项目、训练馆/青训学院等级相关；超过潜力的球员很难继续成长，应考虑交易换取资产。</div>';

/* ---------------- 3. 王朝叙事 ---------------- */
function renderStory(){
  const L = S.L, g = ensureG9(L);
  const ch = g.story.chapter||1;
  const need = g.story.level*120;
  const chapters = storyChapterList(L);
  let h = cardHead("🎭", "王朝剧情 · "+STORY_SERIES, '<span class="tagline">Lv.'+g.story.level+' · '+g.story.xp+' / '+need+' XP</span>');
  h += '<div class="mbar" style="height:8px"><i style="width:'+clamp(g.story.xp/need*100,0,100)+'%;background:linear-gradient(90deg,var(--acc2),var(--gold))"></i></div>';
  h += '<div class="grid g4" style="margin-top:10px">';
  h += statBox("当前章节", "第 "+ch+" 章");
  h += statBox("已完成", (g.story.log||[]).length+" 个节点");
  h += statBox("球迷情绪", Math.round(g.fanMood)+" / 100", g.fanMood>60? "var(--green)":"var(--gold)");
  h += statBox("化学反应", Math.round(g.chem)+" / 100", g.chem>60? "var(--green)":"var(--gold)");
  h += '</div>';
  h += '<div class="grid g2" style="margin-top:10px">';
  h += '<div class="card"><div class="ct">章节进度</div>';
  chapters.forEach(function(c){
    const done = (g.story.log||[]).some(function(x){ return x.id===c.id; });
    h += '<div class="row'+(done?" done":"")+'"><div class="rmain"><b>'+(done?"✅ ":"⬜ ")+esc(c.n)+'</b><span>'+esc(c.d)+'</span></div>';
    h += '<div class="rend"><span class="tag'+(done?" green":"")+'">'+(done?"已完成":"进行中")+'</span></div></div>';
  });
  h += '</div>';
  h += '<div class="card"><div class="ct">事件日志</div><div class="scroll y240">';
  if(!(g.story.log||[]).length) h += '<div class="empty">尚无剧情记录，推进赛季即会触发。</div>';
  else g.story.log.slice(-16).reverse().forEach(function(x){
    h += '<div class="newsitem"><div class="nt">'+esc(x.t)+'</div><div class="nb">'+esc(x.b)+'</div><div class="nd">'+esc(x.tm||"")+'</div></div>';
  });
  h += '</div></div>';
  h += '</div>';
  h += '<div class="card" style="margin-top:10px"><div class="ct">王朝目标</div>';
  const goals = storyGoals(L);
  goals.forEach(function(x){
    h += '<div class="row"><div class="rmain"><b>'+esc(x.n)+'</b><span>'+esc(x.d)+'</span></div><div class="rend"><span class="tag'+(x.ok?" green":"")+'">'+(x.ok?"达成":"未达成")+'</span></div></div>';
  });
  h += '<div class="btnrow" style="margin-top:10px"><button class="btn pri" data-act="storyAdvance">推进剧情 / 查看内幕</button></div>';
  h += '</div>';
  return h;
}
function storyChapterList(L){
  const g = ensureG9(L);
  return [
    {id:"c1", n:"第一章 · 新官上任", d:"接管球队，确立阵容与战术方向。"},
    {id:"c2", n:"第二章 · 更衣室博弈", d:"处理球员角色与出场时间的矛盾。"},
    {id:"c3", n:"第三章 · 交易与流言", d:"在交易截止日前做出关键补强。"},
    {id:"c4", n:"第四章 · 冲击季后赛", d:"锁定季后赛席位并在系列赛中生存。"},
    {id:"c5", n:"第五章 · 冠军拼图", d:"补上最后一块拼图，向总冠军发起冲击。"},
    {id:"c6", n:"第六章 · 王朝延续", d:"维持争冠窗口，完成新老交替。"}
  ];
}
function storyGoals(L){
  const g = ensureG9(L);
  const t = myTeam();
  const winPct = (t.w+t.l)? t.w/(t.w+t.l) : 0;
  const per = L.teamPer || {};
  const myPer = per[t.id] ? (per[t.id].w/(Math.max(1,per[t.id].w+per[t.id].l))) : winPct;
  const o = [];
  o.push({n:"完成新赛季开幕", d:"进入常规赛并打完第一场。", ok: (t.w+t.l)>0});
  o.push({n:"建立稳定的教练体系", d:"指定一位主教练。", ok: !!g.staff.hc});
  o.push({n:"设施升级 3 项", d:"任意 3 项设施达到 2 级。", ok: FACILITIES.filter(function(f){ return (g.facilities[f.id]||0)>=2; }).length>=3});
  o.push({n:"胜率达到 50%", d:"当前 "+(myPer*100).toFixed(0)+"%。", ok: myPer>=0.5});
  o.push({n:"赢得一座总冠军", d:"王朝的最终证明。", ok: (g.legacy.titles||0)>0});
  return o;
}

/* ---------------- 2. 通用弹窗 ---------------- */
function g9Modal(o){
  o = o || {};
  let ov = document.getElementById("g9ov");
  if(!ov){
    ov = document.createElement("div");
    ov.id = "g9ov";
    ov.addEventListener("click", function(e){
      if(e.target === ov){ g9Close(); return; }
      const x = e.target.closest(".g9x");
      if(x){ g9Close(); return; }
      const c = e.target.closest(".g9c");
      if(c && ov.__ctx && typeof ov.__ctx.onPick === "function"){
        const i = Number(c.getAttribute("data-i"));
        ov.__ctx.onPick(i);
      }
    });
    document.body.appendChild(ov);
  }
  let h = '<div class="g9box">';
  h += '<div class="g9h">'+(o.ic? '<span class="g9ic">'+o.ic+'</span>':'')+'<span>'+esc(o.title||"")+'</span><span class="g9x">✕</span></div>';
  if(o.sub) h += '<div style="font-size:11.5px;color:var(--dim2,#7d879b);margin:-4px 0 8px">'+esc(o.sub)+'</div>';
  h += '<div class="g9body">'+(o.html||"")+'</div>';
  if(o.choices && o.choices.length){
    h += '<div class="g9ch">';
    o.choices.forEach(function(c, i){
      h += '<div class="g9c" data-i="'+i+'"><b>'+esc(c.label)+'</b>'+(c.desc? '<span>'+esc(c.desc)+'</span>':'')+'</div>';
    });
    h += '</div>';
  }
  if(o.buttons && o.buttons.length){
    h += '<div class="btnrow" style="margin-top:14px">';
    o.buttons.forEach(function(b){
      h += '<button class="btn '+(b.pri?"pri":"")+'" data-i="'+b.i+'">'+esc(b.label)+'</button>';
    });
    h += '</div>';
  }
  h += '</div>';
  ov.innerHTML = h;
  ov.__ctx = o;
  ov.classList.add("on");
  if(o.buttons && o.buttons.length){
    ov.querySelectorAll(".btn").forEach(function(b){
      b.addEventListener("click", function(){
        const i = Number(b.getAttribute("data-i"));
        const f = o.buttons.filter(function(x){ return x.i===i; })[0];
        if(f && typeof f.on === "function") f.on();
        if(!(f && f.keep)) g9Close();
      });
    });
  }
}
function g9Close(){
  const ov = document.getElementById("g9ov");
  if(ov){ ov.classList.remove("on"); ov.innerHTML = ""; ov.__ctx = null; }
}
function g9Info(title, html, ic){
  g9Modal({title: title, html: html, ic: ic||"📄", buttons: [{i:0, label:"知道了", pri:true}]});
}

const G9 = {};

G9.center = function(){
  const L = S.L, g = ensureG9(L);
  const evs = g.events || [];
  let h = "";
  if(evs.length){
    h += '<div style="font-size:12.5px;font-weight:800;margin-bottom:6px">待处理事件 · '+evs.length+'</div>';
    evs.forEach(function(ev, i){
      h += '<div class="row"><div class="rmain"><b>'+ev.ic+' '+esc(ev.title)+'</b><span>'+esc(ev.brief||"")+'</span></div>';
      h += '<div class="rend"><button class="btn pri sm" data-g9ev="'+i+'">处理</button></div></div>';
    });
  } else {
    h += '<div class="empty">暂无待处理事件</div>';
  }
  const unread = g.inbox.filter(function(m){ return !m.read; });
  h += '<div style="font-size:12.5px;font-weight:800;margin:12px 0 6px">未读消息 · '+unread.length+'</div>';
  if(!unread.length) h += '<div class="empty">没有未读消息</div>';
  unread.slice(0,6).forEach(function(m){
    h += '<div class="row"><div class="rmain"><b>'+esc(m.title)+'</b><span>'+esc(m.body)+'</span></div></div>';
  });
  g9Modal({title:"消息中心", ic:"📬", html:h, buttons:[
    {i:0, label:"全部已读", on:function(){ g.inboxUnread=0; g.inbox.forEach(function(m){ m.read=true; }); render(); }},
    {i:1, label:"关闭", pri:true}
  ]});
  const ov = document.getElementById("g9ov");
  if(ov && evs.length){
    ov.querySelectorAll("[data-g9ev]").forEach(function(b){
      b.addEventListener("click", function(){
        g9Close();
        setTimeout(function(){ g9OpenEvent(Number(b.getAttribute("data-g9ev"))); }, 120);
      });
    });
  }
};

/* ============================================================
   模块 11：交互补全层 / 深度系统执行层 / 复合页面
   —— 本模块提供：
      0) 观测与结算小工具（深度状态、运营资金、交易状态、轮换归一化）
      1) p 层动作补全（close / 轮换 / 战术 / 预算 / 交易 / 报价 / 续约 / 存档）
      2) 范围输入（input 事件）派发
      3) 深度系统动作（教练组 / 设施 / 合同 / 训练 / 培养 / 王朝剧情 / 消息）
      4) JSON 安全的事件系统（球队事件模板 + 处理结算）
      5) 深度推进 tick（训练周进度、疲劳衰减、运营资金、随机事件、剧情旗标）
      6) 复合页面（roster / league / trade / draft / finance / save 的深度扩展）
   ============================================================ */

/* ==================== 0. 观测与结算小工具 ==================== */

function deepEnsure(L){
  const g = ensureG9(L);
  if(!Array.isArray(g.events)) g.events = [];
  if(typeof g.cash !== "number" || isNaN(g.cash)) g.cash = 60;
  return g;
}
function cashOf(L){ return deepEnsure(L).cash; }

function spendCash(L, n, why){
  const g = deepEnsure(L), c = g.cash;
  if(c + 0.001 < n){ toast("运营资金不足（可用 "+money(c)+"）"); return false; }
  g.cash = Math.round((c - n)*10)/10;
  return true;
}
function earnCash(L, n){
  const g = deepEnsure(L);
  g.cash = Math.round((g.cash + n)*10)/10;
}

/* 交易状态（与 p7 的 renderTrade / tradeSelectModal 共用同一份结构） */
function ensureTrade(L){
  if(!S.trade || typeof S.trade !== "object") S.trade = {a: L.myTid, b: null, ap: [], bp: [], apk: [], bpk: []};
  const tr = S.trade;
  if(!Array.isArray(tr.ap)) tr.ap = [];
  if(!Array.isArray(tr.bp)) tr.bp = [];
  if(!Array.isArray(tr.apk)) tr.apk = [];
  if(!Array.isArray(tr.bpk)) tr.bpk = [];
  if(tr.a == null) tr.a = L.myTid;
  if(tr.b === undefined) tr.b = null;
  return tr;
}
function tidInArr(arr, id){
  for(let i=0;i<arr.length;i++) if(String(arr[i])===String(id)) return i;
  return -1;
}

/* 轮换归一化：兼容 p3 的 autoLineup 返回值 */
function normalizeLineup(lu, t){
  let starters = [], mins = {};
  if(Array.isArray(lu)) starters = lu.slice();
  else if(lu && typeof lu === "object"){
    starters = (lu.starters || lu.start || lu.s || []).slice();
    mins = lu.mins || lu.minutes || {};
  }
  if(!starters.length){
    starters = sortedRoster(S.L, t).slice(0,5).map(function(p){ return p.id; });
  }
  if(!mins || typeof mins !== "object") mins = {};
  starters.forEach(function(id){ if(!mins[id]) mins[id] = 32; });
  return {starters: starters, minutes: mins};
}

/* ---- 签名适配：dispatchAct 以 (v, el, ev) 调用，此处统一转成元素优先 ---- */
const G9_EL_ACTS = ["close","editLineup","lineupDone","autoLineup","toggleStart","minRange","strat","stratRange",
  "budget","tradeFor","tradeEdit","tradeToggle","tradeRm","tradeReset","faConfirm","reSign","saveSlot","loadSlot","impChange"];
const G9_ACT_NAMES = ["coachMarket","coachHire","coachFire","facilityUp","contractRole","contractExt","trainProg",
  "trainLv","trainWeek","trainRest","devPlan","devAuto","devBoost","storyAdvance","readMsg","clearInbox","center","legend"];
function g9StubEl(v){
  const s = (v === null || v === undefined) ? "" : String(v);
  return {
    getAttribute:function(k){ return (k === "data-v") ? (s || null) : null; },
    value:s, checked:false, files:null, parentNode:null, dataset:{}, children:[],
    click:function(){}, querySelector:function(){ return null; }, querySelectorAll:function(){ return []; }
  };
}
G9_EL_ACTS.forEach(function(n){
  const f = ACT[n];
  if(typeof f !== "function") return;
  ACT[n] = function(v, el, ev){ return f(el || g9StubEl(v), ev); };
});

/* ==================== 3. 深度系统动作 ==================== */

const SLOT_NAME = {hc:"主教练", ac:"首席助教", off:"进攻教练", def:"防守教练"};

/* ---- 教练组 ---- */
function coachById(id){
  for(let i=0;i<COACHES.length;i++) if(COACHES[i].id === id) return COACHES[i];
  return null;
}
function firstEmptySlot(g){
  const order = ["hc","ac","off","def"];
  for(let i=0;i<order.length;i++) if(!g.staff[order[i]]) return order[i];
  return null;
}
function hireCoachTo(L, slot, c){
  const g = deepEnsure(L);
  const cur = g.staff[slot];
  const sal = Number(c.sal)||2;
  if(cur && cur !== c.id){
    const oc = coachById(cur);
    const fee = oc ? Math.round(oc.sal*0.5*10)/10 : 0;
    if(!spendCash(L, fee, "教练解约")) return false;
  }
  if(g.staff[slot] === c.id){ toast(c.n+" 已在该岗位"); return false; }
  if(!spendCash(L, sal, "教练签约")) return false;
  g.staff[slot] = c.id;
  addNews(L, "system", "教练组变动", c.n+" 加盟，出任"+SLOT_NAME[slot]+"，年薪 "+money(sal)+"。", 2);
  addInbox(L, "staff", "🧑‍💼 教练组变动", c.n+" 出任"+SLOT_NAME[slot]+"（"+c.tag+" · 年薪 "+money(sal)+"）", {slot: slot, coach: c.id});
  return true;
}

G9.coachHire = function(el){
  const L = S.L, g = deepEnsure(L);
  const c = coachById(el.getAttribute("data-k")); if(!c) return;
  let slot = el.getAttribute("data-slot") || "";
  if(!slot || g.staff[slot]){
    const empty = firstEmptySlot(g);
    if(empty && (!slot || g.staff[slot])) { slot = empty; }
  }
  if(!slot){
    const keys = ["hc","ac","off","def"];
    g9Modal({title:"选择岗位", ic:"🧑‍💼", sub:c.n+" · 年薪 "+money(c.sal),
      html:'<div class="hint">四个岗位均已有人，选择要替换的岗位（原教练将获得 50% 年薪作为解约金）。</div>',
      choices: keys.map(function(k){
        const cur = coachById(g.staff[k]);
        return {label: SLOT_NAME[k], desc: (cur? "现任："+cur.n+"（解约金 "+money(Math.round(cur.sal*0.5*10)/10)+"）" : "空缺")};
      }),
      onPick: function(i){
        const k = ["hc","ac","off","def"][i];
        if(hireCoachTo(L, k, c)){ g9Close(); render(); toast("已签下 "+c.n); }
      }});
    return;
  }
  if(hireCoachTo(L, slot, c)){ g9Close(); render(); toast("已签下 "+c.n+" 出任"+SLOT_NAME[slot]); }
};

G9.coachFire = function(el){
  const L = S.L, g = deepEnsure(L);
  const slot = el.getAttribute("data-k");
  const cur = g.staff[slot]; if(!cur) return;
  const c = coachById(cur); if(!c) { g.staff[slot] = ""; render(); return; }
  const fee = Math.round(c.sal*0.5*10)/10;
  if(!spendCash(L, fee, "教练解约")) return;
  g.staff[slot] = "";
  addNews(L, "system", "教练离任", c.n+" 与球队解约，球队支付解约金 "+money(fee)+"。", 1);
  render(); toast("已与 "+c.n+" 解约（解约金 "+money(fee)+"）");
};

G9.contractRole = function(el){
  const L = S.L, pid = el.getAttribute("data-k");
  const p = L.byId[pid]; if(!p) return;
  const c = contractOf(L, pid);
  const keys = Object.keys(ROLE_INFO);
  g9Modal({title:"设定角色定位", ic:"📄", sub:p.name+" · "+fmtM(Number(p.salary)||0),
    html:'<div class="hint">角色定位决定出场时间、球员满意度与交易价值。</div>',
    choices: keys.map(function(k){
      return {label: ROLE_INFO[k].n, desc: ROLE_INFO[k].d || "", cur: c.role===k};
    }),
    onPick: function(i){
      const k = keys[i]; if(!k) return;
      const old = c.role;
      c.role = k; p.role = k;
      const rel = relOf(L, pid);
      const up = (k==="star"||k==="starter")? 5 : (k==="bench"? -6 : 0);
      rel.morale = clamp(rel.morale + up, 0, 100);

/* ---- 球员培养 ---- */
G9.devPlan = function(el){
  const L = S.L, pid = el.getAttribute("data-p") || el.getAttribute("data-k");
  const k = el.getAttribute("data-k");
  const p = L.byId[pid]; if(!p || !PLAN_INFO[k]) return;
  devOf(L, pid).plan = k;
  render(); toast(p.name+" 的发展路线："+PLAN_INFO[k].n);
};
G9.devAuto = function(){
  const L = S.L, g = deepEnsure(L), t = myTeam();
  (t.roster||[]).forEach(function(pid){
    const p = L.byId[pid]; if(!p) return;
    const d = devOf(L, pid);
    const age = p.age||24, pot = p.pot||80, ov = Number(p.ov!=null? p.ov : (p.ovr||70));
    let plan = "balanced";
    if(age <= 21 && pot - ov >= 6) plan = "star";
    else if((p.pos==="PG"||p.pos==="SG") && ov < pot) plan = "offense";
    else if((p.pos==="PF"||p.pos==="C")) plan = (age<=24? "athletic" : "defense");
    else if(pot - ov >= 4) plan = "offense";
    d.plan = plan;
  });
  render(); toast("已按年龄与潜力自动分配发展路线");
};
G9.devBoost = function(){
  const L = S.L, t = myTeam(), g = deepEnsure(L);
  const cost = 12;
  if(!spendCash(L, cost, "专项培养")) return;
  let n = 0;
  (t.roster||[]).forEach(function(pid){
    const p = L.byId[pid]; if(!p) return;
    if((p.age||24) > 25) return;
    const d = devOf(L, pid);
    const keys = PLAN_ATTRS[d.plan] || PLAN_ATTRS.balanced;
    d.points = (d.points||0) + 26;
    const gain = 1.1 + facilityLv(L,"f4")*0.12 + staffOf(L).devLv*0.08;
    keys.forEach(function(k){ if(typeof growAttr === "function") growAttr(p, k, gain/keys.length); });
    p.ov = computeOV(p);
    n++;
  });
  alsoRecomputeOV(L);
  addNews(L, "system", "专项培养投入", "球队投入 "+money(cost)+" 用于年轻球员专项培养，共 "+n+" 人受益。", 2);
  render(); toast("专项培养完成（"+n+" 名年轻球员属性成长）");
};

function applyEventEff(L, eff, log){
  const g = deepEnsure(L), t = myTeam();
  if(eff.morale){
    (t.roster||[]).forEach(function(pid){
      const r = relOf(L, pid);
      r.morale = clamp(r.morale + eff.morale, 0, 100);
    });
  }
  if(eff.chem) g.chem = clamp(g.chem + eff.chem, 0, 100);
  if(eff.fan) g.fanMood = clamp(g.fanMood + eff.fan, 0, 100);
  if(eff.cash) g.cash = Math.round((cashOf(L) + eff.cash)*10)/10;
  if(eff.fat){
    (t.roster||[]).forEach(function(pid){
      g.train.fatigue[pid] = clamp((g.train.fatigue[pid]||0) + eff.fat, 0, 100);
    });
  }
  if(eff.dev){
    (t.roster||[]).forEach(function(pid){
      const p = L.byId[pid]; if(!p) return;
      if((p.age||24) > 25) return;
      const d = devOf(L, pid);
      const keys = PLAN_ATTRS[d.plan] || PLAN_ATTRS.balanced;
      d.points = (d.points||0) + eff.dev*2;
      keys.forEach(function(k){ if(typeof growAttr === "function") growAttr(p, k, eff.dev*0.08); });
      p.ov = computeOV(p);
    });
    alsoRecomputeOV(L);
  }
  if(log) addNews(L, "media", "球队动态", log, 1);
}

function genEvent(L, tplId){
  const g = deepEnsure(L);
  if(g.events.length >= 5) return null;
  const ids = Object.keys(EV_TEMPLATES);
  const id = tplId || ids[Math.floor(Math.random()*ids.length)];
  const tpl = EV_TEMPLATES[id]; if(!tpl) return null;
  const ev = {id: "ev"+Date.now()+Math.floor(Math.random()*97), tpl: id, ic: tpl.ic,
    title: tpl.t, brief: tpl.b, day: L.day||1, year: L.year};
  g.events.push(ev);
  addInbox(L, "event", tpl.ic+" "+tpl.t, tpl.b, {tpl: id, ev: ev.id});
  return ev;
}
function maybeEvent(L, p){
  if(Math.random() < p) genEvent(L);
}

/* ==================== 5. 深度推进 tick ==================== */

function storyLog(L, id, t, b){
  const g = deepEnsure(L);
  g.story.log.push({id: id||"", t: t, b: b, tm: seasonLabel(L)+" · 第"+(L.day||1)+"天"});
  if(g.story.log.length > 90) g.story.log.shift();
}

function syncStoryFlags(L){
  const g = deepEnsure(L), t = myTeam();
  if((t.w||0) >= 5) g.story.wins5 = true;
  if((t.w||0) >= 20) g.story.wins20 = true;
  if(t.playoff) g.story.playoff = true;
  if(L.po && L.po.champ === L.myTid) g.story.champ = true;
}

function deepTick(L){
  const g = deepEnsure(L), t = myTeam();
  /* 1) 训练周进度（每 7 天结算一次训练营成果） */
  g.train.weekly = (g.train.weekly||0) + 14.3;
  if(g.train.weekly >= 100){
    g.train.weekly = 0;
    const msg = runWeeklyTraining(L, true);
    if(msg) addInbox(L, "train", "🏋 训练营周报", msg, {});
  }
  /* 2) 疲劳自然衰减 */
  (t.roster||[]).forEach(function(pid){
    g.train.fatigue[pid] = clamp((g.train.fatigue[pid]||0) - 1.6, 0, 100);
  });
  /* 3) 运营资金：比赛日收入 − 教练组日薪 */
  const st = staffOf(L);
  const staffSal = (st.hc?st.hc.sal:0)+(st.ac?st.ac.sal:0)+(st.off?st.off.sal:0)+(st.def?st.def.sal:0);
  const income = 1.0 + g.fanMood/60 + facilityLv(L,"f6")*0.18;
  g.cash = Math.round((g.cash + income - staffSal/360)*10)/10;
  if(g.cash < 0) g.cash = 0;
  /* 4) 士气随战绩与角色小幅回归 */
  (t.roster||[]).forEach(function(pid){
    const r = relOf(L, pid);
    const p = L.byId[pid]; if(!p) return;
    r.morale = clamp(r.morale + (r.morale < 50 ? 0.5 : -0.15), 0, 100);
    r.starter = (t.lineup && t.lineup.starters && tidInArr(t.lineup.starters, pid) >= 0);
  });
  /* 5) 票房与球迷情绪 */
  const per = (L.teamPer||{})[t.id];
  if(per && (per.w + per.l) > 0){
    const pct = per.w / Math.max(1, per.w + per.l);
    g.fanMood = clamp(g.fanMood + (pct - 0.5)*0.9 + (t.budget? (t.budget.market-1)*0.4 : 0), 0, 100);
  }
  /* 6) 随机球队事件 */
  maybeEvent(L, 0.09);
  /* 7) 旗标同步 */
  syncStoryFlags(L);
}

/* 赛季结束 → 王朝档案记账 */
function recordLegacy(L){
  if(!L || !L.po) return;
  const g = deepEnsure(L), t = myTeam();
  const lg = g.legacy;
  if(!lg) return;
  if(L.po.champ != null && L.po.champ === L.myTid){
    lg.titles = (lg.titles||0) + 1;
    lg.finals = (lg.finals||0) + 1;
  }
  if(t.playoff) lg.playoffs = (lg.playoffs||0) + 1;
  if((t.w||0) > (lg.best||0)) lg.best = t.w||0;
  syncStoryFlags(L);
}

(function installDeepWraps(){
  if(typeof playDay === "function"){
    const _playDay = playDay;
    playDay = function(L){
      const r = _playDay.apply(this, arguments);
      try{ deepTick(L || (S && S.L)); }catch(e){ console.error("[g9] deepTick", e); }
      return r;
    };
  }
  if(typeof nextSeason === "function"){
    const _nextSeason = nextSeason;
    nextSeason = function(L){
      try{ recordLegacy(L || (S && S.L)); }catch(e){ console.error("[g9] recordLegacy", e); }
      return _nextSeason.apply(this, arguments);
    };
  }
  if(typeof seasonOver === "function"){
    const _seasonOver = seasonOver;
    seasonOver = function(L){
      const r = _seasonOver.apply(this, arguments);
      try{ syncStoryFlags(L || (S && S.L)); }catch(e){}
      return r;
    };
  }
  console.log("[g9] 深度系统已接入：训练/培养/剧情/教练组/设施/运营资金");
})();
